# Domain to service mapping
# Maps DNS domains to services deployed behind them

oauth.maxxxpavlov.online:
  service: oauth
  protocol: https
  redirect_hosts:
    - localhost
    - localhost:3000
    - 127.0.0.1
    - 127.0.0.1:3000

chrome.maxxxpavlov.online:
  service: chrome
  protocol: https



