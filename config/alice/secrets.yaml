# Secrets references
# Only secret refs are allowed, never actual values
# All actual secret values are stored in secret manager

oauth:
  client_secret:
    ref: alice/prod/oauth_client_secret
  signing_key:
    ref: alice/prod/oauth_signing_key

chrome:
  oauth_client_id:
    ref: alice/prod/chrome_oauth_client_id
  oauth_client_secret:
    ref: alice/prod/chrome_oauth_client_secret

agent_shell:
  oauth_client_id:
    ref: alice/prod/agent_shell_oauth_client_id
  oauth_client_secret:
    ref: alice/prod/agent_shell_oauth_client_secret
