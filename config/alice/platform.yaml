# Alice Platform services definition
# Each service represents a deployable component

services:
  oauth:
    type: oauth
    depends_on: []
    scale: 1
    resources:
      cpu: "0.1"
      memory: 256Mi
    repository: oauth-idp
    scopes:
      - browser.read
      - browser.control

  chrome:
    type: chrome
    depends_on:
      - oauth
    scale: 0
    resources:
      cpu: "0.5"
      memory: 1024Mi
    repository: chrome-worker
    owner_id: "293531601"



