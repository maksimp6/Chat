# Alice Platform services definition
# Each service represents a deployable component

services:
  oauth:
    type: oauth
    depends_on: []
    scale: 1
    resources:
      cpu: "0.1"
      memory: 256Mi
    repository: oauth-idp
    scopes:
      - browser.read
      - browser.control

  chrome:
    type: chrome
    depends_on:
      - oauth
    scale: 0
    resources:
      cpu: "0.5"
      memory: 1024Mi
    repository: chrome-worker
    owner_id: "293531601"

  agent-shell:
    type: agent-shell
    depends_on:
      - oauth
    scale: 1
    resources:
      cpu: "0.5"
      memory: 512Mi

  dota-commentator:
    type: dota-commentator
    depends_on:
      - oauth
    scale: 1
    resources:
      cpu: "1"
      memory: 4096Mi
      gpu: "1"
      gpu_memory: 8192Mi
    repository: dota-live-commentator
    billing:
      rate: 0.50
      currency: USD
