# Alice Platform services definition
# Machine-readable desired state. Recovery-critical facts belong here, not only in docs.

services:
  oauth:
    type: oauth
    depends_on: []
    scale: 1
    resources:
      cpu: "0.1"
      memory: 256Mi
    repository: oauth-idp
    scopes:
      - browser.read
      - browser.control

  chrome:
    type: chrome
    depends_on:
      - oauth
    scale: 0
    resources:
      cpu: "0.5"
      memory: 1024Mi
    repository: chrome-worker
    owner_id: "293531601"

  remote-desktop:
    type: remote-desktop
    depends_on:
      - oauth
    scale: 1
    resources:
      cpu: "1"
      memory: 4096Mi
    repository: rdc-browser
    provider: cloudru
    desired_state: running
    recovery:
      max_attempts: 3
      operations:
        - start
        - restart
        - redeploy_same_revision
    health:
      - cloud_resource
      - rdc_connected
      - ping
      - shell
      - filesystem
      - browser

  agent-shell:
    type: agent-shell
    depends_on:
      - oauth
    scale: 1
    resources:
      cpu: "0.5"
      memory: 512Mi
