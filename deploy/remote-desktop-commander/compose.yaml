name: alice-remote-desktop-commander
services:
  commander:
    build:
      context: .
    image: alice-remote-desktop-commander:0.2.52
    init: true
    restart: unless-stopped
    user: "1000:1000"
    group_add: ["10001"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, "seccomp=./chromium-seccomp.json"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    shm_size: 256m
    environment:
      ALICE_RDC_PAIRING_FILE: /pairing/handoff.json
    volumes:
      - ./state:/home/node
      - ./workspace:/workspace
      - ./pairing:/pairing
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: [CMD, node, /opt/desktop-commander/desktop-session.cjs, --healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 2
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
  initialize:
    profiles: [setup]
    image: alice-remote-desktop-commander:0.2.52
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes:
      - ./state:/home/node
      - ./workspace:/workspace
      - ./pairing:/pairing
    entrypoint: [bash, -euc]
    command: ["chown 1000:1000 /home/node /workspace; chmod 700 /home/node /workspace; chown 1000:10001 /pairing; chmod 2750 /pairing"]
