android.useAndroidX=true

# CI and local Android builds should reuse work instead of configuring and
# recompiling the same project from scratch on every invocation.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.vfs.watch=false
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Kotlin compilation is part of the Android critical path. Keep incremental
# compilation enabled so restored Gradle state can shorten warm APK builds.
kotlin.incremental=true
