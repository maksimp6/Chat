<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
    <title>Alice Pro</title>
    {% set static_root = (preview_base_path ~ "/static") if preview_base_path else "/static" %}
    <link rel="stylesheet" href="{{ static_root }}/style.css?v={{ static_version }}">
    <link rel="icon" type="image/svg+xml" href="{{ static_root }}/favicon.svg?v={{ static_version }}">
    <link rel="shortcut icon" href="{{ static_root }}/favicon.svg?v={{ static_version }}">

    <script id="alice-boot" src="{{ static_root }}/boot.js?v={{ static_version }}" data-base-path="{{ preview_base_path or '' }}" data-static-base="{{ static_root }}" data-static-version="{{ static_version }}"></script>
    <script src="{{ static_root }}/file_manager.js?v={{ static_version }}" defer></script>
    <script src="{{ static_root }}/treasury.js?v={{ static_version }}" defer></script>
    <script src="{{ static_root }}/settings/ui_helpers.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/settings/settings_storage.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/settings/settings_mcp.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/settings/settings_params.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/settings/settings_modal.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/settings.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/core.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/theme_assistant.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/sidebar.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/models.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/chat.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/trace_viewer.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/trace_viewer_timing_fix.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/trace_viewer_error_ui.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/trace_viewer_auto.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/voice.js?v={{ static_version }}" defer></script>
    <script src="{{ static_root }}/android_diagnostics.js?v={{ static_version }}" async data-optional-script="true"></script>
    <script src="{{ static_root }}/eruda_init.js?v={{ static_version }}" async data-optional-script="true"></script>
<link rel="stylesheet" href="{{ static_root }}/departments.css?v={{ static_version }}"><script src="{{ static_root }}/departments.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/partner_relations.js?v={{ static_version }}" defer></script>
</head>
<body>
<div id="app-root" class="alice-pro-app">
<div id="sidebar"><div id="sidebar-header"><button id="new-chat-btn">+ Новый чат</button><button id="close-sidebar-btn">&times;</button></div><div id="conv-list"></div></div><div id="overlay"></div>
<div id="main"><div id="header"><div class="header-row header-row-primary"><button id="menu-btn" class="header-btn">☰</button><button id="model-btn" class="header-btn model-btn" title="Выбор модели" aria-label="Выбор модели">🤖</button><button id="tools-btn" class="header-btn" title="Локальные инструменты">🧰</button><button id="ssh-runtime-btn" class="header-btn" title="SSH Runtime" aria-label="SSH Runtime">🔐</button></div><div id="header-actions-2" class="header-row header-row-secondary"><button id="mcp-btn" class="header-btn" title="Внешние MCP шлюзы">🌐</button><button id="settings-btn" class="header-btn" title="Параметры генерации">⚙️</button><button id="file-manager-btn" class="header-btn" title="Файловый менеджер">📁</button><button id="treasury-btn" class="header-btn" title="Казначейство" aria-label="Казначейство">💰</button><button id="dozzle-btn" class="header-btn" title="Логи Dozzle" aria-label="Логи Dozzle">🐳</button><button id="departments-btn" class="header-btn" title="Departments">🏢</button><button id="update-app-btn" class="header-btn" title="Обновить приложение">⬆️</button><button id="provider-credentials-btn" class="header-btn" title="Ключи провайдеров" aria-label="Ключи провайдеров">🔑</button><button id="memory-btn" class="header-btn" title="Управление памятью" aria-label="Управление памятью">🧠</button><button id="theme-toggle" class="header-btn" title="Цветовая схема" aria-label="Цветовая схема">🌙</button></div></div>
<div id="chatbox"><div class="empty-state">Начните диалог или выберите модель</div></div>
<div id="voice-ui"><canvas id="waveform"></canvas><div id="voice-status"></div><button id="mic-btn">🎤</button></div>
<div id="text-ui"><div id="response-mode-wrap" style="display:none;"><select id="response-mode-select"><option value="audio">🔊 Голос</option><option value="text">📝 Текст</option><option value="both">🔊+📝 Оба</option></select></div><button id="upload-image-btn" class="icon-btn" style="display:none;">📷</button><button id="mic-btn-inline" class="icon-btn" style="display:none;">🎤</button><input id="msg-input" type="text" placeholder="Сообщение..." autocomplete="off"><button id="send-btn">➤</button></div></div>
<div id="model-modal" class="modal"><div class="modal-content"><h3>Выбор модели</h3><button id="close-modal">&times;</button><div id="model-list"></div></div></div></div>
<div id="memoryModal" class="memory-modal" hidden><div class="memory-modal-content" role="dialog" aria-modal="true" aria-labelledby="memoryModalTitle"><button id="memoryCloseBtn" class="memory-modal-close" type="button" aria-label="Закрыть">&times;</button><h2 id="memoryModalTitle" class="memory-modal-title">Управление памятью</h2><div class="memory-config"><label class="memory-config-option"><input type="checkbox" id="memEnabled"> Включить память</label><label class="memory-config-option">Макс. фактов: <input type="number" id="memLimit" class="memory-limit" min="1" max="50"></label></div><div class="memory-clear"><button id="memoryClearBtn" class="memory-clear-btn" type="button">Очистить всю память</button></div><h3 class="memory-facts-title">Факты (<span id="memCount">0</span>)</h3><div id="memoryFactsList" class="memory-facts-list"></div></div></div>
<script src="{{ static_root }}/settings/ssh_runtime_modal.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/header_actions.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/memory_panel.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/provider_credentials.js?v={{ static_version }}" defer></script><script src="{{ static_root }}/dozzle.js?v={{ static_version }}" defer></script>
</body></html>
