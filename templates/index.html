<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
    <title>Alice Pro</title>
    <link rel="stylesheet" href="/static/style.css?v=12">
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>(function(){var script=document.createElement('script');script.src="//cdn.jsdelivr.net/npm/eruda";document.body?initEruda():window.addEventListener('DOMContentLoaded',initEruda);function initEruda(){if(typeof eruda!=='undefined')eruda.init();else{var s=document.createElement('script');s.src="https://cdn.jsdelivr.net/npm/eruda";s.onload=function(){eruda.init();};document.head.appendChild(s);}}})();</script>
    <script src="/static/file_manager.js" defer></script>
    <script src="/static/settings/ui_helpers.js"></script><script src="/static/settings/settings_storage.js"></script><script src="/static/settings/settings_mcp.js"></script><script src="/static/settings/settings_params.js"></script><script src="/static/settings/settings_modal.js"></script><script src="/static/settings.js"></script><script src="/static/core.js"></script><script src="/static/sidebar.js"></script><script src="/static/models.js"></script><script src="/static/chat.js"></script><script src="/static/trace_viewer.js"></script><script src="/static/trace_viewer_timing_fix.js?v=1"></script><script src="/static/trace_viewer_error_ui.js?v=1"></script><script src="/static/trace_viewer_auto.js"></script><script src="/static/voice.js"></script>
</head>
<body>
<div id="app-root" class="alice-pro-app">
<div id="sidebar"><div id="sidebar-header"><button id="new-chat-btn">+ Новый чат</button><button id="close-sidebar-btn">&times;</button></div><div id="conv-list"></div></div><div id="overlay"></div>
<div id="main"><div id="header"><button id="menu-btn" class="header-btn">☰</button><button id="model-btn" class="header-btn model-btn">🤖 Alice AI LLM</button><button id="tools-btn" class="header-btn" title="Локальные инструменты" onclick="openToolsModal()">🧰</button><button id="mcp-btn" class="header-btn" title="Внешние MCP шлюзы" onclick="window.openMcpManagerModal()">🌐</button><button id="settings-btn" class="header-btn" title="Параметры генерации" onclick="openSettingsModal()">⚙️</button><button id="file-manager-btn" class="header-btn" title="Файловый менеджер" onclick="window.openFileManagerModal()">📁</button><button id="theme-toggle" class="header-btn">🌙</button></div>
<div id="chatbox"><div class="empty-state">Начните диалог или выберите модель</div></div>
<div id="voice-ui"><canvas id="waveform"></canvas><div id="voice-status"></div><button id="mic-btn">🎤</button></div>
<div id="text-ui"><div id="response-mode-wrap" style="display:none;"><select id="response-mode-select"><option value="audio">🔊 Голос</option><option value="text">📝 Текст</option><option value="both">🔊+📝 Оба</option></select></div><button id="upload-image-btn" class="icon-btn" style="display:none;" onclick="window.uploadImage()">📷</button><button id="mic-btn-inline" class="icon-btn" style="display:none;">🎤</button><input id="msg-input" type="text" placeholder="Сообщение..." autocomplete="off"><button id="send-btn">➤</button></div></div>
<div id="model-modal" class="modal"><div class="modal-content"><h3>Выбор модели</h3><button id="close-modal">&times;</button><div id="model-list"></div></div></div></div>
<div id="memoryModal" style="display:none;position:fixed;z-index:100000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;"><div style="background:#1e1e1e;color:#fff;padding:20px;border-radius:8px;width:450px;max-height:80vh;overflow-y:auto;position:relative;font-family:sans-serif;box-shadow:0 4px 15px rgba(0,0,0,0.5);"><span onclick="closeMemoryModal()" style="position:absolute;right:15px;top:10px;font-size:24px;cursor:pointer;color:#aaa;">&times;</span><h2 style="margin-top:0;font-size:18px;border-bottom:1px solid #444;padding-bottom:8px;">Управление памятью</h2><div style="margin:15px 0;padding:10px;background:#2a2a2a;border-radius:5px;"><label style="display:block;margin-bottom:8px;cursor:pointer;"><input type="checkbox" id="memEnabled" onchange="updateMemoryConfig()"> Включить память</label><label style="display:block;cursor:pointer;">Макс. фактов: <input type="number" id="memLimit" style="width:60px;background:#333;color:#fff;border:1px solid #555;padding:3px;border-radius:4px;" min="1" max="50" onchange="updateMemoryConfig()"></label></div><div style="margin-bottom:15px;"><button onclick="clearMemory(null)" style="background:#d9534f;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">Очистить всю память</button></div><h3 style="font-size:14px;margin-bottom:8px;">Факты (<span id="memCount">0</span>)</h3><div id="memoryFactsList" style="max-height:220px;overflow-y:auto;border-top:1px solid #444;padding-top:8px;"></div></div></div>
<script>
function openMemoryModal(){document.getElementById("memoryModal").style.display="flex";loadMemoryData();}function closeMemoryModal(){document.getElementById("memoryModal").style.display="none";}async function loadMemoryData(){try{let res=await fetch("/api/memory/manage");let data=await res.json();document.getElementById("memEnabled").checked=data.config.enabled;document.getElementById("memLimit").value=data.config.max_context_facts;document.getElementById("memCount").innerText=data.facts.length;let list=document.getElementById("memoryFactsList");list.innerHTML="";if(data.facts.length===0){list.innerHTML="<p style=\"color:#888;font-size:13px;\">Память пуста.</p>";return;}data.facts.forEach(f=>{let div=document.createElement("div");div.style.cssText="background:#2a2a2a;padding:8px;margin-bottom:6px;border-radius:4px;font-size:12px;";div.innerHTML=`<span style="color:#4da6ff;font-weight:bold;text-transform:uppercase;">[${f.category}]</span> ${f.fact}`;list.appendChild(div);});}catch(e){console.error(e);}}async function updateMemoryConfig(){let enabled=document.getElementById("memEnabled").checked;let limit=parseInt(document.getElementById("memLimit").value)||15;await fetch("/api/memory/config",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:enabled,max_context_facts:limit})});}async function clearMemory(cat){if(!confirm("Очистить память?"))return;await fetch("/api/memory/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({category:cat})});loadMemoryData();}
</script><script src="/static/memory_btn.js"></script>
</body></html>
