services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alice_pro}
      POSTGRES_USER: ${POSTGRES_USER:-alice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - alice_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alice} -d ${POSTGRES_DB:-alice_pro}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      ALICE_DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alice_pro}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  alice_postgres_data:
