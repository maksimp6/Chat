name: Semantic work

on:
  workflow_dispatch:
    inputs:
      query:
        description: "query text"
        required: true
        default: ""
      mode:
        description: "query | red"
        required: true
        default: "query"
      publish_issue:
        description: "issue number for the report"
        required: false
        default: ""
      allow_model_call:
        description: "Owner approves one bounded model call within a separately agreed budget"
        type: boolean
        required: true
        default: false
      approval_reference:
        description: "Reference to owner-approved scope and budget; not a currency cap"
        required: false
        default: ""

permissions: {}

concurrency:
  group: semantic-work
  cancel-in-progress: false

jobs:
  semantic:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == '1'
    name: Semantic answer over corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run semantic pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
          SEM_MODE: ${{ inputs.mode }}
          SEM_QUERY: ${{ inputs.query }}
          SEM_PUBLISH_ISSUE: ${{ inputs.publish_issue }}
          SEM_ALLOW_MODEL: ${{ inputs.allow_model_call }}
          SEM_APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SEM_QUERY" > /tmp/sem_query.txt
          args=(--mode "$SEM_MODE" --query-file /tmp/sem_query.txt)
          if [ -n "$SEM_PUBLISH_ISSUE" ]; then
            args+=(--publish-issue "$SEM_PUBLISH_ISSUE")
          fi
          if [ "$SEM_ALLOW_MODEL" = "true" ]; then
            test -n "$SEM_APPROVAL_REFERENCE" || { echo "missing owner budget approval reference" >&2; exit 2; }
            args+=(--allow-model-call)
          fi
          python scripts/semantic_pipeline.py "${args[@]}"
