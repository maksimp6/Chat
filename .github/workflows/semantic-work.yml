name: Semantic work

on:
  workflow_dispatch:
    inputs:
      query:
        description: "query text"
        required: true
        default: "симуляция офиса"
      mode:
        description: "BM25 search, bounded model answer, or Vector Store upload/search"
        type: choice
        options: [search, query, red, vector-store, repository, repository-check, repository-resume]
        required: true
        default: "search"
      corpus:
        description: "All task history or labelled dialogue sources, both open and closed"
        type: choice
        options: [tasks, dialogues]
        required: true
        default: "tasks"
      publish_issue:
        description: "issue number for the report"
        required: false
        default: ""
      allow_model_call:
        description: "Owner approves one bounded model call within a separately agreed budget"
        type: boolean
        required: true
        default: false
      allow_vector_store_write:
        description: "Owner approves one Vector Store snapshot update and one search"
        type: boolean
        required: true
        default: false
      include_repository:
        description: "Include tracked repository text files and binary file metadata"
        type: boolean
        required: true
        default: false
      approval_reference:
        description: "Reference to owner-approved scope and API limit"
        required: false
        default: ""
      resume_run_id:
        description: "Prior successful repository-check run whose saved file manifest is resumed"
        required: false
        default: ""
      verify_available:
        description: "Verify direct retrieval from completed repository packs without generation"
        type: boolean
        required: false
        default: false
  push:
    branches: [feat/semantic-pipeline]

permissions: {}

concurrency:
  group: ${{ inputs.mode == 'repository-check' && format('repository-check-{0}', github.run_id) || 'semantic-work' }}
  cancel-in-progress: false

jobs:
  repository-corpus:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'repository' || inputs.mode == 'repository-check' || inputs.mode == 'repository-resume') && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == '1'
    name: Archive repository evidence and update existing RAG without generation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      discussions: read
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Require the requested RAG upload scope
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          ALLOW_WRITE: ${{ inputs.allow_vector_store_write }}
          ALLOW_MODEL: ${{ inputs.allow_model_call }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          test "$ALLOW_WRITE" = true
          test "$ALLOW_MODEL" = false
          test -n "$APPROVAL_REFERENCE"
      - name: Checkout collector and complete Git history
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch all available repository and PR refs
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') && (inputs.mode == 'repository') }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          gaps = []
          commands = [
            ("remote-refs", ["git", "fetch", "--quiet", "origin", "+refs/heads/*:refs/remotes/origin/*", "+refs/tags/*:refs/tags/*", "+refs/pull/*/head:refs/rag/pull/*"]),
            ("git-lfs", ["git", "lfs", "fetch", "--all", "origin"]),
          ]
          for source, command in commands:
            try:
              result = subprocess.run(command, timeout=600, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if result.returncode:
                gaps.append({"source": source, "reason": "fetch_failed"})
            except (OSError, subprocess.TimeoutExpired):
              gaps.append({"source": source, "reason": "fetch_unavailable_or_timeout"})
          (Path(os.environ["RUNNER_TEMP"]) / "repository-fetch-status.json").write_text(json.dumps(gaps))
          PY
      - name: Set up Python
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare PDF text extraction
        id: policy_step_05
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') && (inputs.mode == 'repository') }}
        continue-on-error: true
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
      - name: Validate receipt run for repository recovery
        id: policy_step_06
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') && (inputs.mode == 'repository-resume') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          run_id = os.environ["RESUME_RUN_ID"]
          if not re.fullmatch(r"[0-9]{1,20}", run_id):
              raise SystemExit("invalid_resume_run_id")
          repository = os.environ["GITHUB_REPOSITORY"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs/{run_id}",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          valid = (run.get("event") == "workflow_dispatch" and run.get("conclusion") == "success"
                   and run.get("path") == ".github/workflows/semantic-work.yml"
                   and run.get("actor", {}).get("login") == repository.split("/")[0]
                   and run.get("head_repository", {}).get("full_name") == repository)
          if not valid:
              raise SystemExit("resume_run_scope_invalid")
          PY
      - name: Restore the exact saved provider receipt
        id: policy_step_07
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') && (inputs.mode == 'repository-resume') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
          name: repository-rag-receipt-${{ inputs.resume_run_id }}
          path: ${{ runner.temp }}/repository-rag-resume
      - name: Collect, redact, upload, and verify direct retrieval
        id: policy_step_08
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
          RAG_QUERY: ${{ inputs.query }}
          RAG_MODE: ${{ inputs.mode }}
          RAG_VERIFY_AVAILABLE: ${{ inputs.verify_available }}
        run: |
          set -euo pipefail
          operation=(--upload --github-passes 3)
          if [ "$RAG_MODE" = repository-check ]; then
            operation=(--provider-check)
            if [ "$RAG_VERIFY_AVAILABLE" = true ]; then
              operation+=(--verify-available)
            fi
          elif [ "$RAG_MODE" = repository-resume ]; then
            operation=(--resume-receipt "$RUNNER_TEMP/repository-rag-resume/repository-rag-receipt.json")
          fi
          python -m scripts.repository_rag \
            --git-root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --archive-dir "$RUNNER_TEMP/repository-rag" \
            --receipt "$RUNNER_TEMP/repository-rag-receipt.json" \
            --fetch-status "$RUNNER_TEMP/repository-fetch-status.json" \
            "${operation[@]}" --query "$RAG_QUERY"
      - name: Preserve receipt and visible omissions
        id: policy_step_09
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-rag-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repository-rag-receipt.json
            ${{ runner.temp }}/repository-rag/gaps.json
            ${{ runner.temp }}/repository-rag/upload-checkpoint.json
            ${{ runner.temp }}/repository-rag/index-checkpoint.json
            ${{ runner.temp }}/repository-rag/github-collection-passes.json
            ${{ runner.temp }}/repository-fetch-status.json
          if-no-files-found: warn
          retention-days: 90
      # Raw originals and HTTP cache are private to this run. Never publish them
      # as public-repository artifacts or caches. The receipt states this limit.
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

  semantic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'repository' && inputs.mode != 'repository-check' && inputs.mode != 'repository-resume' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == '1'
    name: Semantic answer over corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Checkout
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Enforce model-backed court hold
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') && (inputs.allow_model_call && (inputs.mode == 'query' || inputs.mode == 'red' || inputs.mode == 'vector-store')) }}
        run: python -m agent_runtime.logos_launch_hold
      - name: Run semantic pipeline
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
          SEM_MODE: ${{ inputs.mode }}
          SEM_CORPUS: ${{ inputs.corpus }}
          SEM_QUERY: ${{ inputs.query }}
          SEM_PUBLISH_ISSUE: ${{ inputs.publish_issue }}
          SEM_ALLOW_MODEL: ${{ inputs.allow_model_call }}
          SEM_ALLOW_VECTOR_STORE_WRITE: ${{ inputs.allow_vector_store_write }}
          SEM_INCLUDE_REPOSITORY: ${{ inputs.include_repository }}
          SEM_APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SEM_QUERY" > /tmp/sem_query.txt
          args=(--mode "$SEM_MODE" --corpus "$SEM_CORPUS" --query-file /tmp/sem_query.txt)
          if [ -n "$SEM_PUBLISH_ISSUE" ]; then
            args+=(--publish-issue "$SEM_PUBLISH_ISSUE")
          fi
          if [ "$SEM_ALLOW_MODEL" = "true" ]; then
            test -n "$SEM_APPROVAL_REFERENCE" || { echo "missing owner budget approval reference" >&2; exit 2; }
            args+=(--allow-model-call)
          fi
          if [ "$SEM_MODE" = "vector-store" ]; then
            test "$SEM_ALLOW_VECTOR_STORE_WRITE" = "true" || { echo "Vector Store write was not approved" >&2; exit 2; }
            test -n "$SEM_APPROVAL_REFERENCE" || { echo "missing owner approval reference" >&2; exit 2; }
            args+=(--allow-vector-store-write --approval-reference "$SEM_APPROVAL_REFERENCE")
            if [ "${SEM_INCLUDE_REPOSITORY:-false}" = "true" ]; then
              args+=(--include-repository)
            fi
          fi
          python scripts/semantic_pipeline.py "${args[@]}"
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

  vector-store-demo:
