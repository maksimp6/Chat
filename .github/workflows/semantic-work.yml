      github.ref == 'refs/heads/feat/semantic-pipeline' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.before == '7e5ba624f3e16c3e2757d0e86794fe00e49a37bd' &&
