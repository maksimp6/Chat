name: Semantic work

on:
  workflow_dispatch:
    inputs:
      query:
        description: "query text"
        required: true
        default: "симуляция офиса"
      mode:
        description: "BM25 search, bounded model answer, or Vector Store upload/search"
        type: choice
        options: [search, query, red, vector-store]
        required: true
        default: "search"
      corpus:
        description: "All task history or labelled dialogue sources, both open and closed"
        type: choice
        options: [tasks, dialogues]
        required: true
        default: "tasks"
      publish_issue:
        description: "issue number for the report"
        required: false
        default: ""
      allow_model_call:
        description: "Owner approves one bounded model call within a separately agreed budget"
        type: boolean
        required: true
        default: false
      allow_vector_store_write:
        description: "Owner approves one Vector Store snapshot update and one search"
        type: boolean
        required: true
        default: false
      include_repository:
        description: "Include tracked repository text files and binary file metadata"
        type: boolean
        required: true
        default: false
      approval_reference:
        description: "Reference to owner-approved scope and API limit"
        required: false
        default: ""
  push:
    branches: [feat/semantic-pipeline]

permissions: {}

concurrency:
  group: semantic-work
  cancel-in-progress: false

jobs:
  semantic:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == '1'
    name: Semantic answer over corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run semantic pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
          SEM_MODE: ${{ inputs.mode }}
          SEM_CORPUS: ${{ inputs.corpus }}
          SEM_QUERY: ${{ inputs.query }}
          SEM_PUBLISH_ISSUE: ${{ inputs.publish_issue }}
          SEM_ALLOW_MODEL: ${{ inputs.allow_model_call }}
          SEM_ALLOW_VECTOR_STORE_WRITE: ${{ inputs.allow_vector_store_write }}
          SEM_INCLUDE_REPOSITORY: ${{ inputs.include_repository }}
          SEM_APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SEM_QUERY" > /tmp/sem_query.txt
          args=(--mode "$SEM_MODE" --corpus "$SEM_CORPUS" --query-file /tmp/sem_query.txt)
          if [ -n "$SEM_PUBLISH_ISSUE" ]; then
            args+=(--publish-issue "$SEM_PUBLISH_ISSUE")
          fi
          if [ "$SEM_ALLOW_MODEL" = "true" ]; then
            test -n "$SEM_APPROVAL_REFERENCE" || { echo "missing owner budget approval reference" >&2; exit 2; }
            args+=(--allow-model-call)
          fi
          if [ "$SEM_MODE" = "vector-store" ]; then
            test "$SEM_ALLOW_VECTOR_STORE_WRITE" = "true" || { echo "Vector Store write was not approved" >&2; exit 2; }
            test -n "$SEM_APPROVAL_REFERENCE" || { echo "missing owner approval reference" >&2; exit 2; }
            args+=(--allow-vector-store-write --approval-reference "$SEM_APPROVAL_REFERENCE")
            if [ "${SEM_INCLUDE_REPOSITORY:-false}" = "true" ]; then
              args+=(--include-repository)
            fi
          fi
          python scripts/semantic_pipeline.py "${args[@]}"

  vector-store-demo:
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/semantic-pipeline' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (
        (
          github.event.before == '41a388a2c309423a4c100c3d1fec683c620a5d37' &&
          github.event.head_commit.message == 'feat(vector-store): add task snapshot upload and direct search'
        ) ||
        (
          github.event.before == 'c21ab3fda8ec9e17fcd4acdc84edaa52a6387ddc' &&
          github.event.head_commit.message == 'fix(vector-store): report safe runner diagnostics'
        ) ||
        (
          github.event.before == '6dce6099a4cc85bc3ca99adce2a842aa9453dd4c' &&
          github.event.head_commit.message == 'fix(vector-store): use native Yandex project header'
        ) ||
        (
          github.event.before == 'd192ef492ef5f70b8a842c29891d8d172ba4b092' &&
          github.event.head_commit.message == 'fix(vector-store): use Yandex-native project header'
        ) ||
        (
          github.event.before == '58480b798d867c23f5176ab811ea729f86fd08ad' &&
          github.event.head_commit.message == 'fix(vector-store): restore Yandex compatibility routing'
        ) ||
        (
          github.event.before == '29d477f6aef91e5447717cbbdc29c35e13348c75' &&
          github.event.head_commit.message == 'fix(vector-store): normalize multipart upload payload'
        )
      )
    name: One-time Yandex Vector Store demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Upload the complete task snapshot and search it once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
          VECTOR_QUERY: "симуляция офиса"
          VECTOR_APPROVAL_REFERENCE: "owner-confirmed-vector-store-demo"
        run: >-
          python scripts/semantic_pipeline.py
          --mode vector-store
          --corpus tasks
          --query "$VECTOR_QUERY"
          --allow-vector-store-write
          --approval-reference "$VECTOR_APPROVAL_REFERENCE"

  vector-store-repository-model-demo:
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/semantic-pipeline' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.before == '10a2547fbfb332c558831deb74f4a71cea50b07b' &&
      github.event.head_commit.message == 'diag(vector-store): inspect chunking metadata read-only'
    name: Read-only Yandex Vector Store chunking inspection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Inspect store and file chunking settings without writes
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
        run: >-
          python scripts/semantic_pipeline.py
          --mode vector-store-inspect
