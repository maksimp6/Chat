      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/semantic-pipeline' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (
        (
          github.event.before == '41a388a2c309423a4c100c3d1fec683c620a5d37' &&
          github.event.head_commit.message == 'feat(vector-store): add task snapshot upload and direct search'
        ) ||
        (
          github.event.before == 'c21ab3fda8ec9e17fcd4acdc84edaa52a6387ddc' &&
          github.event.head_commit.message == 'fix(vector-store): report safe runner diagnostics'
        ) ||
        (
          github.event.before == '6dce6099a4cc85bc3ca99adce2a842aa9453dd4c' &&
          github.event.head_commit.message == 'fix(vector-store): use native Yandex project header'
        ) ||
        (
          github.event.before == 'd192ef492ef5f70b8a842c29891d8d172ba4b092' &&
          github.event.head_commit.message == 'fix(vector-store): use Yandex-native project header'
        ) ||
        (
          github.event.before == '58480b798d867c23f5176ab811ea729f86fd08ad' &&
          github.event.head_commit.message == 'fix(vector-store): restore Yandex compatibility routing'
        ) ||
        (
          github.event.before == '29d477f6aef91e5447717cbbdc29c35e13348c75' &&
          github.event.head_commit.message == 'fix(vector-store): normalize multipart upload payload'
        )
      )
    name: One-time Yandex Vector Store demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Checkout
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Upload the complete task snapshot and search it once
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
          VECTOR_QUERY: "симуляция офиса"
          VECTOR_APPROVAL_REFERENCE: "owner-confirmed-vector-store-demo"
        run: >-
          python scripts/semantic_pipeline.py
          --mode vector-store
