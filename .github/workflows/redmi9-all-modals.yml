name: Redmi 9 all modal videos

on:
  push:
    branches: [capture/redmi9-all-modals-20261025]
    paths:
      - scripts/redmi_modal_capture.py
      - .github/workflows/redmi9-all-modals.yml

permissions: {}
concurrency:
  group: redmi9-app-server
  cancel-in-progress: false

jobs:
  record_modals:
    runs-on: redmi9
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Record existing modal windows without generation or writes
        shell: bash
        timeout-minutes: 12
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODAL_RECORDING_START_INDEX: "13"
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          modal_job_temp=$(python -c 'from pathlib import Path; import tempfile; print(Path(tempfile.mkdtemp(prefix=".logos-modal-video-", dir=".")).resolve())')
          export RUNNER_TEMP="$modal_job_temp"
          export TMPDIR="$modal_job_temp"
          scripts_dir="$RUNNER_TEMP/scripts"
          mkdir -m 700 "$scripts_dir"
          for script in redmi_modal_capture.py redmi_screenshot_capture.py publish_redmi_screenshots.py; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/$script" -o "$scripts_dir/$script"
          done
          capture_dir="$RUNNER_TEMP/modals-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          capture_exit_code=0
          python "$scripts_dir/redmi_modal_capture.py" "$capture_dir" || capture_exit_code=$?
          test -f "$capture_dir/manifest.json"
          PYTHONPATH="$scripts_dir" python - "$capture_dir" <<'PY'
          import sys
          import publish_redmi_screenshots as publisher
          publisher.MAX_CAPTURE_PNGS = 64
          publisher.EXTRA_ARTIFACT_LIMITS = {"all-modals-"+str(i).zfill(2)+".mp4": 40*1024*1024 for i in range(1, 9)}
          publisher.EXTRA_ARTIFACT_LIMITS["events.json"] = 2*1024*1024
          publisher.main()
          PY
          python - "$capture_dir" <<'PY'
          import hashlib,json,shutil,sys
          from pathlib import Path
          root=Path(sys.argv[1]);m=json.loads((root/'manifest.json').read_text())
          destination=Path('/sdcard/Download/Logos/modal-windows-2026-10-25')/root.name
          destination.mkdir(parents=True,exist_ok=True)
          copied=[]
          for entry in m['artifacts']:
              if not entry['path'].endswith('.mp4'):continue
              source=root/entry['path'];target=destination/source.name
              shutil.copyfile(source,target)
              if hashlib.sha256(target.read_bytes()).hexdigest()!=entry['sha256']:raise SystemExit('Android copy mismatch')
              copied.append(str(target))
          print(json.dumps({'android_copies':copied,'captured_states':m['captured_states'],'planned_states':m['planned_states'],
                            'missing':[x for x in m['modal_states'] if x['status']!='CAPTURED'],
                            'mutating_requests_transmitted':m['mutating_requests_transmitted']},ensure_ascii=False))
          if m['mutating_requests_transmitted']:raise SystemExit('Read-only recording violated')
          PY
          exit "$capture_exit_code"
