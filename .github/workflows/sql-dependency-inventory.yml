name: SQL dependency inventory

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sql-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inventory:
    name: SQL inventory / no new runtime SQL
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Test scanner and regression guard
        run: python -m unittest -q tests.test_sql_inventory
      - name: Inventory master without mutation
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/sql-inventory
          git rev-parse "origin/${BASE_REF}^{commit}"
          python scripts/sql_inventory.py --ref "origin/${BASE_REF}" \
            --json-out artifacts/sql-inventory/master.json \
            --markdown-out artifacts/sql-inventory/master.md
      - name: Inventory exact PR HEAD and guard SQL non-growth
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || \
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python scripts/sql_inventory.py --base-ref "origin/${BASE_REF}" --guard \
            --json-out artifacts/sql-inventory/head.json \
            --markdown-out artifacts/sql-inventory/head.md
      - name: Upload exact-head and master evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-inventory-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/sql-inventory/
          if-no-files-found: warn