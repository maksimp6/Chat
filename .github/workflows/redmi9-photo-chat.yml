name: Redmi 9 photo chat test

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: redmi9-app-server
  cancel-in-progress: false

jobs:
  photo_chat:
    runs-on: redmi9
    timeout-minutes: 10
    steps:
      - name: Send the photo and the same question without it through the Redmi 9 app
        shell: bash
        timeout-minutes: 10
        env:
          MODEL: qwen3.6-35b-a3b
          PHOTO_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          photo="$PHOTO_DIR/photo.png"
          # The deployed app checkout on the phone holds the photo's bytes (Git LFS), so no download is needed.
          cp /data/data/com.termux/files/home/logos-local/docs/screenshots/logos/2026-10-25/run-40212418021-1/18-chat-bottom.png "$photo"
          python - "$photo" <<'PY'
          import base64
          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8080"
          MODEL = os.environ["MODEL"]
          QUESTION = "На изображении записан вопрос и ответ. Назови число из ответа и ничего больше."
          EXPECTED = "397"  # the answer printed on the screenshot is 397,8
          PHOTO_SHA256 = "3202c326b926ccbfb30629bea5129a1c249d789a0aa93d8cde432f0a5adef9a9"
          PHOTO_SIZE = 222314

          photo = open(sys.argv[1], "rb").read()
          if len(photo) != PHOTO_SIZE or hashlib.sha256(photo).hexdigest() != PHOTO_SHA256:
              raise SystemExit("photo does not match the expected bytes")
          data_url = "data:image/png;base64," + base64.b64encode(photo).decode("ascii")


          def post(path, body, timeout):
              request = urllib.request.Request(
                  BASE + path,
                  data=json.dumps(body).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return response.status, json.loads(response.read().decode("utf-8") or "{}")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode("utf-8", errors="replace")[:800]


          def ask(conv_id, attachments):
              body = {"conversation_id": conv_id, "message": QUESTION, "model": MODEL}
              if attachments:
                  body["attachments"] = [{"data_url": data_url}]
              return post("/api/chat", body, 180)


          conv_status, conv = post("/api/conversations", {"model": MODEL}, 30)
          conv_id = conv.get("id") if isinstance(conv, dict) else None
          print(json.dumps({"step": "conversation", "status": conv_status, "created": bool(conv_id)}))
          if not conv_id:
              raise SystemExit(1)

          failures = []
          for label, attachments in (("with_photo", True), ("without_photo", False)):
              status, chat = ask(conv_id, attachments)
              reply = str(chat.get("reply", "")) if isinstance(chat, dict) else str(chat)
              found = EXPECTED in reply
              print(json.dumps({"step": label, "status": status, "reply": reply[:500],
                                "expected_found": found, "error": chat.get("error") if isinstance(chat, dict) else None},
                               ensure_ascii=False))
              if status != 200:
                  failures.append(label + ": http " + str(status))
              elif attachments and not found:
                  failures.append("with_photo: the reply does not contain " + EXPECTED)
              elif not attachments and found:
                  failures.append("without_photo: the reply contains " + EXPECTED + " without the photo")
          if failures:
              print(json.dumps({"result": "FAIL", "failures": failures}, ensure_ascii=False))
              raise SystemExit(1)
          print(json.dumps({"result": "PASS"}))
          PY
