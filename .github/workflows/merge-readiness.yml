name: Merge readiness snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: merge-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Merge readiness snapshot
    if: >-
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGE_REQUIRED_CHECKS: >-
        Code rules,
        Application tests,
        PostgreSQL integration,
        Android debug APK,
        Auto-format repository,
        Trivy repository scan,
        Zizmor GitHub Actions audit,
        CodeQL (python),
        CodeQL (javascript-typescript)

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Wait for protected checks and evaluate readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail

          result_file="$RUNNER_TEMP/merge-readiness.json"
          max_attempts=180
          attempt=1

          emit_summary() {
            {
              echo "## Merge readiness snapshot"
              echo
              echo '~~~json'
              cat "$result_file"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          while true; do
            set +e
            output="$(python scripts/merge_readiness.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --base master --pretty)"
            status=$?
            set -e

            printf '%s\n' "$output" > "$result_file"

            if [ "$status" -eq 0 ]; then
              break
            fi

            if python - "$result_file" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              result = json.load(handle)

          retryable = {"check_pending", "required_check_missing"}
          blockers = result.get("blockers", [])
          codes = {str(item.get("code") or "") for item in blockers}
          if blockers and codes <= retryable:
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Merge readiness timed out waiting for required checks." >&2
                cat "$result_file"
                emit_summary
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 5
              continue
            fi

            cat "$result_file"
            emit_summary
            exit "$status"
          done

          cat "$result_file"
          emit_summary

      - name: Update root stack tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/stack-status.json"
          python scripts/stack_status.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --pretty > "$status_file"

          root_pr="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["root_pr"])' "$status_file")"
          body_file="$RUNNER_TEMP/root-stack-comment.md"
          python - "$status_file" "$body_file" <<'PY'
          import json
          import sys

          status_path, body_path = sys.argv[1:]
          with open(status_path, encoding="utf-8") as handle:
              status = json.load(handle)
          verdict = "PASS" if status["ready"] else "BLOCKED"
          lines = [
              "<!-- alice-root-stack -->",
              "### PR stack",
              "",
              "```mermaid",
              status["mermaid"],
              "```",
              "",
              f"Root #{status['root_pr']}: **{verdict}**",
          ]
          if status["blockers"]:
              lines += ["", "Blockers:"]
              lines += [f"- {item}" for item in status["blockers"]]
          with open(body_path, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

          comment_id="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$root_pr/comments?per_page=100"             --jq '.[] | select(.body | contains("<!-- alice-root-stack -->")) | .id' | head -n1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"               -F body=@"$body_file" >/dev/null
          else
            gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$root_pr/comments"               -F body=@"$body_file" >/dev/null
          fi

      - name: Build root stack status
        if: always() && github.event.pull_request.state == 'open'
        id: stack_root
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stack_root_status.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --base master > "$RUNNER_TEMP/stack-root.json"
          python - "$RUNNER_TEMP/stack-root.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          print(f"root_number={payload['root_number']}")
          PY

      - name: Update stack status comment
        if: always() && github.event.pull_request.state == 'open'
        shell: bash
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/merge-readiness.json"
          stack_file="$RUNNER_TEMP/stack-root.json"
          [ -f "$result_file" ] || exit 0
          [ -f "$stack_file" ] || exit 0
          marker='<!-- alice-stack-readiness -->'
          body_file="$RUNNER_TEMP/stack-comment.md"
          python - "$result_file" "$stack_file" "$body_file" <<'PY'
          import json
          import sys

          result_path, stack_path, body_path = sys.argv[1:]
          with open(result_path, encoding="utf-8") as handle:
              result = json.load(handle)
          with open(stack_path, encoding="utf-8") as handle:
              stack = json.load(handle)
          status = "PASS" if result.get("ready") else "BLOCKED"
          blockers = result.get("blockers", [])
          lines = [
              "<!-- alice-stack-readiness -->",
              "### Stack readiness",
              "",
              f"- PR: #{result.get('pr_number')}",
              f"- Role: `{result.get('stack_role', 'unknown')}`",
              f"- Exact head: `{result.get('head_sha') or 'unknown'}`",
              f"- Merge: **{status}**",
              "",
              "```mermaid",
              str(stack["mermaid"]),
              "```",
          ]
          if blockers:
              lines += ["", "Blockers:"]
              lines += [f"- {item.get('detail', item.get('code', 'unknown blocker'))}" for item in blockers]
          with open(body_path, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

          ROOT_NUMBER="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["root_number"])' "$stack_file")"
          comment_id="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$ROOT_NUMBER/comments?per_page=100"             --jq '.[] | select(.body | contains("<!-- alice-stack-readiness -->")) | .id' | head -n1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"               -F body=@"$body_file" >/dev/null
          else
            gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$ROOT_NUMBER/comments"               -F body=@"$body_file" >/dev/null
          fi


      - name: Refresh root stack status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stack_file="$RUNNER_TEMP/stack-status.json"
          python scripts/stack_status.py             --repo "$GITHUB_REPOSITORY"             --pr "$PR_NUMBER"             --pretty > "$stack_file"

          root_pr="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["root_pr"])' "$stack_file")"
          root_result="$RUNNER_TEMP/root-readiness.json"

          set +e
          python scripts/merge_readiness.py             --repo "$GITHUB_REPOSITORY"             --pr "$root_pr"             --base master             --pretty > "$root_result"
          set -e

          body_file="$RUNNER_TEMP/root-stack-comment.md"
          python - "$stack_file" "$root_result" "$body_file" <<'PY'
          import json
          import sys

          stack_path, readiness_path, body_path = sys.argv[1:]
          with open(stack_path, encoding="utf-8") as handle:
              stack = json.load(handle)
          with open(readiness_path, encoding="utf-8") as handle:
              readiness = json.load(handle)

          status = "PASS" if readiness.get("ready") else "BLOCKED"
          lines = [
              "<!-- alice-stack-root-readiness -->",
              "### Stack topology",
              "",
              "~~~mermaid",
              stack["mermaid"],
              "~~~",
              "",
              f"Root #{stack['root_pr']}: **{status}**",
              f"Exact head: `{readiness.get('head_sha') or 'unknown'}`",
          ]
          blockers = readiness.get("blockers", [])
          if blockers:
              lines += ["", "Blockers:"]
              lines += [f"- {item.get('detail', item.get('code', 'unknown blocker'))}" for item in blockers]
          with open(body_path, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

          comment_id="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$root_pr/comments?per_page=100"             --jq '.[] | select(.body | contains("<!-- alice-stack-root-readiness -->")) | .id' | head -n1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"               -F body=@"$body_file" >/dev/null
          else
            gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$root_pr/comments"               -F body=@"$body_file" >/dev/null
          fi


      - name: Refresh root stack diagram
        if: always() && github.event.pull_request.state == 'open'
        shell: bash
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/root-stack.json"
          comment_file="$RUNNER_TEMP/root-stack.md"
          python scripts/stack_status.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --pretty > "$status_file"

          root_pr="$(python - "$status_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["root_pr"])
          PY
          )"

          python - "$status_file" "$comment_file" "$PR_NUMBER" <<'PY'
          import json, sys
          status_path, output_path, event_pr = sys.argv[1:]
          with open(status_path, encoding="utf-8") as handle:
              status = json.load(handle)
          fence = chr(96) * 3
          lines = [
              "<!-- alice-stack-readiness -->",
              "### Stack topology",
              "",
              f"- Root: #{status['root_pr']}",
              f"- Last event: #{event_pr}",
              "",
              fence + "mermaid",
              status["mermaid"],
              fence,
          ]
          with open(output_path, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

          comment_id="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$root_pr/comments?per_page=100" --jq '.[] | select(.body | contains("<!-- alice-stack-readiness -->")) | .id' | head -n1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$comment_file" >/dev/null
          else
            gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$root_pr/comments" -F body=@"$comment_file" >/dev/null
          fi

