name: Merge readiness snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: merge-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Merge readiness snapshot
    if: >-
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGE_REQUIRED_CHECKS: >-
        Platform changes,
        CI required,
        Infrastructure tests,
        MCP worker tests,
        Code rules,
        Application tests,
        Trivy repository scan

    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Checkout exact PR head
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Wait for protected checks and evaluate readiness
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        id: readiness
        shell: bash
        run: |
          set -euo pipefail

          result_file="$RUNNER_TEMP/merge-readiness.json"
          max_attempts=180
          attempt=1

          emit_summary() {
            {
              echo "## Merge readiness snapshot"
              echo
              echo '~~~json'
              cat "$result_file"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          while true; do
            set +e
            output="$(python scripts/merge_readiness.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --base master --pretty)"
            status=$?
            set -e

            printf '%s\n' "$output" > "$result_file"

            if [ "$status" -eq 0 ]; then
              break
            fi

            if python - "$result_file" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              result = json.load(handle)

          retryable = {"check_pending", "required_check_missing"}
          blockers = result.get("blockers", [])
          codes = {str(item.get("code") or "") for item in blockers}
          if blockers and codes <= retryable:
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Merge readiness timed out waiting for required checks." >&2
                cat "$result_file"
                emit_summary
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 5
              continue
            fi

            cat "$result_file"
            emit_summary
            exit "$status"
          done

          cat "$result_file"
          emit_summary
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
