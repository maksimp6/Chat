name: Q14 read-only model observer

on:
  pull_request:
    branches: [develop]
    types: [synchronize, reopened, labeled]
    paths:
      - scripts/q14_observer.py
      - tests/test_q14_observer.py
      - .github/workflows/q14-observer.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: q14-observer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.event.pull_request.number == 1425 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/q14-ai-simulation' &&
      (github.event.action != 'labeled' ||
      (github.event.label.name == 'q14-observer-once' &&
      github.event.sender.login == github.repository_owner && github.run_attempt == 1))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test observer boundaries and original scenarios without credentials
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: python3 -m unittest discover -s tests -p 'test_q14*.py' -v
      - name: Verify original evidence was not repaired by the observer author
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          git diff --exit-code a553e4c998297052596b5b82b6f83bd577adc638 HEAD -- \
            .github/workflows/q14-simulation.yml scripts/q14_ai_review.py \
            scripts/q14_simulation.py tests/test_q14_simulation.py docs/simulations/q14.md
          echo "OBSERVER_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: One bounded model execution with model-selected read-only tools
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') && (github.event.action == 'labeled' && github.event.label.name == 'q14-observer-once') }}
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.q14_observer
      - name: Publish actual model answer
        id: policy_step_05
        continue-on-error: true
        if: always()
        run: test ! -f q14-observer/model-answer.md || cat q14-observer/model-answer.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: policy_step_06
        continue-on-error: true
        if: always() && github.event.action == 'labeled' && github.event.label.name == 'q14-observer-once'
        with:
          name: q14-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: q14-observer/
          if-no-files-found: error
          retention-days: 14
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
