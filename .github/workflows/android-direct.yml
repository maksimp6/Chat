name: Android direct APK

on:
  pull_request:
    paths:
      - "android/direct/**"
      - "android/scripts/build_direct.sh"
      - "android/scripts/test_direct.sh"
      - ".github/workflows/android-direct.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android direct APK (informational, not required)
    runs-on: ubuntu-latest
    env:
      ALICE_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/android/app/debug-signing.keystore
      ALICE_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
      ALICE_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
      ALICE_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Checkout
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "25"
      - name: Materialize stable debug keystore
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$(dirname "$ALICE_DEBUG_KEYSTORE_PATH")"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$ALICE_DEBUG_KEYSTORE_PATH"
            chmod 600 "$ALICE_DEBUG_KEYSTORE_PATH"
            test -s "$ALICE_DEBUG_KEYSTORE_PATH"
            keytool -list               -keystore "$ALICE_DEBUG_KEYSTORE_PATH"               -storepass "$ALICE_DEBUG_STORE_PASSWORD"               -alias "$ALICE_DEBUG_KEY_ALIAS" >/dev/null
          fi
      - name: Build direct debug APK
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          ALICE_BUILD_NUMBER: ${{ github.run_number }}
          ALICE_VERSION_NAME: 0.2.0-direct-${{ github.sha }}
        run: |
          set -euo pipefail
          started=$SECONDS
          bash android/scripts/build_direct.sh
          elapsed=$((SECONDS - started))
          echo "- Android direct APK build: ${elapsed}s (target: <=30s)" >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -le 30
      - name: Run direct-build contract tests
        id: policy_step_05
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          set -euo pipefail
          bash android/scripts/test_direct.sh
      - name: Enforce APK size budget
        id: policy_step_06
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          set -euo pipefail
          apk=android/build/direct/alice-pro-direct.apk
          test -s "$apk"
          size_bytes=$(stat -c%s "$apk")
          size_kib=$(( (size_bytes + 1023) / 1024 ))
          echo "- Android direct APK size: ${size_bytes} bytes (${size_kib} KiB), limit: 1048576 bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$size_bytes" -le 1048576
          sha256sum "$apk"
      - name: Upload debug APK
        id: policy_step_07
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: alice-pro-direct-apk-${{ github.run_number }}
          path: android/build/direct/alice-pro-direct.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
