name: Preview deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: master
        type: string
      ttl_hours:
        description: Preview lifetime in hours
        required: false
        default: "24"
        type: string
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.ref || github.ref_name || 'scheduled-cleanup' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_SSH_PORT: ${{ vars.PREVIEW_SSH_PORT || '22' }}
  PREVIEW_DEFAULT_TTL_HOURS: ${{ vars.PREVIEW_TTL_HOURS || '24' }}

jobs:
  deploy:
    name: Deploy isolated preview
    environment: production
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    env:
      PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
      PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
      PREVIEW_PUBLIC_BASE_URL: ${{ secrets.PREVIEW_PUBLIC_BASE_URL }}
      ALICE_SHORT_TOKEN: ${{ secrets.ALICE_SHORT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || format('https://{0}.supabase.co', vars.SUPABASE_PROJECT_ID || 'nawtxxvlodnyzwpwsmdl') }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'nawtxxvlodnyzwpwsmdl' }}
      INPUT_REF: ${{ inputs.ref || '' }}
      INPUT_TTL_HOURS: ${{ inputs.ttl_hours || '' }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PREVIEW_REF: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
    steps:
      - name: Validate configuration
        run: |
          test -n "$PREVIEW_SSH_HOST"
          test -n "$PREVIEW_SSH_USER"
          test -n "$PREVIEW_SSH_PRIVATE_KEY"
          test -n "$PREVIEW_SSH_KNOWN_HOSTS"
          test -n "$PREVIEW_PUBLIC_BASE_URL"
          test -n "$ALICE_SHORT_TOKEN"
          test -n "$SUPABASE_URL"
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Resolve Supabase runtime API key
        shell: bash
        run: |
          keys="$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" -o json)"
          key="$(printf "%s" "$keys" | jq -r '[.[] | select(.type == "secret" and (.disabled != true)) | .api_key] | .[0] // empty')"
          test -n "$key" || { echo "Supabase runtime API key is unavailable"; exit 1; }
          echo "::add-mask::$key"
          printf "SUPABASE_SECRET_KEY=%s\n" "$key" >> "$GITHUB_ENV"
      - name: Check out ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}
          fetch-depth: 1
      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$PREVIEW_SSH_PRIVATE_KEY" | awk '{gsub(/\\\\n/, "\n"); gsub(/\\\\r/, ""); print}' > "$HOME/.ssh/id_ed25519"
          printf '%s' "$PREVIEW_SSH_KNOWN_HOSTS" | awk '{gsub(/\\\\n/, "\n"); gsub(/\\\\r/, ""); print}' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Resolve remote preview directory
        id: remote
        run: |
          ssh_cmd=(ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes)
          remote_dir="$("${ssh_cmd[@]}" "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" 'printf "%s/alice-preview" "$HOME"')"
          test -n "$remote_dir"
          "${ssh_cmd[@]}" "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" 'mkdir -p "$HOME/alice-preview/incoming" "$HOME/alice-preview/previews"'
          echo "base_dir=$remote_dir" >> "$GITHUB_OUTPUT"
      - name: Resolve preview identity
        id: preview
        run: |
          if [ -n "$PR_NUMBER" ]; then raw_key="pr-$PR_NUMBER"; else raw_key="branch-${INPUT_REF:-$GITHUB_REF_NAME}"; fi
          key="$(printf '%s' "$raw_key" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-*//; s/-*$//' | cut -c1-50)"
          ttl="${INPUT_TTL_HOURS:-$PREVIEW_DEFAULT_TTL_HOURS}"
          case "$ttl" in ''|*[!0-9]*) exit 1;; esac
          [ "$ttl" -gt 0 ] && [ "$ttl" -le 720 ] || exit 1
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "base_path=/preview/$key" >> "$GITHUB_OUTPUT"
          echo "ttl_hours=$ttl" >> "$GITHUB_OUTPUT"
      - name: Build source archive
        run: git archive --format=tar.gz --output=preview.tar.gz HEAD
      - name: Upload and deploy preview
        env:
          KEY: ${{ steps.preview.outputs.key }}
          BASE_PATH: ${{ steps.preview.outputs.base_path }}
          TTL_HOURS: ${{ steps.preview.outputs.ttl_hours }}
          REMOTE_BASE_DIR: ${{ steps.remote.outputs.base_dir }}
        run: |
          ssh_cmd=(ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes)
          scp_cmd=(scp -P "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes)
          "${scp_cmd[@]}" deploy/preview/server.sh "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST:$REMOTE_BASE_DIR/server.sh"
          "${scp_cmd[@]}" preview.tar.gz "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST:$REMOTE_BASE_DIR/incoming/$KEY.tar.gz"
          printf '%s\n%s\n%s\n' "$ALICE_SHORT_TOKEN" "$SUPABASE_URL" "$SUPABASE_SECRET_KEY" | "${ssh_cmd[@]}" "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "read -r token; read -r supabase_url; read -r supabase_secret_key; export ALICE_SHORT_TOKEN="$token" SUPABASE_URL="$supabase_url" SUPABASE_SECRET_KEY="$supabase_secret_key"; PREVIEW_SERVER_BASE_DIR='$REMOTE_BASE_DIR' bash '$REMOTE_BASE_DIR/server.sh' deploy '$KEY' '$BASE_PATH' '$REMOTE_BASE_DIR/incoming/$KEY.tar.gz' '$TTL_HOURS'"
      - name: Verify VPS routing
        env:
          KEY: ${{ steps.preview.outputs.key }}
        run: |
          ssh_cmd=(ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes)
          printf '%s\n' "$ALICE_SHORT_TOKEN" | "${ssh_cmd[@]}" "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "read -r token; curl --fail --silent --show-error --max-time 5 -H \"Host: maxxxpavlov.ru\" \"http://127.0.0.1/\$token/preview/$KEY/\" >/dev/null"
      - name: Public HTTPS health and TLS check
        env:
          KEY: ${{ steps.preview.outputs.key }}
        run: |
          for domain in maxxxpavlov.ru maxxxpavlov.online; do
            url="https://$domain/${ALICE_SHORT_TOKEN}/preview/${KEY}/"
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$url" >/dev/null; then
                echo "HTTPS Preview OK: $domain"
                break
              fi
              if [ "$attempt" -eq 24 ]; then
                echo "HTTPS Preview/TLS check failed for $domain"
                openssl s_client -connect "$domain:443" -servername "$domain" </dev/null 2>/dev/null |
                  openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
                exit 1
              fi
              sleep 5
            done
          done
          echo "Preview HTTPS and TLS checks passed (token omitted from logs)."
      - name: Verify critical web assets
        env:
          KEY: ${{ steps.preview.outputs.key }}
        run: |
          base="${PREVIEW_PUBLIC_BASE_URL%/}/${ALICE_SHORT_TOKEN}/preview/${KEY}"
          for asset in \
            "static/style.css" \
            "static/boot.js" \
            "static/core.js" \
            "static/sidebar.js" \
            "static/models.js" \
            "static/chat.js" \
            "static/eruda_init.js" \
            "static/eruda.js"; do
            if ! curl --fail --silent --show-error --connect-timeout 5 --max-time 30 "$base/$asset" >/dev/null; then
              echo "Asset check failed: $asset"
              exit 1
            fi
          done

      - name: Verify preview Dozzle logs
        env:
          KEY: ${{ steps.preview.outputs.key }}
        run: |
          for domain in maxxxpavlov.ru maxxxpavlov.online; do
            url="https://$domain/${ALICE_SHORT_TOKEN}/preview/${KEY}/logs/"
            if ! curl --fail --silent --show-error --connect-timeout 5 --max-time 20 "$url" >/dev/null; then
              echo "Dozzle logs check failed for $domain"
              exit 1
            fi
            echo "Dozzle logs OK: $domain"
          done
      - name: Comment preview URL
        if: success() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_PATH: ${{ steps.preview.outputs.base_path }}
        run: |
          url="${PREVIEW_PUBLIC_BASE_URL%/}${BASE_PATH}/"
          jq -n --arg body "Preview deployed. The tokenized URL is intentionally omitted from the GitHub comment." '{body:$body}' | curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -d @-

  cleanup_pr:
    name: Cleanup closed pull request preview
    environment: production
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
      PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$PREVIEW_SSH_PRIVATE_KEY" | awk '{gsub(/\\\\n/, "\n"); gsub(/\\\\r/, ""); print}' > "$HOME/.ssh/id_ed25519"
          printf '%s' "$PREVIEW_SSH_KNOWN_HOSTS" | awk '{gsub(/\\\\n/, "\n"); gsub(/\\\\r/, ""); print}' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Resolve remote preview directory
        id: remote
        run: |
          ssh_cmd=(ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes)
          remote_dir="$("${ssh_cmd[@]}" "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" 'printf "%s/alice-preview" "$HOME"')"
          test -n "$remote_dir"
          echo "base_dir=$remote_dir" >> "$GITHUB_OUTPUT"
      - name: Remove preview
        env:
          REMOTE_BASE_DIR: ${{ steps.remote.outputs.base_dir }}
        run: |
          ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "if [ -f '$REMOTE_BASE_DIR/server.sh' ]; then PREVIEW_SERVER_BASE_DIR='$REMOTE_BASE_DIR' bash '$REMOTE_BASE_DIR/server.sh' cleanup 'pr-$PR_NUMBER'; fi"

  cleanup_expired:
    name: Cleanup expired previews
    environment: production
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
      PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$PREVIEW_SSH_PRIVATE_KEY" | awk '{gsub(/\\\\n/, "\n"); gsub(/\\\\r/, ""); print}' > "$HOME/.ssh/id_ed25519"
          printf '%s' "$PREVIEW_SSH_KNOWN_HOSTS" | awk '{gsub(/\\\\n/, "\n"); gsub(/\\\\r/, ""); print}' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Resolve remote preview directory
        id: remote
        run: |
          ssh_cmd=(ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes)
          remote_dir="$("${ssh_cmd[@]}" "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" 'printf "%s/alice-preview" "$HOME"')"
          test -n "$remote_dir"
          echo "base_dir=$remote_dir" >> "$GITHUB_OUTPUT"
      - name: Cleanup expired previews
        env:
          REMOTE_BASE_DIR: ${{ steps.remote.outputs.base_dir }}
        run: |
          ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "if [ -f '$REMOTE_BASE_DIR/server.sh' ]; then PREVIEW_SERVER_BASE_DIR='$REMOTE_BASE_DIR' bash '$REMOTE_BASE_DIR/server.sh' cleanup-expired; fi"
