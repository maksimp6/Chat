name: Host-managed preview validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate
        required: true
        default: master
        type: string

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact commit in Alice Pro host
    # Enable only after #347 and #349 are merged and deployed on the host.
    if: vars.ALICE_HOST_PREVIEW_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    env:
      # Include the short-token path prefix in this secret when host auth requires it.
      ALICE_ENVIRONMENT_HOST_URL: ${{ secrets.ALICE_ENVIRONMENT_HOST_URL }}
      PREVIEW_BRANCH: ${{ github.head_ref || inputs.ref || github.ref_name }}
      PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_COMMIT }}
          fetch-depth: 1
      - name: Run repository validation
        run: |
          python -m compileall -q .
          python tests/validate_runtime_modules.py
          pytest -q
      - name: Request, exercise, and clean up host environment
        env:
          ALICE_ENVIRONMENT_API_TOKEN: ${{ secrets.ALICE_ENVIRONMENT_API_TOKEN }}
        run: deploy/preview/environment_lifecycle.sh
