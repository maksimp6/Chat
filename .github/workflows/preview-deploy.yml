name: Preview deployment

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: master
        type: string
      ttl_hours:
        description: Preview lifetime in hours
        required: false
        default: "24"
        type: string
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.ref || github.ref_name || 'scheduled-cleanup' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_SERVER_BASE_DIR: ${{ vars.PREVIEW_SERVER_BASE_DIR || '/opt/alice-preview' }}
  PREVIEW_SSH_PORT: ${{ vars.PREVIEW_SSH_PORT || '22' }}
  PREVIEW_DEFAULT_TTL_HOURS: ${{ vars.PREVIEW_TTL_HOURS || '24' }}

jobs:
  deploy:
    name: Deploy isolated preview
    environment: production
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    env:
      PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
      PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
      PREVIEW_PUBLIC_BASE_URL: ${{ secrets.PREVIEW_PUBLIC_BASE_URL }}
      INPUT_REF: ${{ inputs.ref || '' }}
      INPUT_TTL_HOURS: ${{ inputs.ttl_hours || '' }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PREVIEW_REF: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
    steps:
      - name: Validate configuration
        run: |
          test -n "$PREVIEW_SSH_HOST"
          test -n "$PREVIEW_SSH_USER"
          test -n "$PREVIEW_SSH_PRIVATE_KEY"
          test -n "$PREVIEW_SSH_KNOWN_HOSTS"
          test -n "$PREVIEW_PUBLIC_BASE_URL"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}
          fetch-depth: 1
      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PREVIEW_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Resolve preview identity
        id: preview
        env:
          DEFAULT_TTL: ${{ env.PREVIEW_DEFAULT_TTL_HOURS }}
        run: |
          if [ -n "$PR_NUMBER" ]; then raw_key="pr-$PR_NUMBER"; else raw_key="branch-${INPUT_REF:-$GITHUB_REF_NAME}"; fi
          key="$(printf '%s' "$raw_key" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-*//; s/-*$//' | cut -c1-50)"
          ttl="${INPUT_TTL_HOURS:-$DEFAULT_TTL}"
          case "$ttl" in ''|*[!0-9]*) exit 1;; esac
          [ "$ttl" -gt 0 ] && [ "$ttl" -le 720 ]
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "base_path=/preview/$key" >> "$GITHUB_OUTPUT"
          echo "ttl_hours=$ttl" >> "$GITHUB_OUTPUT"
      - name: Build archive
        run: tar --exclude=.git --exclude=.github --exclude=node_modules --exclude=preview.tar.gz -czf preview.tar.gz .
      - name: Upload bundle
        env:
          KEY: ${{ steps.preview.outputs.key }}
        run: |
          ssh -p "$PREVIEW_SSH_PORT" -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "mkdir -p '$PREVIEW_SERVER_BASE_DIR/incoming' '$PREVIEW_SERVER_BASE_DIR/previews'"
          scp -P "$PREVIEW_SSH_PORT" -o IdentitiesOnly=yes deploy/preview/server.sh "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST:$PREVIEW_SERVER_BASE_DIR/server.sh"
          scp -P "$PREVIEW_SSH_PORT" -o IdentitiesOnly=yes preview.tar.gz "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST:$PREVIEW_SERVER_BASE_DIR/incoming/$KEY.tar.gz"
      - name: Deploy
        env:
          KEY: ${{ steps.preview.outputs.key }}
          BASE_PATH: ${{ steps.preview.outputs.base_path }}
          TTL_HOURS: ${{ steps.preview.outputs.ttl_hours }}
        run: ssh -p "$PREVIEW_SSH_PORT" -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "PREVIEW_SERVER_BASE_DIR='$PREVIEW_SERVER_BASE_DIR' bash '$PREVIEW_SERVER_BASE_DIR/server.sh' deploy '$KEY' '$BASE_PATH' '$PREVIEW_SERVER_BASE_DIR/incoming/$KEY.tar.gz' '$TTL_HOURS'"
      - name: Health check
        env:
          KEY: ${{ steps.preview.outputs.key }}
        run: |
          url="${PREVIEW_PUBLIC_BASE_URL%/}/preview/${KEY}/"
          for attempt in $(seq 1 30); do curl --fail --silent --show-error --max-time 10 "$url" >/dev/null && { echo "Preview URL: $url"; exit 0; }; sleep 5; done
          exit 1
      - name: Publish summary
        env:
          KEY: ${{ steps.preview.outputs.key }}
          BASE_PATH: ${{ steps.preview.outputs.base_path }}
          TTL_HOURS: ${{ steps.preview.outputs.ttl_hours }}
        run: |
          url="${PREVIEW_PUBLIC_BASE_URL%/}${BASE_PATH}/"
          echo "## Preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "TTL: $TTL_HOURS hours" >> "$GITHUB_STEP_SUMMARY"
