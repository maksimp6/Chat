name: Preview deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: master
        type: string
      ttl_hours:
        description: Preview lifetime in hours
        required: false
        default: "24"
        type: string
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.ref || github.ref_name || 'scheduled-cleanup' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_SSH_PORT: ${{ vars.PREVIEW_SSH_PORT || '22' }}
  PREVIEW_DEFAULT_TTL_HOURS: ${{ vars.PREVIEW_TTL_HOURS || '24' }}

jobs:
  deploy:
    name: Deploy isolated preview
    environment: production
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    env:
      PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
      PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
      PREVIEW_PUBLIC_BASE_URL: ${{ secrets.PREVIEW_PUBLIC_BASE_URL }}
      INPUT_REF: ${{ inputs.ref || '' }}
      INPUT_TTL_HOURS: ${{ inputs.ttl_hours || '' }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PREVIEW_REF: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
    steps:
      - name: Validate configuration
        run: |
          test -n "$PREVIEW_SSH_HOST"
          test -n "$PREVIEW_SSH_USER"
          test -n "$PREVIEW_SSH_PRIVATE_KEY"
          test -n "$PREVIEW_SSH_KNOWN_HOSTS"
          test -n "$PREVIEW_PUBLIC_BASE_URL"
      - name: Check out ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}
          fetch-depth: 1
      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          python3 - <<'PY'
          import ast
          import base64
          import os

          def normalize(value):
              value = value.strip()
              for _ in range(3):
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in {"'", '"' }:
                      try:
                          parsed = ast.literal_eval(value)
                          if isinstance(parsed, str):
                              value = parsed.strip()
                              continue
                      except Exception:
                          pass
                  new_value = value
                  for old, new in ((r"\\r\\n", "\n"), (r"\\n", "\n"), (r"\\r", "\r"), (r"\r\n", "\n"), (r"\n", "\n"), (r"\r", "\r")):
                      new_value = new_value.replace(old, new)
                  if new_value == value:
                      break
                  value = new_value
              if not value.lstrip().startswith("-----BEGIN"):
                  compact = "".join(value.split())
                  padded = compact + "=" * ((4 - len(compact) % 4) % 4)
                  try:
                      decoded = base64.b64decode(padded, validate=True).decode("utf-8")
                      if decoded.lstrip().startswith("-----BEGIN"):
                          value = decoded
                  except Exception:
                      pass
              return value.replace("\r\n", "\n").replace("\r", "\n")

          with open(os.path.expanduser("~/.ssh/id_ed25519"), "w", encoding="utf-8", newline="\n") as handle:
              handle.write(normalize(os.environ["PREVIEW_SSH_PRIVATE_KEY"]))
          with open(os.path.expanduser("~/.ssh/known_hosts"), "w", encoding="utf-8", newline="\n") as handle:
              handle.write(normalize(os.environ["PREVIEW_SSH_KNOWN_HOSTS"]))
          PY
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Resolve remote preview directory
        id: remote
        run: |
          ssh_cmd=(ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes)
          remote_dir="$("${ssh_cmd[@]}" "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" 'printf "%s/alice-preview" "$HOME"')"
          test -n "$remote_dir"
          "${ssh_cmd[@]}" "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "mkdir -p \"$remote_dir/incoming\" \"$remote_dir/previews\""
          echo "base_dir=$remote_dir" >> "$GITHUB_OUTPUT"
      - name: Resolve preview identity
        id: preview
        run: |
          if [ -n "$PR_NUMBER" ]; then raw_key="pr-$PR_NUMBER"; else raw_key="branch-${INPUT_REF:-$GITHUB_REF_NAME}"; fi
          key="$(printf '%s' "$raw_key" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-*//; s/-*$//' | cut -c1-50)"
          ttl="${INPUT_TTL_HOURS:-$PREVIEW_DEFAULT_TTL_HOURS}"
          case "$ttl" in ''|*[!0-9]*) exit 1;; esac
          [ "$ttl" -gt 0 ] && [ "$ttl" -le 720 ] || exit 1
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "base_path=/preview/$key" >> "$GITHUB_OUTPUT"
          echo "ttl_hours=$ttl" >> "$GITHUB_OUTPUT"
      - name: Build source archive
        run: git archive --format=tar.gz --output=preview.tar.gz HEAD
      - name: Upload and deploy preview
        env:
          KEY: ${{ steps.preview.outputs.key }}
          BASE_PATH: ${{ steps.preview.outputs.base_path }}
          TTL_HOURS: ${{ steps.preview.outputs.ttl_hours }}
          REMOTE_BASE_DIR: ${{ steps.remote.outputs.base_dir }}
        run: |
          ssh_cmd=(ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes)
          scp_cmd=(scp -P "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes)
          "${scp_cmd[@]}" deploy/preview/server.sh "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST:$REMOTE_BASE_DIR/server.sh"
          "${scp_cmd[@]}" preview.tar.gz "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST:$REMOTE_BASE_DIR/incoming/$KEY.tar.gz"
          "${ssh_cmd[@]}" "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "PREVIEW_SERVER_BASE_DIR='$REMOTE_BASE_DIR' bash '$REMOTE_BASE_DIR/server.sh' deploy '$KEY' '$BASE_PATH' '$REMOTE_BASE_DIR/incoming/$KEY.tar.gz' '$TTL_HOURS'"
      - name: Public health check
        env:
          KEY: ${{ steps.preview.outputs.key }}
        run: |
          url="${PREVIEW_PUBLIC_BASE_URL%/}/preview/${KEY}/"
          for attempt in $(seq 1 30); do curl --fail --silent --show-error --max-time 10 "$url" >/dev/null && { echo "Preview URL: $url"; exit 0; }; sleep 5; done
          exit 1
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_PATH: ${{ steps.preview.outputs.base_path }}
        run: |
          url="${PREVIEW_PUBLIC_BASE_URL%/}${BASE_PATH}/"
          jq -n --arg body "Preview deployed: $url" '{body:$body}' | curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -d @-

  cleanup_pr:
    name: Cleanup closed pull request preview
    environment: production
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
      PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          python3 - <<'PY'
          import base64
          import os

          def write_secret(name, path):
              value = os.environ[name]
              if len(value) >= 2 and value[0] == value[-1] and value[0] in {"\x27", '"'}:
                  value = value[1:-1]
              value = value.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\\r", "\r")
              value = value.replace("\r\n", "\n").replace("\r", "\n")
              stripped = value.lstrip()
              if not stripped.startswith("-----BEGIN"):
                  try:
                      decoded = base64.b64decode("".join(value.split()), validate=True).decode("utf-8")
                      if decoded.lstrip().startswith("-----BEGIN"):
                          value = decoded
                  except Exception:
                      pass
              with open(path, "w", encoding="utf-8", newline="\n") as handle:
                  handle.write(value)

          write_secret("PREVIEW_SSH_PRIVATE_KEY", os.path.expanduser("~/.ssh/id_ed25519"))
          write_secret("PREVIEW_SSH_KNOWN_HOSTS", os.path.expanduser("~/.ssh/known_hosts"))
          PY
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Resolve remote preview directory
        id: remote
        run: |
          ssh_cmd=(ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes)
          remote_dir="$("${ssh_cmd[@]}" "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" 'printf "%s/alice-preview" "$HOME"')"
          test -n "$remote_dir"
          echo "base_dir=$remote_dir" >> "$GITHUB_OUTPUT"
      - name: Remove preview
        env:
          REMOTE_BASE_DIR: ${{ steps.remote.outputs.base_dir }}
        run: |
          ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "if [ -f '$REMOTE_BASE_DIR/server.sh' ]; then PREVIEW_SERVER_BASE_DIR='$REMOTE_BASE_DIR' bash '$REMOTE_BASE_DIR/server.sh' cleanup 'pr-$PR_NUMBER'; fi"

  cleanup_expired:
    name: Cleanup expired previews
    environment: production
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
      PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          python3 - <<'PY'
          import base64
          import os

          def write_secret(name, path):
              value = os.environ[name]
              if len(value) >= 2 and value[0] == value[-1] and value[0] in {"\x27", '"'}:
                  value = value[1:-1]
              value = value.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\\r", "\r")
              value = value.replace("\r\n", "\n").replace("\r", "\n")
              stripped = value.lstrip()
              if not stripped.startswith("-----BEGIN"):
                  try:
                      decoded = base64.b64decode("".join(value.split()), validate=True).decode("utf-8")
                      if decoded.lstrip().startswith("-----BEGIN"):
                          value = decoded
                  except Exception:
                      pass
              with open(path, "w", encoding="utf-8", newline="\n") as handle:
                  handle.write(value)

          write_secret("PREVIEW_SSH_PRIVATE_KEY", os.path.expanduser("~/.ssh/id_ed25519"))
          write_secret("PREVIEW_SSH_KNOWN_HOSTS", os.path.expanduser("~/.ssh/known_hosts"))
          PY
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Resolve remote preview directory
        id: remote
        run: |
          ssh_cmd=(ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes)
          remote_dir="$("${ssh_cmd[@]}" "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" 'printf "%s/alice-preview" "$HOME"')"
          test -n "$remote_dir"
          echo "base_dir=$remote_dir" >> "$GITHUB_OUTPUT"
      - name: Cleanup expired previews
        env:
          REMOTE_BASE_DIR: ${{ steps.remote.outputs.base_dir }}
        run: |
          ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "if [ -f '$REMOTE_BASE_DIR/server.sh' ]; then PREVIEW_SERVER_BASE_DIR='$REMOTE_BASE_DIR' bash '$REMOTE_BASE_DIR/server.sh' cleanup-expired; fi"
