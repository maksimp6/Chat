    value = value.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\\r", "\r")
    value = value.replace("\r\n", "\n").replace("\r", "\n")
    stripped = value.lstrip()
    if not stripped.startswith("-----BEGIN"):
        try:
            decoded = base64.b64decode("".join(value.split()), validate=True).decode("utf-8")
            if decoded.lstrip().startswith("-----BEGIN"):
                value = decoded
        except Exception:
            pass
    with open(path, "w", encoding="utf-8", newline="\n") as handle:
        handle.write(value)

write_secret("PREVIEW_SSH_PRIVATE_KEY", os.path.expanduser("~/.ssh/id_ed25519"))
write_secret("PREVIEW_SSH_KNOWN_HOSTS", os.path.expanduser("~/.ssh/known_hosts"))
PY
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Upload helper and clean
        run: |
          ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "mkdir -p '$PREVIEW_SERVER_BASE_DIR'"
          scp -P "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes deploy/preview/server.sh "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST:$PREVIEW_SERVER_BASE_DIR/server.sh"
          ssh -p "$PREVIEW_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "PREVIEW_SERVER_BASE_DIR='$PREVIEW_SERVER_BASE_DIR' bash '$PREVIEW_SERVER_BASE_DIR/server.sh' cleanup-expired"
