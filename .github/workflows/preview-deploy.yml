name: Host-managed preview validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate
        required: true
        default: master
        type: string

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact commit in Alice Pro host
    # Enable only after #347 and #349 are merged and deployed on the host.
    if: vars.ALICE_HOST_PREVIEW_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Include the short-token path prefix in this secret when host auth requires it.
      ALICE_ENVIRONMENT_HOST_URL: ${{ secrets.ALICE_ENVIRONMENT_HOST_URL }}
      PREVIEW_BRANCH: ${{ github.head_ref || inputs.ref || github.ref_name }}
      PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Check out exact commit
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.PREVIEW_COMMIT }}
          fetch-depth: 1
      - name: Run repository validation
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          git ls-files '*.py' -z | xargs -0 -r python -m py_compile
          python tests/validate_runtime_modules.py
          pytest -q
      - name: Request, exercise, and clean up host environment
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          ALICE_ENVIRONMENT_API_TOKEN: ${{ secrets.ALICE_ENVIRONMENT_API_TOKEN }}
        run: deploy/preview/environment_lifecycle.sh
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
