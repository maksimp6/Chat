name: Preview deployment

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: master
        type: string
      ttl_hours:
        description: Preview lifetime in hours
        required: false
        default: "24"
        type: string
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.ref || github.ref_name || 'scheduled-cleanup' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# The SSH and public URL values are stored in the production environment.
# Every job that needs them must explicitly opt into that environment.
env:
  PREVIEW_SERVER_BASE_DIR: ${{ vars.PREVIEW_SERVER_BASE_DIR || '/opt/alice-preview' }}
  PREVIEW_SSH_PORT: ${{ vars.PREVIEW_SSH_PORT || '22' }}
  PREVIEW_DEFAULT_TTL_HOURS: ${{ vars.PREVIEW_TTL_HOURS || '24' }}

jobs:
  deploy:
    name: Deploy isolated preview
    environment: production
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    env:
      PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
      PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
      PREVIEW_PUBLIC_BASE_URL: ${{ secrets.PREVIEW_PUBLIC_BASE_URL }}
      INPUT_REF: ${{ inputs.ref || '' }}
      INPUT_TTL_HOURS: ${{ inputs.ttl_hours || '' }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PREVIEW_REF: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
    steps:
      - name: Check required preview configuration
        run: |
          test -n "$PREVIEW_SSH_HOST" || { echo "Missing PREVIEW_SSH_HOST"; exit 1; }
          test -n "$PREVIEW_SSH_USER" || { echo "Missing PREVIEW_SSH_USER"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing PREVIEW_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$PREVIEW_SSH_KNOWN_HOSTS" || { echo "Missing PREVIEW_SSH_KNOWN_HOSTS"; exit 1; }
          test -n "$PREVIEW_PUBLIC_BASE_URL" || { echo "Missing PREVIEW_PUBLIC_BASE_URL"; exit 1; }

      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}
          fetch-depth: 1

      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PREVIEW_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Resolve preview identity
        id: preview
        env:
          DEFAULT_TTL: ${{ env.PREVIEW_DEFAULT_TTL_HOURS }}
        run: |
          if [ -n "$PR_NUMBER" ]; then raw_key="pr-$PR_NUMBER"; else raw_key="branch-${INPUT_REF:-$GITHUB_REF_NAME}"; fi
          key="$(printf '%s' "$raw_key" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-*//; s/-*$//' | cut -c1-50)"
          test -n "$key" || { echo "Could not derive preview key"; exit 1; }
          ttl="${INPUT_TTL_HOURS:-$DEFAULT_TTL}"
          case "$ttl" in ''|*[!0-9]*) echo "TTL must be an integer"; exit 1;; esac
          [ "$ttl" -gt 0 ] && [ "$ttl" -le 720 ] || { echo "TTL must be between 1 and 720 hours"; exit 1; }
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "base_path=/preview/$key" >> "$GITHUB_OUTPUT"
          echo "ttl_hours=$ttl" >> "$GITHUB_OUTPUT"

      - name: Build source archive
        run: tar --exclude=.git --exclude=.github --exclude=node_modules --exclude=preview.tar.gz -czf preview.tar.gz .

      - name: Upload preview bundle and deploy script
        env: { KEY: ${{ steps.preview.outputs.key }} }
        run: |
          ssh -p "$PREVIEW_SSH_PORT" -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "mkdir -p '$PREVIEW_SERVER_BASE_DIR/incoming' '$PREVIEW_SERVER_BASE_DIR/previews'"
          scp -P "$PREVIEW_SSH_PORT" -o IdentitiesOnly=yes deploy/preview/server.sh "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST:$PREVIEW_SERVER_BASE_DIR/server.sh"
          scp -P "$PREVIEW_SSH_PORT" -o IdentitiesOnly=yes preview.tar.gz "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST:$PREVIEW_SERVER_BASE_DIR/incoming/$KEY.tar.gz"

      - name: Deploy preview container
        env:
          KEY: ${{ steps.preview.outputs.key }}
          BASE_PATH: ${{ steps.preview.outputs.base_path }}
          TTL_HOURS: ${{ steps.preview.outputs.ttl_hours }}
        run: ssh -p "$PREVIEW_SSH_PORT" -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "PREVIEW_SERVER_BASE_DIR='$PREVIEW_SERVER_BASE_DIR' bash '$PREVIEW_SERVER_BASE_DIR/server.sh' deploy '$KEY' '$BASE_PATH' '$PREVIEW_SERVER_BASE_DIR/incoming/$KEY.tar.gz' '$TTL_HOURS'"

      - name: Public health check
        env: { KEY: ${{ steps.preview.outputs.key }} }
        run: |
          preview_url="${PREVIEW_PUBLIC_BASE_URL%/}/preview/${KEY}/"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$preview_url" >/dev/null; then echo "Preview URL: $preview_url"; echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"; exit 0; fi
            sleep 5
          done
          echo "Preview failed public health check: $preview_url"; exit 1

      - name: Publish preview summary
        env:
          KEY: ${{ steps.preview.outputs.key }}
          BASE_PATH: ${{ steps.preview.outputs.base_path }}
          TTL_HOURS: ${{ steps.preview.outputs.ttl_hours }}
        run: |
          preview_url="${PREVIEW_PUBLIC_BASE_URL%/}${BASE_PATH}/"
          { echo "## Preview deployment"; echo "- Ref: \`$PREVIEW_REF\`"; echo "- Preview: \`$KEY\`"; echo "- URL: $preview_url"; echo "- TTL: ${TTL_HOURS} hours"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on pull request
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEY: ${{ steps.preview.outputs.key }}
          BASE_PATH: ${{ steps.preview.outputs.base_path }}
        run: |
          preview_url="${PREVIEW_PUBLIC_BASE_URL%/}${BASE_PATH}/"
          body="$(printf 'Preview deployed: %s\n\nCommit: \`%s\`' "$preview_url" "$PREVIEW_REF")"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -d "$payload"

  cleanup_pr:
    name: Cleanup closed pull request preview
    environment: production
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
      PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check preview server configuration
        run: |
          test -n "$PREVIEW_SSH_HOST" || { echo "Missing PREVIEW_SSH_HOST"; exit 1; }
          test -n "$PREVIEW_SSH_USER" || { echo "Missing PREVIEW_SSH_USER"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing PREVIEW_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$PREVIEW_SSH_KNOWN_HOSTS" || { echo "Missing PREVIEW_SSH_KNOWN_HOSTS"; exit 1; }
      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PREVIEW_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Remove closed preview
        run: ssh -p "$PREVIEW_SSH_PORT" -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "if [ -f '$PREVIEW_SERVER_BASE_DIR/server.sh' ]; then PREVIEW_SERVER_BASE_DIR='$PREVIEW_SERVER_BASE_DIR' bash '$PREVIEW_SERVER_BASE_DIR/server.sh' cleanup 'pr-$PR_NUMBER'; fi"

  cleanup_expired:
    name: Cleanup expired previews
    environment: production
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
      PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check preview server configuration
        run: |
          test -n "$PREVIEW_SSH_HOST" || { echo "Missing PREVIEW_SSH_HOST"; exit 1; }
          test -n "$PREVIEW_SSH_USER" || { echo "Missing PREVIEW_SSH_USER"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing PREVIEW_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$PREVIEW_SSH_KNOWN_HOSTS" || { echo "Missing PREVIEW_SSH_KNOWN_HOSTS"; exit 1; }
      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PREVIEW_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Refresh server helper
        uses: actions/checkout@v4
        with: { ref: master, fetch-depth: 1 }
      - name: Upload server helper
        run: |
          ssh -p "$PREVIEW_SSH_PORT" -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "mkdir -p '$PREVIEW_SERVER_BASE_DIR'"
          scp -P "$PREVIEW_SSH_PORT" -o IdentitiesOnly=yes deploy/preview/server.sh "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST:$PREVIEW_SERVER_BASE_DIR/server.sh"
      - name: Remove expired previews
        run: ssh -p "$PREVIEW_SSH_PORT" -o IdentitiesOnly=yes "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" "PREVIEW_SERVER_BASE_DIR='$PREVIEW_SERVER_BASE_DIR' bash '$PREVIEW_SERVER_BASE_DIR/server.sh' cleanup-expired"
