name: Visual chat bubble test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/visual" playwright@1.47.2
          NODE_PATH="$RUNNER_TEMP/visual/node_modules" npx --prefix "$RUNNER_TEMP/visual" playwright install --with-deps chromium

      - name: Render the bubble and check it
        shell: bash
        env:
          VISUAL_OUT: ${{ runner.temp }}/visual-chat
          NODE_PATH: ${{ runner.temp }}/visual/node_modules
        run: |
          set -euo pipefail
          node tests/visual/render_chat_bubble.js

      - name: Keep the screenshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-chat-bubble
          path: ${{ runner.temp }}/visual-chat
          if-no-files-found: warn
