name: Q14 educational simulation

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - scripts/q14_simulation.py
      - scripts/q14_ai_review.py
      - tests/test_q14_simulation.py
      - docs/simulations/q14.md
      - .github/workflows/q14-simulation.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "offline / catalogue probe / explicitly approved paid live review"
        type: choice
        options: [offline, probe, live]
        default: probe
        required: true
      approved_calls:
        description: "Live only: 3 serial calls, <=4096 output tokens each; no hard currency cap"
        type: string
        default: "0"
      approval_reference:
        description: "Live only: link to owner approval of scope and these limits"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: q14-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    name: Q14 deterministic scenarios and negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        with:
          python-version: "3.14"
      - name: Record exact checkout
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: echo "Q14_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Regression tests without network or credentials
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: python -m unittest discover -s tests -p test_q14_simulation.py -v
      - name: Simulate and record evidence
        id: policy_step_05
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: python -m scripts.q14_ai_review --mode offline --out q14-offline
      - name: Publish summary
        id: policy_step_06
        continue-on-error: true
        if: always()
        run: test ! -f q14-offline/report.md || cat q14-offline/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: policy_step_07
        continue-on-error: true
        if: always()
        with:
          name: q14-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: q14-offline/
          if-no-files-found: warn
          retention-days: 14
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

  provider:
    name: Q14 bounded provider evidence (not product acceptance)
    needs: offline
    if: >-
      github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.mode != 'offline') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.ref == 'feat/q14-ai-simulation' &&
      (github.event.action != 'labeled' ||
      (github.event.label.name == 'q14-ai-approved-3-calls' && github.event.sender.login == github.repository_owner))))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        with:
          python-version: "3.14"
      - name: Record exact checkout
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: echo "Q14_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Select mode and explicit admission (no secrets)
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CALLS: ${{ inputs.approved_calls }}
          INPUT_APPROVAL: ${{ inputs.approval_reference }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          mode, calls, approval = "probe", 0, ""
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              mode = os.environ["INPUT_MODE"]
              calls = int(os.environ["INPUT_CALLS"] or "0")
              approval = os.environ["INPUT_APPROVAL"]
          elif event.get("action") == "labeled":
              mode, calls = "live", 3
              approval = event["pull_request"]["html_url"] + "#owner-label-q14-ai-approved-3-calls"
          if mode == "live" and (calls != 3 or not approval.strip()):
              raise SystemExit("owner_budget_approval_required")
          Path("q14-admission.json").write_text(json.dumps({
              "mode": mode, "calls": calls, "approval": approval,
          }))
          PY
      - name: Read catalogue or run owner-approved bounded AI review
        id: policy_step_05
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          config = json.loads(Path("q14-admission.json").read_text())
          command = [sys.executable, "-m", "scripts.q14_ai_review", "--mode", config["mode"],
                     "--out", "q14-provider", "--approved-calls", str(config["calls"]),
                     "--approval-reference", config["approval"]]
          raise SystemExit(subprocess.call(command))
          PY
      - name: Publish bounded summary
        id: policy_step_06
        continue-on-error: true
        if: always()
        run: test ! -f q14-provider/report.md || cat q14-provider/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: policy_step_07
        continue-on-error: true
        if: always()
        with:
          name: q14-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: q14-provider/
          if-no-files-found: warn
          retention-days: 14
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
