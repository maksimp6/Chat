name: Logos Redmi 9 A1 mini Stand slicer
on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/logos-redmi9-stand.yml"
      - "3d-models/logos-redmi9-stand/*"
      - "scripts/logos_redmi9_stand_slice.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-sliced-pla-stand:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native CAD and slicer dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            openscad fonts-dejavu-core \
            libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            libgstreamer-gl1.0-0 libegl1
      - name: Build print-ready STL with OpenSCAD and negative control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-stand
          openscad --export-format binstl \
            -o out-stand/Logos_Redmi9_Stand_A1mini_v3.stl \
            3d-models/logos-redmi9-stand/Logos_Redmi9_Stand_A1mini_v3.scad
          python3 scripts/logos_redmi9_stand_slice.py \
            --model out-stand/Logos_Redmi9_Stand_A1mini_v3.stl \
            --output-dir out-stand --validate-only
          head -c 84 out-stand/Logos_Redmi9_Stand_A1mini_v3.stl > out-stand/corrupt.stl
          if python3 scripts/logos_redmi9_stand_slice.py \
            --model out-stand/corrupt.stl \
            --output-dir out-stand --validate-only; then
            echo 'Negative control passed unexpectedly' >&2
            exit 1
          fi
      - name: Download pinned Bambu Studio CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/bambulab/BambuStudio/releases/download/v02.08.02.61/BambuStudio_ubuntu22.04-v02.08.02.61-20260820225108.AppImage' \
            --output BambuStudio.AppImage
          printf '%s  %s\n' \
            '69426a59682574591590f51c913d3889baa19252d1c8e9fcae2497eb0ed6bf92' \
            'BambuStudio.AppImage' | sha256sum --check
          chmod +x BambuStudio.AppImage
          ./BambuStudio.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/bin/bambu-studio
          LD_LIBRARY_PATH="$PWD/squashfs-root/bin" ldd squashfs-root/bin/bambu-studio > out-stand/bambu_dependencies.txt
          ! grep -q 'not found' out-stand/bambu_dependencies.txt
      - name: Slice stand using A1 mini Generic PLA profile and audit result
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/logos_redmi9_stand_slice.py \
            --model "$GITHUB_WORKSPACE/out-stand/Logos_Redmi9_Stand_A1mini_v3.stl" \
            --slicer-root "$GITHUB_WORKSPACE/squashfs-root" \
            --output-dir "$GITHUB_WORKSPACE/out-stand"
          test -s out-stand/Logos_Redmi9_Stand_v3_Generic_PLA_A1mini.gcode.3mf
          cat out-stand/stand_audit.json
      - name: Build and validate compact Redmi 9 stand with cable slot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-small
          openscad --export-format binstl \
            -o out-small/Logos_Redmi9_Compact_A1mini.stl \
            3d-models/logos-redmi9-stand/Logos_Redmi9_Compact_A1mini.scad
          python3 scripts/logos_redmi9_stand_slice.py \
            --variant compact --validate-only \
            --model out-small/Logos_Redmi9_Compact_A1mini.stl \
            --output-dir out-small
          head -c 84 out-small/Logos_Redmi9_Compact_A1mini.stl > out-small/invalid.stl
          if python3 scripts/logos_redmi9_stand_slice.py \
            --variant compact --validate-only \
            --model out-small/invalid.stl --output-dir out-small; then
            echo 'Compact negative control unexpectedly succeeded' >&2
            exit 1
          fi
      - name: Slice compact Redmi 9 stand under the same A1 mini profile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/logos_redmi9_stand_slice.py \
            --variant compact \
            --model "$GITHUB_WORKSPACE/out-small/Logos_Redmi9_Compact_A1mini.stl" \
            --slicer-root "$GITHUB_WORKSPACE/squashfs-root" \
            --output-dir "$GITHUB_WORKSPACE/out-small"
          test -s out-small/Logos_Redmi9_Stand_Compact_Generic_PLA_A1mini.gcode.3mf
          cat out-small/stand_audit.json
      - name: Publish compact sliced but unprinted stand
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logos-redmi9-compact-sliced-not-printed
          path: |
            out-small/Logos_Redmi9_Stand_Compact_Generic_PLA_A1mini.gcode.3mf
            out-small/stand_audit.json
            out-small/Logos_Redmi9_Compact_A1mini.stl
            out-small/preview.png
          if-no-files-found: error
          retention-days: 7
      - name: Publish sliced but unprinted stand
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logos-redmi9-stand-v3-sliced-not-printed
          path: |
            out-stand/Logos_Redmi9_Stand_v3_Generic_PLA_A1mini.gcode.3mf
            out-stand/stand_audit.json
            out-stand/Logos_Redmi9_Stand_A1mini_v3.stl
            out-stand/preview.png
          if-no-files-found: error
          retention-days: 7
