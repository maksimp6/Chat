name: RKN compliance

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  compliance:
    name: RKN compliance contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run deterministic compliance tests
        run: python -m pytest -q tests/test_rkn_compliance_inspector.py
      - name: Build evidence-backed repository manifest
        run: python scripts/rkn_compliance_inspector.py --output actual-state.json
      - name: Show manifest
        run: cat actual-state.json
      - name: Upload compliance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rkn-compliance-${{ github.run_number }}
          path: actual-state.json
          if-no-files-found: error
