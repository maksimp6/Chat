name: Remote Desktop Commander deployment
on:
  pull_request:
    paths:
      - "deploy/remote-desktop-commander/**"
      - ".github/workflows/remote-desktop-commander.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: Install the isolated Remote Desktop Commander beside preview
        type: choice
        options: [preflight, install, status]
        default: preflight
permissions:
  contents: read
concurrency:
  group: alice-remote-desktop-commander
  cancel-in-progress: false
jobs:
  refresh-lock:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate candidate dependency lock for review
        working-directory: deploy/remote-desktop-commander
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --omit=dev --no-audit --no-fund
          npm audit --omit=dev --json > npm-audit.json || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rdc-candidate-lock
          path: |
            deploy/remote-desktop-commander/package-lock.json
            deploy/remote-desktop-commander/npm-audit.json
          retention-days: 1
  validate-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose and build the actual CLI image
        run: |
          docker compose -f deploy/remote-desktop-commander/compose.yaml config --quiet
          docker compose -f deploy/remote-desktop-commander/compose.yaml build
      - name: Exercise volume initialization and non-root CLI startup
        working-directory: deploy/remote-desktop-commander
        run: |
          set -euo pipefail
          mkdir -m 700 state workspace
          docker compose run --rm --no-deps initialize
          docker compose run --rm --no-deps commander remote --help
          docker compose run --rm --no-deps --entrypoint bash commander -euc '
            test "$(id -u)" = 1000
            test "$(stat -c %a /home/node)" = 700
            test "$(stat -c %a /workspace)" = 700
            touch /home/node/write-check /workspace/write-check
            grep -qE "^CapEff:[[:space:]]+0+$" /proc/self/status
          '
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      SSH_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
      SSH_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.PREVIEW_SSH_PORT || '22' }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare existing preview SSH credentials
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_HOSTS"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]]
          install -d -m 700 "$RUNNER_TEMP/commander-ssh"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'commander-ssh'
          for env, name in [('SSH_KEY', 'key'), ('SSH_HOSTS', 'known_hosts')]:
              value = os.environ[env].replace('\\n', '\n').replace('\r', '')
              path = root / name
              path.write_text(value.rstrip('\n') + '\n')
              path.chmod(0o600)
          PY
          ssh-keygen -y -f "$RUNNER_TEMP/commander-ssh/key" >/dev/null
      - name: Deploy or inspect the isolated service
        run: |
          set -euo pipefail
          ssh_args=(-p "$SSH_PORT" -i "$RUNNER_TEMP/commander-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/commander-ssh/known_hosts" -o ConnectTimeout=10)
          target="$SSH_USER@$SSH_HOST"
          case "$OPERATION" in
            preflight|status)
              ssh "${ssh_args[@]}" "$target" "bash -s -- '$OPERATION'" < deploy/remote-desktop-commander/server.sh
              ;;
            install)
              git archive --format=tar.gz HEAD deploy/remote-desktop-commander > "$RUNNER_TEMP/commander.tar.gz"
              ssh "${ssh_args[@]}" "$target" 'umask 077; mkdir -p "$HOME/alice-preview/incoming"; cat > "$HOME/alice-preview/incoming/remote-desktop-commander.tar.gz"' < "$RUNNER_TEMP/commander.tar.gz"
              ssh "${ssh_args[@]}" "$target" "bash -s -- install '$GITHUB_SHA'" < deploy/remote-desktop-commander/server.sh
              ;;
            *) exit 2 ;;
          esac
      - name: Remove temporary credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/commander-ssh" "$RUNNER_TEMP/commander.tar.gz"
