name: Remote Desktop Commander image validation
on:
  pull_request:
    paths:
      - "deploy/remote-desktop-commander/**"
      - ".github/workflows/remote-desktop-commander.yml"
permissions:
  contents: read
concurrency:
  group: alice-remote-desktop-commander-validation
  cancel-in-progress: true
jobs:
  validate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate Compose and build the actual CLI image
        run: |
          node --test deploy/remote-desktop-commander/pairing-handoff.test.cjs
          node --test deploy/remote-desktop-commander/desktop-session.test.cjs
          docker compose -f deploy/remote-desktop-commander/compose.yaml config --quiet
          docker compose -f deploy/remote-desktop-commander/compose.yaml build
      - name: Validate lightweight MCP image
        working-directory: deploy/remote-desktop-commander
        run: |
          set -euo pipefail
          docker build -f Dockerfile.mcp -t alice-rdc-mcp:candidate .
          trap 'docker rm -f rdc-mcp-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name rdc-mcp-ci -e ALICE_RDC_MCP_TOKEN=ci-smoke-token alice-rdc-mcp:candidate
          timeout 30s bash -c 'until docker exec rdc-mcp-ci node -e "fetch(\"http://127.0.0.1:8080/healthz\").then(r=>{if(!r.ok)process.exit(1)})"; do sleep 1; done'
          docker exec rdc-mcp-ci sh -euc '! command -v chromium; ! command -v chromium-browser'
          docker exec -e RDC_MCP_SMOKE_URL=http://127.0.0.1:8080/mcp \
            -e RDC_MCP_SMOKE_TOKEN=ci-smoke-token \
            rdc-mcp-ci node /opt/desktop-commander/mcp-gateway-live-smoke.mjs
          docker exec rdc-mcp-ci bash -euc 'python --version | grep -E "^Python 3\.14\."; node --version | grep -E "^v22\."; npm --version'
          docker exec rdc-mcp-ci bash -euc 'for tool in vim jq less tree ps make file patch tar unzip zip rsync openssl gpg lsof nc shellcheck ip ss dig rg git; do command -v "$tool"; done'
          docker exec rdc-mcp-ci bash -euc 'test -r /usr/share/bash-completion/bash_completion'
          docker exec -u 0 rdc-mcp-ci bash -euc 'mkdir -p /tmp/alice-src; chown 1000:1000 /tmp/alice-src'
          docker cp "$GITHUB_WORKSPACE/." rdc-mcp-ci:/tmp/alice-src/
          docker exec -u 0 rdc-mcp-ci chown -R 1000:1000 /tmp/alice-src
          docker exec -e ALICE_RDC_DEV_VENV=/tmp/alice-venv rdc-mcp-ci \
            alice-rdc-dev-bootstrap /tmp/alice-src
          docker exec rdc-mcp-ci bash -euc 'for tool in gh eds cloud yc; do command -v "$tool"; done'
          docker exec rdc-mcp-ci bash -euc \
            'cd /tmp/alice-src; PATH=/tmp/alice-venv/bin:$PATH bash scripts/pre_push.sh'
      - name: Exercise volume initialization and non-root CLI startup
        working-directory: deploy/remote-desktop-commander
        run: |
          set -euo pipefail
          mkdir -m 700 state workspace
          docker compose run --rm --no-deps initialize
          docker compose run --rm --no-deps commander remote --help
          timeout 40s docker compose run --rm --no-deps commander --browser-smoke-test
          docker compose run --rm --no-deps --entrypoint bash commander -euc '
            test -d /home/node/.config/chromium/Default
            test "$(stat -c %a /home/node/.config/chromium)" = 700
          '
          timeout 40s docker compose run --rm --no-deps commander --browser-smoke-test
          docker compose run --rm --no-deps --entrypoint bash commander -euc '
            test "$(id -u)" = 1000
            test "$(stat -c %a /home/node)" = 700
            test "$(stat -c %a /workspace)" = 700
            touch /home/node/write-check /workspace/write-check
            grep -qE "^CapEff:[[:space:]]+0+$" /proc/self/status
          '
      - name: Verify HTTP probe without RDC authentication
        working-directory: deploy/remote-desktop-commander
        run: |
          set -euo pipefail
          trap 'docker rm -f rdc-cloud-probe >/dev/null 2>&1 || true' EXIT
          docker compose run -d --name rdc-cloud-probe --no-deps -e ALICE_RDC_MODE=cloud-probe commander
          timeout 30s docker exec rdc-cloud-probe node -e '
            const {setTimeout: delay} = require("node:timers/promises");
            (async () => {
              for (let attempt = 0; attempt < 60; attempt++) {
                try {
                  const response = await fetch("http://127.0.0.1:8080/healthz", {signal: AbortSignal.timeout(1000)});
                  const result = await response.json();
                  if (response.ok && result.mode === "cloud-probe" && result.smoke_passed === true) return;
                } catch {}
                await delay(250);
              }
              process.exitCode = 1;
            })();
          '
      - name: Verify closed state recovery on a mounted volume without RDC authentication
        working-directory: deploy/remote-desktop-commander
        env:
          ALICE_RDC_PROJECT_ID: 94ae3a86-671f-40ae-9323-e81d3626135e
        run: |
          set -euo pipefail
          state_test="$RUNNER_TEMP/rdc-closed-state"
          mkdir -m 700 "$state_test" "$state_test/state" "$state_test/home" "$state_test/workspace"
          docker compose run --rm --no-deps --user 0:0 --cap-add CHOWN --cap-add FOWNER \
            -v "$state_test/state:/rdc-state" -v "$state_test/home:/home/node" \
            -v "$state_test/workspace:/workspace" --entrypoint bash commander -euc \
            'chown 1000:1000 /rdc-state /home/node /workspace; chmod 700 /rdc-state /home/node /workspace'
          docker compose run --rm --no-deps -v "$state_test/state:/rdc-state" \
            -e ALICE_RDC_PROJECT_ID --entrypoint python3 commander -c '
          import json, os
          from pathlib import Path
          from uuid import UUID
          project = os.environ["ALICE_RDC_PROJECT_ID"]
          Path("/rdc-state/owner.json").write_text(json.dumps({"schema": 1, "purpose": "alice-rdc",
              "project_id": project, "container_name": "rdc-" + UUID(project).hex[:12]}))
          Path("/workspace/restore-sentinel.sh").write_text("#!/bin/sh\nexit 0\n")
          Path("/workspace/restore-sentinel.sh").chmod(0o700)
          '
          # Both original smoke processes have exited; the live profile is closed.
          docker compose run --rm --no-deps -v "$state_test/state:/rdc-state" \
            -e ALICE_RDC_PROJECT_ID --entrypoint python3 commander \
            /opt/desktop-commander/state-store.py checkpoint
          docker compose run --rm --no-deps -v "$state_test/state:/rdc-state" \
            -v "$state_test/home:/home/node" -v "$state_test/workspace:/workspace" \
            -e ALICE_RDC_PROJECT_ID --entrypoint python3 commander \
            /opt/desktop-commander/state-store.py restore
          docker compose run --rm --no-deps -v "$state_test/home:/home/node" \
            -v "$state_test/workspace:/workspace" --entrypoint bash commander -euc \
            'test -d /home/node/.config/chromium/Default; /workspace/restore-sentinel.sh'
          timeout 40s docker compose run --rm --no-deps -v "$state_test/home:/home/node" \
            -v "$state_test/workspace:/workspace" commander --browser-smoke-test