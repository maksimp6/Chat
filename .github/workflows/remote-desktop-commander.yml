name: Remote Desktop Commander validation
on:
  pull_request:
    paths:
      - "deploy/remote-desktop-commander/**"
      - ".github/workflows/remote-desktop-commander.yml"
permissions:
  contents: read
concurrency:
  group: alice-rdc-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate focused RDC runtime contract
        working-directory: deploy/remote-desktop-commander
        run: |
          timeout 15s bash -euo pipefail -c '
            node --test pairing-handoff.test.cjs desktop-session.test.cjs
            docker compose config --quiet
          '
