name: Remote Desktop Commander image validation
on:
  pull_request:
    paths:
      - "deploy/remote-desktop-commander/**"
      - ".github/workflows/remote-desktop-commander.yml"
permissions:
  contents: read
concurrency:
  group: alice-remote-desktop-commander-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate Compose and build the actual CLI image
        run: |
          node --test deploy/remote-desktop-commander/pairing-handoff.test.cjs
          node --test deploy/remote-desktop-commander/desktop-session.test.cjs
          docker build -f deploy/remote-desktop-commander/Dockerfile.base -t alice-rdc-base:ci deploy/remote-desktop-commander
          RDC_BASE_IMAGE=alice-rdc-base:ci docker compose -f deploy/remote-desktop-commander/compose.yaml config --quiet
          RDC_BASE_IMAGE=alice-rdc-base:ci docker compose -f deploy/remote-desktop-commander/compose.yaml build
      - name: Test Alice Dev OAuth and gateway contracts
        working-directory: deploy/remote-desktop-commander
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node --test oauth.test.mjs credential-handoff.test.mjs mcp-gateway-origin.test.mjs oauth-discovery-smoke.test.mjs
      - name: Validate Alice Dev MCP image
        working-directory: deploy/remote-desktop-commander
        run: |
          set -euo pipefail
          docker build -f Dockerfile.mcp -t alice-dev:candidate .
          trap 'docker rm -f alice-dev-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name alice-dev-ci -e ALICE_SHORT_TOKEN=ci-smoke-token \
            -e ALICE_DEV_PUBLIC_URL=http://127.0.0.1:8080 alice-dev:candidate
          timeout 30s bash -c 'until docker exec alice-dev-ci node -e "fetch(\"http://127.0.0.1:8080/healthz\").then(r=>{if(!r.ok)process.exit(1)})"; do sleep 1; done'
          docker exec alice-dev-ci sh -euc '! command -v chromium; ! command -v chromium-browser'
          docker exec -e ALICE_DEV_SMOKE_URL=http://127.0.0.1:8080/mcp \
            -e ALICE_DEV_SMOKE_TOKEN=ci-smoke-token \
            alice-dev-ci node /opt/desktop-commander/mcp-gateway-live-smoke.mjs
      - name: Exercise volume initialization and non-root CLI startup
        working-directory: deploy/remote-desktop-commander
        run: |
          set -euo pipefail
          mkdir -m 700 state workspace
          docker compose run --rm --no-deps initialize
          docker compose run --rm --no-deps commander remote --help
          docker compose run --rm --no-deps --entrypoint bash commander -euc '
            command -v git
            command -v ssh
            command -v rg
            python3 -c "import json, pathlib, uuid"
            python3 -m venv /tmp/rdc-ci-venv
            ! command -v chromium
            ! command -v chromium-browser
            test "$(id -u)" = 1000
            test "$(stat -c %a /home/node)" = 700
            test "$(stat -c %a /workspace)" = 700
            touch /home/node/write-check /workspace/write-check
            grep -qE "^CapEff:[[:space:]]+0+$" /proc/self/status
          '
      - name: Verify closed state recovery on a mounted volume
        working-directory: deploy/remote-desktop-commander
        env:
          ALICE_RDC_PROJECT_ID: 94ae3a86-671f-40ae-9323-e81d3626135e
        run: |
          set -euo pipefail
          state_test="$RUNNER_TEMP/rdc-closed-state"
          mkdir -m 700 "$state_test" "$state_test/state" "$state_test/home" "$state_test/workspace"
          docker compose run --rm --no-deps --user 0:0 --cap-add CHOWN --cap-add FOWNER \
            -v "$state_test/state:/rdc-state" -v "$state_test/home:/home/node" \
            -v "$state_test/workspace:/workspace" --entrypoint bash commander -euc \
            'chown 1000:1000 /rdc-state /home/node /workspace; chmod 700 /rdc-state /home/node /workspace'
          docker compose run --rm --no-deps -v "$state_test/state:/rdc-state" \
            -e ALICE_RDC_PROJECT_ID --entrypoint python3 commander -c '
          import json, os
          from pathlib import Path
          from uuid import UUID
          project = os.environ["ALICE_RDC_PROJECT_ID"]
          Path("/rdc-state/owner.json").write_text(json.dumps({"schema": 1, "purpose": "alice-rdc",
              "project_id": project, "container_name": "rdc-" + UUID(project).hex[:12]}))
          Path("/workspace/restore-sentinel.sh").write_text("#!/bin/sh\nexit 0\n")
          Path("/workspace/restore-sentinel.sh").chmod(0o700)
          '
          # Both original smoke processes have exited; the live profile is closed.
          docker compose run --rm --no-deps -v "$state_test/state:/rdc-state" \
            -e ALICE_RDC_PROJECT_ID --entrypoint python3 commander \
            /opt/desktop-commander/state-store.py checkpoint
          docker compose run --rm --no-deps -v "$state_test/state:/rdc-state" \
            -v "$state_test/home:/home/node" -v "$state_test/workspace:/workspace" \
            -e ALICE_RDC_PROJECT_ID --entrypoint python3 commander \
            /opt/desktop-commander/state-store.py restore
          docker compose run --rm --no-deps -v "$state_test/home:/home/node" \
            -v "$state_test/workspace:/workspace" --entrypoint bash commander -euc \
            'test -x /workspace/restore-sentinel.sh; /workspace/restore-sentinel.sh; ! command -v chromium; ! command -v chromium-browser'
