name: Cloud.ru persistent Chrome MCP

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy or inspect the separate Chrome MCP service behind Gateway
        type: choice
        options: [preflight, deploy, status, restart, stop]
        default: preflight
      storage_tenant_id:
        description: Object Storage tenant ID (not a secret); required for preflight/deploy unless configured
        type: string
        required: false
      public_url:
        description: Gateway HTTPS origin; defaults to the Chrome container name under maxxxpavlov.online
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: alice-cloudru-persistent-chrome
  cancel-in-progress: false

jobs:
  chrome:
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require reviewed master commit
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.action == 'deploy'
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: deploy/chrome-worker/package-lock.json
      - name: Install official MCP client
        if: inputs.action == 'deploy'
        run: npm ci --prefix deploy/chrome-worker
      - name: Prepare live acceptance identity
        if: inputs.action == 'deploy'
        env:
          CLOUDRU_PROJECT_ID: ${{ vars.CLOUDRU_PROJECT_ID }}
          BROWSER_PUBLIC_URL: ${{ inputs.public_url || vars.BROWSER_PUBLIC_URL }}
        run: |
          python - <<'PY'
          import os
          from uuid import uuid4
          from scripts.cloudru_chrome import names, public_origin
          origin = os.environ.get("BROWSER_PUBLIC_URL") or f"https://{names(os.environ['CLOUDRU_PROJECT_ID'])[0]}.maxxxpavlov.online"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("BROWSER_PUBLIC_URL=" + public_origin(origin) + "\n")
              stream.write("BROWSER_SMOKE_MARKER=" + uuid4().hex + "\n")
          PY
      - name: Operate separate Chrome service
        env:
          ACTION: ${{ inputs.action }}
          SOURCE_SHA: ${{ github.sha }}
          CLOUDRU_STORAGE_TENANT_ID: ${{ inputs.storage_tenant_id || vars.CLOUDRU_STORAGE_TENANT_ID }}
          CLOUDRU_PROJECT_ID: ${{ vars.CLOUDRU_PROJECT_ID }}
          CLOUDRU_IAM_KEY_ID: ${{ secrets.CLOUDRU_IAM_KEY_ID }}
          CLOUDRU_IAM_KEY_SECRET: ${{ secrets.CLOUDRU_IAM_KEY_SECRET }}
          BROWSER_API_TOKEN: ${{ secrets.BROWSER_API_TOKEN || secrets.ALICE_SHORT_TOKEN }}
          BROWSER_PUBLIC_URL: ${{ inputs.public_url || vars.BROWSER_PUBLIC_URL }}
          ALICE_GITHUB_CLIENT_ID: ${{ secrets.BROWSER_GITHUB_CLIENT_ID || secrets.ALICE_GITHUB_CLIENT_ID }}
          ALICE_GITHUB_CLIENT_SECRET: ${{ secrets.BROWSER_GITHUB_CLIENT_SECRET || secrets.ALICE_GITHUB_CLIENT_SECRET }}
          ALICE_GITHUB_ALLOWED_IDS: ${{ vars.ALICE_GITHUB_ALLOWED_IDS || '293531601' }}
        run: python scripts/cloudru_chrome.py "$ACTION" --sha "$SOURCE_SHA"
      - name: Seed real browser profile through Gateway MCP
        if: inputs.action == 'deploy'
        env:
          BROWSER_API_TOKEN: ${{ secrets.BROWSER_API_TOKEN || secrets.ALICE_SHORT_TOKEN }}
        run: node deploy/chrome-worker/live-smoke.mjs seed
      - name: Restart private Chrome with a verified checkpoint
        if: inputs.action == 'deploy'
        env:
          SOURCE_SHA: ${{ github.sha }}
          CLOUDRU_PROJECT_ID: ${{ vars.CLOUDRU_PROJECT_ID }}
          CLOUDRU_IAM_KEY_ID: ${{ secrets.CLOUDRU_IAM_KEY_ID }}
          CLOUDRU_IAM_KEY_SECRET: ${{ secrets.CLOUDRU_IAM_KEY_SECRET }}
        run: python scripts/cloudru_chrome.py restart --sha "$SOURCE_SHA"
      - name: Verify MCP and restored browser profile through Gateway
        if: inputs.action == 'deploy'
        env:
          BROWSER_API_TOKEN: ${{ secrets.BROWSER_API_TOKEN || secrets.ALICE_SHORT_TOKEN }}
        run: node deploy/chrome-worker/live-smoke.mjs verify
