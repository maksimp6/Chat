name: Alice

# Alice Pro works on her own code from a GitHub issue.
# Trigger: a maintainer (OWNER/MEMBER/COLLABORATOR) mentions "@alice" in an
# issue or issue comment, or adds the "alice" label.
# Alice only gets her filesystem tools inside this checkout; this workflow
# checks the diff, commits it to alice/issue-<N> and opens a draft pull request.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   YANDEX_API_KEY, YANDEX_PROJECT_ID  - Yandex AI Studio credentials for Alice
#   ALICE_APP_PRIVATE_KEY              - private key of the "Alice Pro" GitHub App, so
#                                        Alice commits, opens PRs and comments under her
#                                        own name; PRs opened with it run CI.
# Repository variable ALICE_APP_CLIENT_ID - client ID of that GitHub App.
# Fallback until the App exists: ALICE_GITHUB_TOKEN, a personal fine-grained token
# of the maintainer (posts appear under the maintainer's name).
# Optional repository variable: ALICE_AGENT_MODEL (default aliceai-llm).

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]

permissions: {}

concurrency:
  group: alice-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  alice:
    name: Alice works on the issue
    if: |
      !github.event.issue.pull_request && (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@alice') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'issues' && github.event.action == 'opened' &&
          (contains(github.event.issue.body, '@alice') || contains(github.event.issue.title, '@alice')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' &&
          github.event.label.name == 'alice'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Checkout repository
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save issue text
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          printf '%s\n' "$ISSUE_TITLE" > "$RUNNER_TEMP/title.txt"
          {
            printf '%s\n' "$ISSUE_BODY"
            if [ -n "$COMMENT_BODY" ]; then
              printf '\n--- maintainer comment ---\n%s\n' "$COMMENT_BODY"
            fi
          } > "$RUNNER_TEMP/body.txt"

      - name: Run Alice
        id: policy_step_05
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
          ALICE_AGENT_MODEL: ${{ vars.ALICE_AGENT_MODEL }}
        run: |
          set -euo pipefail
          ALICE_PROVIDER_CREDENTIAL_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export ALICE_PROVIDER_CREDENTIAL_KEY
          export ALICE_MEMORY_PATH="$RUNNER_TEMP/alice.memory"
          # A failed run is still reported on the issue by the last step.
          python -m agent_runtime.issue_runner \
            --issue "$ISSUE_NUMBER" \
            --title-file "$RUNNER_TEMP/title.txt" \
            --body-file "$RUNNER_TEMP/body.txt" \
            --out "$RUNNER_TEMP/result.json" || echo "Alice runner reported a failure"

      - name: Guard the diff
        id: policy_step_06
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | cut -c4- > "$RUNNER_TEMP/files.txt"
          cat "$RUNNER_TEMP/files.txt"
          if grep -E '^(\.github/|\.env|.*\.(pem|key|jks|keystore)$)' "$RUNNER_TEMP/files.txt"; then
            echo "::error::Alice may not change workflows, env files or keys."
            exit 1
          fi
          if [ "$(wc -l < "$RUNNER_TEMP/files.txt")" -gt 20 ]; then
            echo "::error::Alice changed more than 20 files."
            exit 1
          fi

      - name: Fast checks
        id: policy_step_07
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/files.txt" ]; then
            python -m compileall -q .
            python tests/validate_runtime_modules.py
            python tests/validate_frontend_modules.py
          fi

      - name: Create Alice Pro app token
        continue-on-error: true
        id: app-token
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') && (vars.ALICE_APP_CLIENT_ID != '') }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ALICE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ALICE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Open pull request and report
        id: policy_step_09
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.ALICE_GITHUB_TOKEN }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Neither the Alice Pro GitHub App (ALICE_APP_CLIENT_ID + ALICE_APP_PRIVATE_KEY) nor ALICE_GITHUB_TOKEN is configured."; exit 1; }
          python - "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/report.md" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          # Never echo "@alice" back: a comment must not re-trigger this workflow.
          for key in ("summary",):
              if r.get(key):
                  r[key] = r[key].replace("@", "@\u200b")
          b = r.get("billing", {})
          print(f"Alice ({r.get('model')}) finished with status **{r['status']}**.\n")
          if r.get("summary"):
              print(r["summary"] + "\n")
          if r.get("pending_tools"):
              print("Stopped: these tools need a maintainer's approval: " + ", ".join(r["pending_tools"]) + "\n")
          cost = b.get("total_cost")
          print(f"Cost: {cost} {b.get('currency', 'RUB')} ({b.get('cost_status', 'unknown')}), "
                f"tokens: {b.get('total_tokens', 0)}, trace: `{r.get('trace_id')}`")
          PY
          if [ -s "$RUNNER_TEMP/files.txt" ]; then
            branch="alice/issue-$ISSUE_NUMBER-$GITHUB_RUN_ID"
            gh auth setup-git
            if [ -n "$APP_SLUG" ]; then
              # Commits link to the App's bot account only with its exact name and ID email.
              bot="$APP_SLUG[bot]"
              bot_id="$(gh api "users/$bot" --jq .id)"
              git config user.name "$bot"
              git config user.email "$bot_id+$bot@users.noreply.github.com"
            else
              git config user.name "Alice Pro"
              git config user.email "alice-pro@users.noreply.github.com"
            fi
            git checkout -b "$branch"
            git add -A
            git commit -m "Alice: work on issue #$ISSUE_NUMBER" -m "Closes #$ISSUE_NUMBER"
            git push origin "$branch"
            {
              cat "$RUNNER_TEMP/report.md"
              printf '\nCloses #%s\n' "$ISSUE_NUMBER"
            } > "$RUNNER_TEMP/pr.md"
            url="$(gh pr create --repo "$REPOSITORY" --draft --head "$branch" \
              --title "Alice: issue #$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/pr.md")"
            printf '\nPull request: %s\n' "$url" >> "$RUNNER_TEMP/report.md"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
