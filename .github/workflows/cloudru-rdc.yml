name: Cloud.ru persistent Remote Desktop Commander
on:
  push:
    branches: [fix/787-rdc-512m-single-profile]
    paths:
      - ".github/workflows/cloudru-rdc.yml"
      - "scripts/cloudru_rdc.py"
      - "deploy/remote-desktop-commander/**"
      - "scripts/cloudru_browser_probe.py"
      - "cloud/cloudru/registry_client.py"
      - "cloud/cloudru/registry_client.py"
      - "tests/test_cloudru_container_deploy.py"
  workflow_dispatch:
    inputs:
      action:
        description: One persistent RDC service; install starts device pairing
        type: choice
        options: [preflight, install, status, start, restart, stop]
        default: preflight
      storage_tenant_id:
        description: Object Storage tenant ID (not a secret); required for all actions unless configured
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: alice-cloudru-persistent-rdc-${{ github.sha }}
  cancel-in-progress: false
jobs:
  rdc:
    if: github.ref == 'refs/heads/master' || (github.event_name == 'push' && github.ref == 'refs/heads/fix/787-rdc-512m-single-profile')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require reviewed master commit
        if: github.ref == 'refs/heads/master'
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Publish browserless RDC image once
        env:
          SOURCE_SHA: ${{ github.sha }}
          RDC_LANE: test
          RDC_BASE_IMAGE: alice-rdc-probe.cr.cloud.ru/chromium-probe@sha256:f92bd58af749191733dcf0fee808be5ede654e8a6cdc5930375dbb65c7ce9294
          CLOUDRU_PROJECT_ID: ${{ vars.CLOUDRU_PROJECT_ID }}
          CLOUDRU_IAM_KEY_ID: ${{ secrets.CLOUDRU_IAM_KEY_ID }}
          CLOUDRU_IAM_KEY_SECRET: ${{ secrets.CLOUDRU_IAM_KEY_SECRET }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.cloudru_browser_probe import build_image
          import os
          print(build_image(Path.cwd(), os.environ["SOURCE_SHA"]), flush=True)
          PY
