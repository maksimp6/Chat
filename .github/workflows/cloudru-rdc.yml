name: Cloud.ru persistent Remote Desktop Commander
on:
  push:
    branches: [fix/787-rdc-512m-single-profile]
    paths:
      - ".github/workflows/cloudru-rdc.yml"
      - "scripts/cloudru_rdc.py"
      - "deploy/remote-desktop-commander/**"
  workflow_dispatch:
    inputs:
      action:
        description: One persistent RDC service; install starts device pairing
        type: choice
        options: [preflight, install, status, start, restart, stop]
        default: preflight
      storage_tenant_id:
        description: Object Storage tenant ID (not a secret); required for all actions unless configured
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: alice-cloudru-persistent-rdc-${{ github.sha }}
  cancel-in-progress: false
jobs:
  rdc:
    if: github.ref == 'refs/heads/master' || (github.event_name == 'push' && github.ref == 'refs/heads/fix/787-rdc-512m-single-profile')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require reviewed master commit
        if: github.ref == 'refs/heads/master'
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build dependency image only when dependency key changes
        env:
          CLOUDRU_PROJECT_ID: ${{ vars.CLOUDRU_PROJECT_ID }}
          CLOUDRU_IAM_KEY_ID: ${{ secrets.CLOUDRU_IAM_KEY_ID }}
          CLOUDRU_IAM_KEY_SECRET: ${{ secrets.CLOUDRU_IAM_KEY_SECRET }}
        run: |
          dep_key="$(cat deploy/remote-desktop-commander/Dockerfile.base deploy/remote-desktop-commander/package.json deploy/remote-desktop-commander/package-lock.json | sha256sum | cut -c1-32)"
          echo "RDC_DEP_KEY=$dep_key" >> "$GITHUB_ENV"
          docker build -f deploy/remote-desktop-commander/Dockerfile.base -t "rdc-base:$dep_key" deploy/remote-desktop-commander
      - name: Measure source-only RDC image build
        run: |
          start_ms="$(date +%s%3N)"
          timeout 15s docker build \
            --build-arg "RDC_BASE_IMAGE=rdc-base:$RDC_DEP_KEY" \
            -f deploy/remote-desktop-commander/Dockerfile \
            -t alice-rdc-perf:test \
            deploy/remote-desktop-commander
          end_ms="$(date +%s%3N)"
          elapsed_ms="$((end_ms-start_ms))"
          echo "RDC source-only image build: ${elapsed_ms}ms"
          test "$elapsed_ms" -le 15000
