name: Delete stale branches (one-off)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: DELETE 1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "DELETE 1"

      - name: Delete listed branches
        run: |
          set -uo pipefail
          failed=0
          while read -r b; do
            case "$b" in
              ""|develop|master|main) echo "skip $b"; continue ;;
            esac
            if git push origin --delete "$b"; then
              echo "deleted $b"
            else
              echo "FAILED $b"; failed=1
            fi
          done <<'LIST'
              ops/delete-stale-branches
          LIST
          exit $failed
