name: Delete stale branches (one-off)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: DELETE 76"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "DELETE 76"

      - name: Delete listed branches
        run: |
          set -uo pipefail
          failed=0
          while read -r b; do
            case "$b" in
              ""|develop|master|main) echo "skip $b"; continue ;;
            esac
            if git push origin --delete "$b"; then
              echo "deleted $b"
            else
              echo "FAILED $b"; failed=1
            fi
          done <<'LIST'
              agent-shell-starter
              alice-platform-contract
              background-task-worker
              chore/asvs-l2-baseline
              chore/claude-task-executor
              chore/mypy-strict-clean
              chore/naming-conventions
              chore/reliability-rules
              chore/wcag-ratchet
              ci
              ci-temp
              cloudru-check
              cloudru-docs-mirror
              codex/broadcast-chat-working-copy
              codex/integration-current-scope
              copilot/fix-repair-master-after-squash-merges
              copilot/sledit-za-otzyvami
              copilot/task-293531601-1368709887-97723683-36c4-477e-819c-e20b61cb9ffd
              copilot/task-293531601-1368709887-c51500e7-0f0f-4c3d-858a-a17c1eb8d089
              docs-500-async-concurrency-contract
              docs/google-drive-public-links-audit-20261011
