# Trusted render-only automation. Active after workflow reaches default branch.
# Never checks out or executes code from the PR being rendered.
name: 3D previews in PR comments

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - printing3d/models/**
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Existing same-repo PR to render"
        required: true
        type: number
      refresh:
        description: "Re-render even if the PR head has not changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: read

# All previews share one image branch; serial writes avoid ref races.
concurrency:
  group: alice-3d-preview-publisher
  cancel-in-progress: false

jobs:
  render:
    name: Render real mesh geometry into one PR comment
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout trusted default branch, never PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install pinned image dependency
        run: python -m pip install --disable-pip-version-check --no-input --no-deps Pillow==12.3.0
      - name: Run fail-closed preview contract tests
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest==9.1.1
          python -m pytest -q -p no:cacheprovider scripts/tests/test_render_3d_preview.py
      - name: Commit images in dedicated preview branch and upsert PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          FORCE_REFRESH: ${{ inputs.refresh || 'false' }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number" >&2
            exit 2
          fi
          args=(--repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER")
          if [ "$FORCE_REFRESH" = "true" ]; then
            args+=(--refresh)
          fi
          python -m scripts.publish_3d_previews "${args[@]}"
