# Trusted scheduled publisher. Never checks out code from open PR branches.
# Unprivileged PR tests run separately under "3D render contract".
name: 3D previews in PR comments

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Existing same-repo PR to render"
        required: true
        type: number
      refresh:
        description: "Re-render even if PR head has not changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: alice-3d-preview-publisher
  cancel-in-progress: false

jobs:
  render:
    name: Render bounded real mesh geometry to one PR comment
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install pinned preview dependencies
        run: python -m pip install --disable-pip-version-check --no-input Pillow==12.3.0 pytest==9.1.1
      - name: Verify trusted publisher and preview regression suite
        run: python -m pytest -q -p no:cacheprovider scripts/validation/render_preview_contract.py
      - name: Commit image-only objects and upsert GitHub bot comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || '' }}
          FORCE_REFRESH: ${{ inputs.refresh || 'false' }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          if [ -n "$PR_NUMBER" ]; then
            if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Invalid PR number" >&2
              exit 2
            fi
            args+=(--pr "$PR_NUMBER")
            if [ "$FORCE_REFRESH" = "true" ]; then
              args+=(--refresh)
            fi
          else
            args+=(--scan-open)
          fi
          python -m scripts.publish_3d_previews "${args[@]}"
