# Trusted publisher. Runs only after the separate read-only PR contract workflow succeeds.
# Never checks out or executes code from the untrusted PR or its artifacts.
name: 3D previews in PR comments

on:
  workflow_run:
    workflows:
      - 3D render contract
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Existing same-repo PR to render"
        required: true
        type: number
      refresh:
        description: "Re-render even if the PR head has not changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: read

# Serialize all preview ref updates: no force push or lost-race duplicate.
concurrency:
  group: alice-3d-preview-publisher
  cancel-in-progress: false

jobs:
  render:
    name: Commit PNGs from trusted code after unprivileged PR gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.pull_requests[0].number != null
      )
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout trusted default branch (no PR checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install pinned rendering and contract dependencies
        run: python -m pip install --disable-pip-version-check --no-input Pillow==12.3.0 pytest==9.1.1
      - name: Recheck trusted preview and publisher contracts
        run: python -m pytest -q -p no:cacheprovider scripts/tests/test_render_3d_preview.py
      - name: Commit image-only objects and update one GitHub Actions bot comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          FORCE_REFRESH: ${{ inputs.refresh || 'false' }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number" >&2
            exit 2
          fi
          args=(--repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER")
          if [ -n "$EXPECTED_HEAD_SHA" ]; then
            args+=(--expected-head "$EXPECTED_HEAD_SHA")
          fi
          if [ "$FORCE_REFRESH" = "true" ]; then
            args+=(--refresh)
          fi
          python -m scripts.publish_3d_previews "${args[@]}"
