name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Application tests
    runs-on: ubuntu-latest
    env:
      YANDEX_API_KEY: ci-test-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: |
          started=$SECONDS
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          echo "- Application dependency install: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Check source formatting
        run: bash scripts/format.sh check
      - name: Validate preview deployment script
        run: |
          bash -n deploy/preview/server.sh
          bash -n deploy/production/server.sh
          bash tests/test_dozzle_preview.sh
      - name: Compile tracked Python sources
        run: git ls-files '*.py' -z | xargs -0 -r python -m py_compile
      - name: Validate frontend JavaScript policy
        run: python tests/validate_frontend_modules.py
      - name: Validate runtime Python policy
        run: python tests/validate_runtime_modules.py
      - name: Run runtime dispatcher regression tests
        run: pytest -q tests/test_runtime_policy.py tests/test_runtime_dispatcher.py
      - name: Run frontend JavaScript regression tests with coverage
        run: |
          rm -rf coverage-js
          mkdir -p coverage-js
          NODE_V8_COVERAGE=coverage-js node tests/test_file_manager.js
          NODE_V8_COVERAGE=coverage-js node tests/test_dozzle_header.js
          NODE_V8_COVERAGE=coverage-js node tests/test_frontend_boot.js
          NODE_V8_COVERAGE=coverage-js node tests/test_project_tree.js
          NODE_V8_COVERAGE=coverage-js node tests/test_header_dom.js
          NODE_V8_COVERAGE=coverage-js node tests/test_frontend_smoke.js
          NODE_V8_COVERAGE=coverage-js node tests/test_browser_self_test_runner.js
          node tests/test_frontend_runtime_safety.js
          pytest -q tests/test_frontend_policy.py
          pytest -q tests/test_unified_buttons_contract.py
          pytest -q tests/test_real_ui_contract.py
          pytest -q tests/test_frontend_module_code.py
          node tests/test_system_status.js
          node tests/test_ui_action_contract.js
          node tests/test_real_header_actions.js
          node tests/test_model_catalog_diagnostics.js
          node tests/test_settings_ui_security.js
          node tests/test_ui_modal_contract.js
          node tests/test_voice_recording.js
          test -n "$(find coverage-js -type f -name '*.json' -print -quit)"
      - name: Report frontend coverage
        run: python tests/report_frontend_coverage.py coverage-js frontend-coverage.json
      - name: Save frontend test log
        if: always()
        run: |
          : > frontend-test.log
          for test in tests/test_file_manager.js tests/test_dozzle_header.js tests/test_frontend_boot.js tests/test_project_tree.js tests/test_header_dom.js tests/test_frontend_smoke.js tests/test_browser_self_test_runner.js; do
            node "$test" >> frontend-test.log 2>&1 || true
          done
      - name: Start Flask for live resource validation
        env:
          HOST: 127.0.0.1
          PORT: 5678
          FLASK_DEBUG: "0"
          ALICE_DB_PATH: alice_pro_ci_live.db
        run: |
          python app.py > flask-live.log 2>&1 &
          echo $! > flask-live.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5678/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5678/ >/dev/null
      - name: Run live Flask resource contract tests
        env:
          ALICE_LIVE_BASE_URL: http://127.0.0.1:5678
        run: pytest -q tests/test_live_flask_resources.py
      - name: Stop Flask live validation server
        if: always()
        run: |
          if [ -f flask-live.pid ]; then kill "$(cat flask-live.pid)" || true; fi
          if [ -f flask-live.log ]; then tail -n 200 flask-live.log; fi

      - name: Run Python application tests with coverage
        run: pytest --cov=. --cov-config=.coveragerc --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json -q
      - name: Generate validation report
        if: always()
        run: |
          python tests/generate_ci_validation_report.py | tee ci-validation-report.md
          cat ci-validation-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.run_number }}
          path: |
            coverage.xml
            coverage.json
            coverage-js/
            frontend-coverage.json
            ci-validation-report.md
            flask-live.log
          if-no-files-found: warn
      - name: Enforce coverage quality gates
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # 69.96% is the measured production-only baseline after test/support
          # files were removed from coverage accounting. Keep that baseline from
          # regressing, while requiring 100% coverage for changed Python lines.
          coverage report --fail-under=69.96

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            DIFF_BASE="origin/$GITHUB_BASE_REF"
          else
            DIFF_BASE="$EVENT_BEFORE"
            if [ -z "$DIFF_BASE" ] || [ "$DIFF_BASE" = "0000000000000000000000000000000000000000" ]; then
              DIFF_BASE="HEAD^"
            fi
          fi

          git rev-parse --verify "$DIFF_BASE^{commit}"
          diff-cover coverage.xml --compare-branch="$DIFF_BASE" --fail-under=100


  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    env:
      ALICE_DATABASE_URL: postgresql://alice:ci-postgres-password@localhost:5432/alice_pro_test
      ALICE_PYTEST_POSTGRES_RESET: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alice_pro_test
          POSTGRES_USER: alice
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U alice -d alice_pro_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-postgres.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          started=$SECONDS
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-postgres.txt
          pip install -r requirements-dev.txt
          echo "- PostgreSQL dependency install: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run full application suite on PostgreSQL
        run: pytest -q
      - name: Verify backup and restore of the application schema
        # Client tools come from the server image so their version matches PostgreSQL 17.
        env:
          PG_DUMP: docker run --rm --network host -v /tmp/alice-backup:/tmp/alice-backup postgres:17-alpine pg_dump
          PG_RESTORE: docker run --rm --network host -v /tmp/alice-backup:/tmp/alice-backup postgres:17-alpine pg_restore
          PSQL: docker run --rm -i --network host postgres:17-alpine psql
        run: |
          mkdir -p /tmp/alice-backup
          chmod 777 /tmp/alice-backup
          $PSQL "$ALICE_DATABASE_URL" -v ON_ERROR_STOP=1 -q \
            -c "CREATE TABLE backup_check (id int); INSERT INTO backup_check VALUES (1), (2)"
          scripts/pg_backup.sh backup /tmp/alice-backup/alice.dump
          # Writes after the dump must not fail verification of the dump.
          $PSQL "$ALICE_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO backup_check VALUES (3)"
          scripts/pg_backup.sh verify /tmp/alice-backup/alice.dump

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    env:
      ALICE_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/android/app/debug-signing.keystore
      ALICE_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
      ALICE_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
      ALICE_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Stage Python runtime
        working-directory: android
        run: python scripts/stage_python.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Materialize stable debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$ALICE_DEBUG_KEYSTORE_PATH"
            chmod 600 "$ALICE_DEBUG_KEYSTORE_PATH"
            test -s "$ALICE_DEBUG_KEYSTORE_PATH"
            keytool -list \
              -keystore "$ALICE_DEBUG_KEYSTORE_PATH" \
              -storepass "$ALICE_DEBUG_STORE_PASSWORD" \
              -alias "$ALICE_DEBUG_KEY_ALIAS" >/dev/null
            echo "Using repository-managed stable debug signing key."
          else
            echo "Stable debug signing secrets are not configured; using the ephemeral Gradle debug key."
          fi
      - name: Run Android unit tests and build debug APK
        working-directory: android
        run: |
          started=$SECONDS
          gradle --no-daemon -PaliceBuildNumber=${{ github.run_number }} -PaliceCommitHash=${{ github.sha }} :app:testDebugUnitTest :app:assembleDebug
          echo "- Android test/build: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify debug APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: alice-pro-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
