name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan repository for secrets
        uses: docker://zricethezav/gitleaks:v8.24.3
        with:
          args: detect --no-git --redact --source=.

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      # Tests instantiate the API client but must never receive a real credential.
      YANDEX_API_KEY: ci-test-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        run: pytest -q
