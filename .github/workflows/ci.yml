name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Platform changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.classify.outputs.web }}
      backend: ${{ steps.classify.outputs.backend }}
      android: ${{ steps.classify.outputs.android }}
      infra: ${{ steps.classify.outputs.infra }}
      database: ${{ steps.classify.outputs.database }}
      mcp: ${{ steps.classify.outputs.mcp }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify changed platforms
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            python scripts/ci_platform_changes.py --all > /tmp/platforms.json
          else
            git fetch --no-tags --depth=1 origin "$base"
            git diff --no-renames --name-only -z "$base" "$GITHUB_SHA" | python scripts/ci_platform_changes.py --null > /tmp/platforms.json
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("/tmp/platforms.json"))
          for key, value in data.items():
              print(f"{key}={str(value).lower()}")
          PY

  code-rules:
    name: Code rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned tooling
        run: pip install -r requirements-dev.txt
      - name: Alice Input 2-second fault-emulation gate
        run: timeout --signal=TERM --kill-after=1s 2s python3 tests/alice_input_security/fast_gate.py
      - name: Check naming, layout and reliability rules
        run: bash scripts/check_code_rules.sh

  backend:
    name: Application tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      YANDEX_API_KEY: ci-test-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: |
          started=$SECONDS
          pip install -r requirements.txt -r requirements-dev.txt
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          echo "- Application dependency install: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate hot-file modularity report
        run: |
          python scripts/hot_file_metrics.py \
            --commits 200 \
            --top 20 \
            --json-out hot-file-metrics.json \
            --markdown-out hot-file-metrics.md
          cat hot-file-metrics.md
          cat hot-file-metrics.md >> "$GITHUB_STEP_SUMMARY"
      - name: Validate preview deployment script
        run: |
          bash -n deploy/preview/server.sh
          bash -n deploy/production/server.sh
          bash tests/test_dozzle_preview.sh
      - name: Compile tracked Python sources
        run: git ls-files '*.py' -z | xargs -0 -r python -m py_compile
      - name: Validate Keel Platform config
        run: python -m keel validate
      - name: Validate frontend JavaScript policy
        run: python tests/validate_frontend_modules.py
      - name: Validate runtime Python policy
        run: python tests/validate_runtime_modules.py
      - name: Validate agent skills
        run: python tests/validate_skills.py
      - name: Run frontend JavaScript regression tests with coverage
        run: |
          set -euo pipefail
          rm -rf coverage-js
          mkdir -p coverage-js
          : > frontend-test.log

          run_node() {
            local test_file="$1"
            shift
            "$@" node "$test_file" 2>&1 | tee -a frontend-test.log
          }

          run_node tests/test_file_manager.js env NODE_V8_COVERAGE=coverage-js
          run_node tests/test_dozzle_header.js env NODE_V8_COVERAGE=coverage-js
          run_node tests/test_frontend_boot.js env NODE_V8_COVERAGE=coverage-js
          run_node tests/test_project_tree.js env NODE_V8_COVERAGE=coverage-js
          run_node tests/test_header_dom.js env NODE_V8_COVERAGE=coverage-js
          run_node tests/test_frontend_smoke.js env NODE_V8_COVERAGE=coverage-js
          run_node tests/test_browser_self_test_runner.js env NODE_V8_COVERAGE=coverage-js
          run_node tests/test_frontend_runtime_safety.js env
          run_node tests/test_system_status.js env
          run_node tests/test_ui_action_contract.js env
          run_node tests/test_real_header_actions.js env
          run_node tests/test_trace_summary.js env NODE_V8_COVERAGE=coverage-js
          run_node tests/test_execution_surface.js env NODE_V8_COVERAGE=coverage-js
          run_node tests/test_model_catalog_diagnostics.js env
          run_node tests/test_settings_ui_security.js env
          run_node tests/test_ui_modal_contract.js env
          run_node tests/test_voice_recording.js env
          run_node tests/test_chat_history_roles.js env NODE_V8_COVERAGE=coverage-js
          run_node tests/test_browser_emulator.js env NODE_V8_COVERAGE=coverage-js

          test -n "$(find coverage-js -type f -name '*.json' -print -quit)"
      - name: Report frontend coverage
        run: python tests/report_frontend_coverage.py coverage-js frontend-coverage.json
      - name: Start Flask for live resource validation
        env:
          HOST: 127.0.0.1
          PORT: 5678
          FLASK_DEBUG: "0"
          ALICE_MEMORY_PATH: alice_ci_live.memory
        run: |
          python app.py > flask-live.log 2>&1 &
          echo $! > flask-live.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5678/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5678/ >/dev/null
      - name: Run live Flask resource contract tests
        env:
          ALICE_LIVE_BASE_URL: http://127.0.0.1:5678
        run: pytest -q tests/test_live_flask_resources.py
      - name: Stop Flask live validation server
        if: always()
        run: |
          if [ -f flask-live.pid ]; then kill "$(cat flask-live.pid)" || true; fi
          if [ -f flask-live.log ]; then tail -n 200 flask-live.log; fi

      - name: Build and check C17 fallback control server
        run: bash scripts/build_c17_server.sh --check
      - name: Run Python application tests with coverage
        run: |
          started=$SECONDS
          pytest -n auto --dist=loadfile --durations=30 --cov=. --cov-config=.coveragerc --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json -q
          echo "- Parallel Python application tests: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate validation report
        if: always()
        run: |
          python tests/generate_ci_validation_report.py | tee ci-validation-report.md
          cat ci-validation-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_number }}
          path: |
            coverage.xml
            coverage.json
            coverage-js/
            frontend-coverage.json
            frontend-test.log
            ci-validation-report.md
            hot-file-metrics.json
            hot-file-metrics.md
            flask-live.log
          if-no-files-found: warn
      - name: Enforce coverage quality gates
        run: |
          # 69.96% is the measured production-only baseline after test/support
          # files were removed from coverage accounting. Keep that baseline from
          # regressing.
          coverage report --fail-under=69.96


  infra:
    name: Infrastructure tests
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.22.2"
      - name: Install infrastructure test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run infrastructure regression tests with coverage
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t suites < <(printf '%s\n' tests/test_cloudru*.py tests/test_ci_*.py tests/test_platform*.py tests/test_*deploy*.py tests/test_rdc*.py | sort -u)
          test "${#suites[@]}" -gt 0
          python -m pytest -q "${suites[@]}" --cov=. --cov-config=.coveragerc --cov-branch --cov-report=xml:infra-coverage.xml
  mcp:
    name: MCP worker tests
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: |
            deploy/chrome-worker/package-lock.json
            deploy/remote-desktop-commander/package-lock.json
      - name: Playwright MCP integration tests
        env:
          CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
          BROWSER_OAUTH_MCP_TEST: "1"
        run: |
          npm ci --prefix deploy/chrome-worker
          npm test --prefix deploy/chrome-worker
          npm run test:browser --prefix deploy/chrome-worker
      - name: Identity provider tests
        run: npm test --prefix deploy/oauth-idp
      - name: Logos Dev OAuth and handoff regression tests
        run: |
          npm ci --prefix deploy/remote-desktop-commander --omit=dev --ignore-scripts --no-audit --no-fund
          node --test deploy/remote-desktop-commander/oauth.test.mjs deploy/remote-desktop-commander/credential-handoff.test.mjs

  required:
    name: CI required
    if: always()
    needs: [changes, code-rules, backend, infra, mcp]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify every selected platform actually passed
        env:
          CI_PLATFORM_PLAN: ${{ toJSON(needs.changes.outputs) }}
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci_platform_changes.py --verify
