name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Application tests
    runs-on: ubuntu-latest
    env:
      YANDEX_API_KEY: ci-test-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff
      - name: Check source formatting
        run: bash scripts/format.sh check
      - name: Validate preview deployment script
        run: |
          bash -n deploy/preview/server.sh
          bash -n deploy/production/server.sh
          bash tests/test_dozzle_preview.sh
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate frontend JavaScript policy
        run: python tests/validate_frontend_modules.py
      - name: Run frontend JavaScript regression tests with coverage
        run: |
          rm -rf coverage-js
          mkdir -p coverage-js
          NODE_V8_COVERAGE=coverage-js node tests/test_file_manager.js
          NODE_V8_COVERAGE=coverage-js node tests/test_dozzle_header.js
          NODE_V8_COVERAGE=coverage-js node tests/test_frontend_boot.js
          NODE_V8_COVERAGE=coverage-js node tests/test_project_tree.js
          NODE_V8_COVERAGE=coverage-js node tests/test_header_dom.js
          NODE_V8_COVERAGE=coverage-js node tests/test_frontend_smoke.js
          node tests/test_frontend_runtime_safety.js
          pytest -q tests/test_frontend_policy.py
          pytest -q tests/test_unified_buttons_contract.py
          pytest -q tests/test_real_ui_contract.py
          pytest -q tests/test_frontend_module_code.py
          node tests/test_system_status.js
          node tests/test_ui_action_contract.js
          node tests/test_real_header_actions.js
          node tests/test_ui_modal_contract.js
          test -n "$(find coverage-js -type f -name '*.json' -print -quit)"
      - name: Save frontend test log
        if: always()
        run: |
          : > frontend-test.log
          for test in tests/test_file_manager.js tests/test_dozzle_header.js tests/test_frontend_boot.js tests/test_project_tree.js tests/test_header_dom.js tests/test_frontend_smoke.js; do
            node "$test" >> frontend-test.log 2>&1 || true
          done
      - name: Start Flask for live resource validation
        env:
          HOST: 127.0.0.1
          PORT: 5678
          FLASK_DEBUG: "0"
          ALICE_DB_PATH: alice_pro_ci_live.db
        run: |
          python app.py > flask-live.log 2>&1 &
          echo $! > flask-live.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5678/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5678/ >/dev/null
      - name: Run live Flask resource contract tests
        env:
          ALICE_LIVE_BASE_URL: http://127.0.0.1:5678
        run: pytest -q tests/test_live_flask_resources.py
      - name: Stop Flask live validation server
        if: always()
        run: |
          if [ -f flask-live.pid ]; then kill "$(cat flask-live.pid)" || true; fi
          if [ -f flask-live.log ]; then tail -n 200 flask-live.log; fi

      - name: Run Python application tests with coverage
        run: pytest --cov=. --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json -q
      - name: Generate validation report
        if: always()
        run: |
          python tests/generate_ci_validation_report.py | tee ci-validation-report.md
          cat ci-validation-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_number }}
          path: |
            coverage.xml
            coverage.json
            coverage-js/
            ci-validation-report.md
            flask-live.log
          if-no-files-found: warn
      - name: Enforce 100% coverage quality gate
        run: coverage report --fail-under=100


  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    env:
      ALICE_DATABASE_URL: postgresql://alice:ci-postgres-password@localhost:5432/alice_pro
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alice_pro
          POSTGRES_USER: alice
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U alice -d alice_pro"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-postgres.txt
          pip install pytest
      - name: Run PostgreSQL integration tests
        run: pytest -q tests/test_postgres_integration.py

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    env:
      ALICE_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/android/app/debug-signing.keystore
      ALICE_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
      ALICE_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
      ALICE_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Stage Python runtime
        working-directory: android
        run: python scripts/stage_python.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Materialize stable debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$ALICE_DEBUG_KEYSTORE_PATH"
            chmod 600 "$ALICE_DEBUG_KEYSTORE_PATH"
            test -s "$ALICE_DEBUG_KEYSTORE_PATH"
            keytool -list \
              -keystore "$ALICE_DEBUG_KEYSTORE_PATH" \
              -storepass "$ALICE_DEBUG_STORE_PASSWORD" \
              -alias "$ALICE_DEBUG_KEY_ALIAS" >/dev/null
            echo "Using repository-managed stable debug signing key."
          else
            echo "Stable debug signing secrets are not configured; using the ephemeral Gradle debug key."
          fi
      - name: Run Android unit tests and build debug APK
        working-directory: android
        run: gradle --no-daemon -PaliceBuildNumber=${{ github.run_number }} -PaliceCommitHash=${{ github.sha }} :app:testDebugUnitTest :app:assembleDebug
      - name: Verify debug APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: alice-pro-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
