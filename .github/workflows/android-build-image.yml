name: Android build image

on:
  pull_request:
    paths:
      - "android/docker/**"
      - "android/runtime/**"
      - "android/direct/**"
      - "android/scripts/build_direct.sh"
      - "android/scripts/test_direct.sh"
      - "scripts/fetch_chaquopy_runtime.py"
      - ".github/workflows/android-build-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Android build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Checkout
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image with pinned, verified inputs
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: docker build --tag alice-android-build:ci android/docker
      - name: Build the direct APK inside the image
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          set -euo pipefail
          started=$SECONDS
          docker run --rm \
            -e ALICE_BUILD_NUMBER="${{ github.run_number }}" \
            -e ALICE_VERSION_NAME="0.2.0-direct-${{ github.sha }}" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alice-android-build:ci \
            bash android/scripts/build_direct.sh
          echo "- Android build image: direct APK build $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
          test -s android/build/direct/alice-pro-direct.apk
          sha256sum android/build/direct/alice-pro-direct.apk
      - name: Upload direct debug APK
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alice-pro-direct-debug-apk-${{ github.run_number }}
          path: android/build/direct/alice-pro-direct.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
