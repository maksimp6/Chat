name: Redmi 9 application server

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      action:
        description: Operation on the existing Redmi 9 runner
        required: true
        default: deploy
        type: choice
        options: [deploy, screenshots, tools_self_check, verify_screenshots, rootagent_native_check, art_generate]

permissions: {}

concurrency:
  group: redmi9-app-server
  cancel-in-progress: false

jobs:
  server:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: redmi9
    timeout-minutes: 10
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 10
        env:
          LOGOS_REQUIRE_WIFI: "1"
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          # Each job has its own UUID workspace. Remove disposable captures
          # across the runner work root before downloads or mkdtemp need space.
          cleanup_root="$HOME/github-python-runner/work"
          test "$(dirname "$GITHUB_WORKSPACE")" = "$cleanup_root"
          test ! -L "$HOME/github-python-runner"
          test ! -L "$cleanup_root"
          df -k "$cleanup_root"
          find "$cleanup_root" -mindepth 2 -maxdepth 2 -type d \( -name '.logos-screenshots-*' -o -name '.logos-screenshot-verification-*' -o -name '.logos-tools-check-*' -o -name '.logos-tools-tests-*' -o -name '.logos-candidate-tools-*' \) -print0 | while IFS= read -r -d '' leftover; do
            # Root capture children may leave root-owned files; retry as root, never fail the job on stale garbage.
            rm -rf -- "$leftover" 2>/dev/null || timeout 30 su -c "rm -rf -- '$leftover'" || echo "::warning::could not remove $leftover"
          done
          df -k "$cleanup_root"
          for file in scripts/redmi_app_server.sh scripts/redmi_app_launcher.py scripts/redmi_wifi_probe.py scripts/redmi_remove_autoupdate.py .github/workflows/redmi9-app-server.yml; do
            mkdir -p "$(dirname "$file")"
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/$file" -o "$file"
          done
          # The runner is the only updater. Retire the former independent loop
          # after its in-flight controller finishes, preserving its evidence.
          python scripts/redmi_remove_autoupdate.py
          # The phone runs out of space when old deploy backups and screenshot folders pile up.
          # The concurrency group runs one workflow at a time, so no capture is active during this step.
          # Keep only the newest backup of the app memory, and only when that backup is non-empty.
          backups=/data/data/com.termux/files/home/logos-local-state/deploy-backups
          if [ -d "$backups" ]; then
            newest=$(ls -1t "$backups"/*.memory 2>/dev/null | head -n 1 || true)
            if [ -n "$newest" ] && [ -s "$newest" ]; then
              ls -1t "$backups"/*.memory 2>/dev/null | tail -n +2 | xargs -r rm -f
            fi
          fi
          bash scripts/redmi_app_server.sh deploy

  screenshots:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master' && inputs.action == 'screenshots'
    runs-on: redmi9
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          # Each job has its own UUID workspace. Remove disposable captures
          # across the runner work root before downloads or mkdtemp need space.
          cleanup_root="$HOME/github-python-runner/work"
          test "$(dirname "$GITHUB_WORKSPACE")" = "$cleanup_root"
          test ! -L "$HOME/github-python-runner"
          test ! -L "$cleanup_root"
          df -k "$cleanup_root"
          find "$cleanup_root" -mindepth 2 -maxdepth 2 -type d \( -name '.logos-screenshots-*' -o -name '.logos-screenshot-verification-*' -o -name '.logos-tools-check-*' -o -name '.logos-tools-tests-*' -o -name '.logos-candidate-tools-*' \) -print0 | while IFS= read -r -d '' leftover; do
            # Root capture children may leave root-owned files; retry as root, never fail the job on stale garbage.
            rm -rf -- "$leftover" 2>/dev/null || timeout 30 su -c "rm -rf -- '$leftover'" || echo "::warning::could not remove $leftover"
          done
          df -k "$cleanup_root"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/redmi_media_ram.sh" -o "$GITHUB_WORKSPACE/redmi_media_ram.sh"
          # Media goes only to a fixed-size RAM disk: never to flash, wiped on exit.
          media_ram=$(bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" mount)
          trap 'cd "$GITHUB_WORKSPACE"; bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" umount' EXIT
          capture_job_temp=$(mktemp -d "$media_ram/screenshots.XXXXXX")
          export RUNNER_TEMP="$capture_job_temp"
          export TMPDIR="$capture_job_temp"
          scripts_dir=$(mktemp -d "$RUNNER_TEMP/logos-screenshot-scripts.XXXXXX")
          for script in redmi_screenshot_capture.py publish_redmi_screenshots.py; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/$script" -o "$scripts_dir/$script"
          done
          capture_dir="$RUNNER_TEMP/logos-screenshots-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python "$scripts_dir/redmi_screenshot_capture.py" "$capture_dir"
          python "$scripts_dir/publish_redmi_screenshots.py" "$capture_dir"
          python - "$capture_dir/manifest.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          scenario = manifest.get("creation_scenario", {})
          matrix = manifest.get("matrix_scenario", {})
          artifacts = {entry.get("path") for entry in manifest.get("artifacts", [])}
          required_artifacts = {"15-conversation-create.mp4", "events.json"}
          # STALE_RUNTIME keeps the verdicts valid for the installed app; it only says they do not prove this commit.
          print(json.dumps({"deployment_acceptance": manifest.get("deployment_acceptance"),
                            "creation_scenario": scenario.get("verdict", "NOT_RUN"),
                            "failures": scenario.get("failures", []),
                            "matrix_scenario": matrix.get("verdict", "NOT_RUN"),
                            "matrix_failures": matrix.get("failures", []),
                            "video_and_events_present": required_artifacts <= artifacts}))
          if (scenario.get("verdict") != "PASS" or scenario.get("failures") != []
                  or matrix.get("verdict") != "PASS" or matrix.get("failures") != []
                  or not required_artifacts <= artifacts):
              raise SystemExit("Application UI checks failed; evidence was published first")
          PY

  tools_self_check:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master' && inputs.action == 'tools_self_check'
    runs-on: redmi9
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOGOS_TOOLS_SELF_CHECK: "1"
          CI: "true"
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          # Each job has its own UUID workspace. Remove disposable captures
          # across the runner work root before downloads or mkdtemp need space.
          cleanup_root="$HOME/github-python-runner/work"
          test "$(dirname "$GITHUB_WORKSPACE")" = "$cleanup_root"
          test ! -L "$HOME/github-python-runner"
          test ! -L "$cleanup_root"
          df -k "$cleanup_root"
          find "$cleanup_root" -mindepth 2 -maxdepth 2 -type d \( -name '.logos-screenshots-*' -o -name '.logos-screenshot-verification-*' -o -name '.logos-tools-check-*' -o -name '.logos-tools-tests-*' -o -name '.logos-candidate-tools-*' \) -print0 | while IFS= read -r -d '' leftover; do
            # Root capture children may leave root-owned files; retry as root, never fail the job on stale garbage.
            rm -rf -- "$leftover" 2>/dev/null || timeout 30 su -c "rm -rf -- '$leftover'" || echo "::warning::could not remove $leftover"
          done
          df -k "$cleanup_root"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/redmi_media_ram.sh" -o "$GITHUB_WORKSPACE/redmi_media_ram.sh"
          # Media goes only to a fixed-size RAM disk: never to flash, wiped on exit.
          media_ram=$(bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" mount)
          trap 'cd "$GITHUB_WORKSPACE"; bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" umount' EXIT
          check_temp=$(mktemp -d "$media_ram/tools-check.XXXXXX")
          export RUNNER_TEMP="$check_temp"
          export TMPDIR="$check_temp"
          mkdir -m 700 "$check_temp/scripts"
          for file in scripts/redmi_screenshot_capture.py scripts/publish_redmi_screenshots.py scripts/logos_tools_self_check.py; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/$file" -o "$check_temp/$file"
          done
          cd "$check_temp"
          capture_dir="$check_temp/logos-screenshots-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/redmi_screenshot_capture.py "$capture_dir"
          python scripts/publish_redmi_screenshots.py "$capture_dir"
          python - "$capture_dir/manifest.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          scenario = manifest.get("creation_scenario", {})
          check = scenario.get("checkpoints", {}).get("tools_self_check", {})
          print(json.dumps({"deployment_acceptance": manifest.get("deployment_acceptance"), "tools_self_check": check,
                            "scenario_failures": scenario.get("failures", [])}, ensure_ascii=False))
          if check.get("status") != "PASS" or scenario.get("verdict") != "PASS":
              raise SystemExit("Tools or parameter availability not fully proven; evidence published first")
          PY

  verify_screenshots:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master' && inputs.action == 'verify_screenshots'
    runs-on: redmi9
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          # Each job has its own UUID workspace. Remove disposable captures
          # across the runner work root before downloads or mkdtemp need space.
          cleanup_root="$HOME/github-python-runner/work"
          test "$(dirname "$GITHUB_WORKSPACE")" = "$cleanup_root"
          test ! -L "$HOME/github-python-runner"
          test ! -L "$cleanup_root"
          df -k "$cleanup_root"
          find "$cleanup_root" -mindepth 2 -maxdepth 2 -type d \( -name '.logos-screenshots-*' -o -name '.logos-screenshot-verification-*' -o -name '.logos-tools-check-*' -o -name '.logos-tools-tests-*' -o -name '.logos-candidate-tools-*' \) -print0 | while IFS= read -r -d '' leftover; do
            # Root capture children may leave root-owned files; retry as root, never fail the job on stale garbage.
            rm -rf -- "$leftover" 2>/dev/null || timeout 30 su -c "rm -rf -- '$leftover'" || echo "::warning::could not remove $leftover"
          done
          df -k "$cleanup_root"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/redmi_media_ram.sh" -o "$GITHUB_WORKSPACE/redmi_media_ram.sh"
          # Media goes only to a fixed-size RAM disk: never to flash, wiped on exit.
          media_ram=$(bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" mount)
          trap 'cd "$GITHUB_WORKSPACE"; bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" umount' EXIT
          verification_job_temp=$(mktemp -d "$media_ram/verification.XXXXXX")
          export RUNNER_TEMP="$verification_job_temp"
          export TMPDIR="$verification_job_temp"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/publish_redmi_screenshots.py" -o "$verification_job_temp/publish_redmi_screenshots.py"
          python "$verification_job_temp/publish_redmi_screenshots.py" --verify-latest

  rootagent_native_check:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rootagent_native_check'
    runs-on: redmi9
    timeout-minutes: 8
    steps:
      - name: Native RootAgent controls and real input
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          # Each job has its own UUID workspace. Remove disposable captures
          # across the runner work root before downloads or mkdtemp need space.
          cleanup_root="$HOME/github-python-runner/work"
          test "$(dirname "$GITHUB_WORKSPACE")" = "$cleanup_root"
          test ! -L "$HOME/github-python-runner"
          test ! -L "$cleanup_root"
          df -k "$cleanup_root"
          find "$cleanup_root" -mindepth 2 -maxdepth 2 -type d \( -name '.logos-screenshots-*' -o -name '.logos-screenshot-verification-*' -o -name '.logos-tools-check-*' -o -name '.logos-tools-tests-*' -o -name '.logos-candidate-tools-*' \) -print0 | while IFS= read -r -d '' leftover; do
            # Root capture children may leave root-owned files; retry as root, never fail the job on stale garbage.
            rm -rf -- "$leftover" 2>/dev/null || timeout 30 su -c "rm -rf -- '$leftover'" || echo "::warning::could not remove $leftover"
          done
          df -k "$cleanup_root"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/redmi_media_ram.sh" -o "$GITHUB_WORKSPACE/redmi_media_ram.sh"
          # Media goes only to a fixed-size RAM disk: never to flash, wiped on exit.
          media_ram=$(bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" mount)
          trap 'cd "$GITHUB_WORKSPACE"; bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" umount' EXIT
          native_job_temp=$(mktemp -d "$media_ram/rootagent.XXXXXX")
          export RUNNER_TEMP="$native_job_temp"
          export TMPDIR="$native_job_temp"
          mkdir -m 700 "$RUNNER_TEMP/scripts" "$RUNNER_TEMP/evidence"
          for file in scripts/redmi_root_agent.py scripts/redmi_root_agent_e2e.py; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/$file" -o "$RUNNER_TEMP/$file"
          done
          cd "$RUNNER_TEMP"
          python scripts/redmi_root_agent_e2e.py --helper scripts/redmi_root_agent.py --output "$RUNNER_TEMP/evidence"

  art_generate:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'art_generate'
    runs-on: redmi9
    timeout-minutes: 1
    steps:
      - name: Start one picture, or poll one operation, through the Redmi 9 app
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          # Each job has its own UUID workspace. Remove disposable captures
          # across the runner work root before downloads or mkdtemp need space.
          cleanup_root="$HOME/github-python-runner/work"
          test "$(dirname "$GITHUB_WORKSPACE")" = "$cleanup_root"
          test ! -L "$HOME/github-python-runner"
          test ! -L "$cleanup_root"
          df -k "$cleanup_root"
          find "$cleanup_root" -mindepth 2 -maxdepth 2 -type d \( -name '.logos-screenshots-*' -o -name '.logos-screenshot-verification-*' -o -name '.logos-tools-check-*' -o -name '.logos-tools-tests-*' -o -name '.logos-candidate-tools-*' \) -print0 | while IFS= read -r -d '' leftover; do
            # Root capture children may leave root-owned files; retry as root, never fail the job on stale garbage.
            rm -rf -- "$leftover" 2>/dev/null || timeout 30 su -c "rm -rf -- '$leftover'" || echo "::warning::could not remove $leftover"
          done
          df -k "$cleanup_root"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/redmi_media_ram.sh" -o "$GITHUB_WORKSPACE/redmi_media_ram.sh"
          # Media goes only to a fixed-size RAM disk: never to flash, wiped on exit.
          media_ram=$(bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" mount)
          trap 'cd "$GITHUB_WORKSPACE"; bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" umount' EXIT
          export MEDIA_DIR="$media_ram"
          # Only the small pending/report state stays on flash; the picture itself stays in RAM.
          export OUT_DIR="$HOME/logos-art-real"
          mkdir -p "$OUT_DIR"
          rm -f "$OUT_DIR"/art.jpg "$OUT_DIR"/art.png
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8080"
          OUT = os.environ["OUT_DIR"]
          MODEL = "alice-ai-art"
          PROMPT = "красный круг на белом фоне"
          report = {"steps": []}


          def call(method, path, body=None, timeout=10):
              data = None if body is None else json.dumps(body).encode("utf-8")
              request = urllib.request.Request(
                  BASE + path, data=data, method=method,
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return response.status, json.loads(response.read().decode("utf-8") or "{}")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode("utf-8", errors="replace")[:500]
              except Exception as error:
                  return 0, type(error).__name__


          def finish(code):
              with open(os.path.join(OUT, "report.json"), "w", encoding="utf-8") as handle:
                  json.dump(report, handle, ensure_ascii=False, indent=2)
              print(json.dumps(report, ensure_ascii=False)[:3000])
              sys.exit(code)


          # The picture in progress lives on the phone: the start run writes its ids, the next run polls them.
          # No expression or input reaches this job, because the runner stops such a job before its steps.
          pending_path = os.path.join(OUT, "pending.json")
          conv_id = None
          operation_id = None
          if os.path.exists(pending_path):
              with open(pending_path, encoding="utf-8") as handle:
                  saved = json.load(handle)
              conv_id = saved.get("conversation_id")
              operation_id = saved.get("operation_id")
          report["conversation_id"] = conv_id
          report["operation_id"] = operation_id

          if not operation_id:
              # Start only: the server holds the picture until it is polled, so a run never waits for it.
              if not conv_id:
                  status, conv = call("POST", "/api/conversations", {"model": MODEL}, 10)
                  conv_id = conv.get("id") if isinstance(conv, dict) else None
                  report["conversation_id"] = conv_id
                  report["steps"].append({"step": "conversation", "status": status, "created": bool(conv_id)})
                  if not conv_id:
                      report["result"] = "no conversation"
                      finish(1)
              status, started = call("POST", "/api/images/generate",
                                     {"conversation_id": conv_id, "message": PROMPT, "model": MODEL}, 25)
              report["steps"].append({"step": "generate", "status": status, "body": started})
              if status != 200 or not isinstance(started, dict) or not started.get("operation_id"):
                  report["result"] = "generation was not started"
                  finish(1)
              report["operation_id"] = started["operation_id"]
              with open(pending_path, "w", encoding="utf-8") as handle:
                  json.dump({"conversation_id": conv_id, "operation_id": started["operation_id"]}, handle)
              report["result"] = "started: run art_generate again to poll it"
              finish(2)

          # Poll one operation once; the server answers within about 25 seconds.
          path = "/api/images/operations/%s?conversation_id=%s" % (operation_id, conv_id)
          status, state = call("GET", path, None, 50)
          report["steps"].append({"step": "poll", "status": status,
                                  "state": state.get("status") if isinstance(state, dict) else state,
                                  "error": state.get("error") if isinstance(state, dict) else None})
          if isinstance(state, dict) and state.get("status") == "done":
              reply = str(state.get("reply", ""))
              match = re.search(r"data:image/(jpeg|png);base64,([A-Za-z0-9+/=]+)", reply)
              if not match:
                  report["result"] = "done without an image in the reply"
                  finish(1)
              raw = base64.b64decode(match.group(2), validate=True)
              extension = "jpg" if match.group(1) == "jpeg" else "png"
              with open(os.path.join(os.environ["MEDIA_DIR"], "art." + extension), "wb") as handle:
                  handle.write(raw)
              report["result"] = {"image_bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest(),
                                  "mime": "image/" + match.group(1)}
              os.remove(pending_path)
              finish(0)
          if isinstance(state, dict) and state.get("status") == "failed":
              report["result"] = {"failed": state.get("error")}
              os.remove(pending_path)
              finish(1)
          report["result"] = "pending: run art_generate again to poll it"
          finish(2)
          PY
          if [ -f "$MEDIA_DIR/art.jpg" ]; then
            echo "picture bytes: $(wc -c < "$MEDIA_DIR/art.jpg")"
          fi
