name: Redmi 9 application server

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: redmi9-app-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: redmi9
    timeout-minutes: 10
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 10
        run: |
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          for file in scripts/redmi_app_server.sh tests/test_redmi_app_server.py .github/workflows/redmi9-app-server.yml; do
            mkdir -p "$(dirname "$file")"
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/$file" -o "$file"
          done
          python -m pytest -q tests/test_redmi_app_server.py
          bash scripts/redmi_app_server.sh deploy
