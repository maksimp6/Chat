name: Redmi 9 application server

on:
  push:
    branches: [ops/redmi9-app-server]
    paths:
      - scripts/redmi_app_server.sh
      - tests/test_redmi_app_server.py
      - .github/workflows/redmi9-app-server.yml
  workflow_dispatch:

permissions: {}

jobs:
  server:
    runs-on: redmi9
    timeout-minutes: 5
    steps:
      - name: logos
        shell: bash
        run: |
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          mkdir -p scripts tests
          for file in scripts/redmi_app_server.sh tests/test_redmi_app_server.py; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/$file" -o "$file"
          done
          python -m pytest -q tests/test_redmi_app_server.py
          bash scripts/redmi_app_server.sh restart
          bash scripts/redmi_app_server.sh status
