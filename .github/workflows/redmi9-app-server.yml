name: Redmi 9 application server

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      action:
        description: Operation on the existing Redmi 9 runner
        required: true
        default: deploy
        type: choice
        options: [deploy, screenshots, verify_screenshots, rootagent_native_check]

permissions: {}

concurrency:
  group: redmi9-app-server
  cancel-in-progress: false

jobs:
  server:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: redmi9
    timeout-minutes: 10
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 10
        env:
          LOGOS_REQUIRE_WIFI: "1"
        run: |
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          for file in scripts/redmi_app_server.sh scripts/redmi_app_launcher.py scripts/redmi_wifi_probe.py .github/workflows/redmi9-app-server.yml; do
            mkdir -p "$(dirname "$file")"
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/$file" -o "$file"
          done
          bash scripts/redmi_app_server.sh deploy

  screenshots:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master' && inputs.action == 'screenshots'
    runs-on: redmi9
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          capture_job_temp=$(python -c 'from pathlib import Path; import tempfile; print(Path(tempfile.mkdtemp(prefix=".logos-screenshots-", dir=".")).resolve())')
          export RUNNER_TEMP="$capture_job_temp"
          export TMPDIR="$capture_job_temp"
          scripts_dir=$(mktemp -d "$RUNNER_TEMP/logos-screenshot-scripts.XXXXXX")
          for script in redmi_screenshot_capture.py publish_redmi_screenshots.py; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/$script" -o "$scripts_dir/$script"
          done
          capture_dir="$RUNNER_TEMP/logos-screenshots-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python "$scripts_dir/redmi_screenshot_capture.py" "$capture_dir"
          python "$scripts_dir/publish_redmi_screenshots.py" "$capture_dir"
          python - "$capture_dir/manifest.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          scenario = manifest.get("creation_scenario", {})
          matrix = manifest.get("matrix_scenario", {})
          artifacts = {entry.get("path") for entry in manifest.get("artifacts", [])}
          required_artifacts = {"15-conversation-create.mp4", "events.json"}
          print(json.dumps({"creation_scenario": scenario.get("verdict", "NOT_RUN"),
                            "failures": scenario.get("failures", []),
                            "matrix_scenario": matrix.get("verdict", "NOT_RUN"),
                            "matrix_failures": matrix.get("failures", []),
                            "video_and_events_present": required_artifacts <= artifacts}))
          if (scenario.get("verdict") != "PASS" or scenario.get("failures") != []
                  or matrix.get("verdict") != "PASS" or matrix.get("failures") != []
                  or not required_artifacts <= artifacts):
              raise SystemExit("Application UI checks failed; evidence was published first")
          PY

  verify_screenshots:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master' && inputs.action == 'verify_screenshots'
    runs-on: redmi9
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          verification_job_temp=$(python -c 'from pathlib import Path; import tempfile; print(Path(tempfile.mkdtemp(prefix=".logos-screenshot-verification-", dir=".")).resolve())')
          export RUNNER_TEMP="$verification_job_temp"
          export TMPDIR="$verification_job_temp"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/publish_redmi_screenshots.py" -o "$verification_job_temp/publish_redmi_screenshots.py"
          python "$verification_job_temp/publish_redmi_screenshots.py" --verify-latest

  rootagent_native_check:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rootagent_native_check'
    runs-on: redmi9
    timeout-minutes: 8
    steps:
      - name: Native RootAgent controls and real input
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          native_job_temp=$(python -c 'from pathlib import Path; import tempfile; print(Path(tempfile.mkdtemp(prefix=".logos-rootagent-", dir=".")).resolve())')
          export RUNNER_TEMP="$native_job_temp"
          export TMPDIR="$native_job_temp"
          mkdir -m 700 "$RUNNER_TEMP/scripts" "$RUNNER_TEMP/tests" "$RUNNER_TEMP/evidence"
          for file in scripts/redmi_root_agent.py scripts/redmi_root_agent_e2e.py tests/test_redmi_root_agent.py; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/$file" -o "$RUNNER_TEMP/$file"
          done
          cd "$RUNNER_TEMP"
          python -m unittest discover -s tests -p test_redmi_root_agent.py -v
          python scripts/redmi_root_agent_e2e.py --helper scripts/redmi_root_agent.py --output "$RUNNER_TEMP/evidence"

