name: Redmi 9 application server

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      action:
        description: Operation on the existing Redmi 9 runner
        required: true
        default: deploy
        type: choice
        options: [deploy, screenshots, tools_self_check, verify_screenshots, rootagent_native_check, art_generate, rootagent_command]
      rootagent_command:
        description: "RootAgent command, used only with action rootagent_command"
        required: false
        type: choice
        options: [status, probe, capture, move, click, tap, swipe, text, key]
      rootagent_args:
        description: "Args for rootagent_command: tap 'X Y'; swipe 'X Y X2 Y2 [DUR]'; text 'STRING'; key 'KEYCODE'; move/click 'DX DY [PACKAGE]'; capture 'PACKAGE' optional; status/probe none"
        required: false
        type: string

permissions: {}

concurrency:
  group: redmi9-app-server
  cancel-in-progress: false

jobs:
  server:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: redmi9
    timeout-minutes: 10
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 10
        env:
          LOGOS_REQUIRE_WIFI: "1"
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          # Each job has its own UUID workspace. Remove disposable captures
          # across the runner work root before downloads or mkdtemp need space.
          cleanup_root="$HOME/github-python-runner/work"
          test "$(dirname "$GITHUB_WORKSPACE")" = "$cleanup_root"
          test ! -L "$HOME/github-python-runner"
          test ! -L "$cleanup_root"
          df -k "$cleanup_root"
          find "$cleanup_root" -mindepth 2 -maxdepth 2 -type d \( -name '.logos-screenshots-*' -o -name '.logos-screenshot-verification-*' -o -name '.logos-tools-check-*' -o -name '.logos-tools-tests-*' -o -name '.logos-candidate-tools-*' \) -print0 | while IFS= read -r -d '' leftover; do
            # Root capture children may leave root-owned files; retry as root, never fail the job on stale garbage.
            rm -rf -- "$leftover" 2>/dev/null || timeout 30 su -c "rm -rf -- '$leftover'" || echo "::warning::could not remove $leftover"
          done
          df -k "$cleanup_root"
          for file in scripts/redmi_app_server.sh scripts/redmi_app_launcher.py scripts/redmi_wifi_probe.py scripts/redmi_remove_autoupdate.py .github/workflows/redmi9-app-server.yml; do
            mkdir -p "$(dirname "$file")"
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$file" -o "$file"
          done
          # The runner is the only updater. Retire the former independent loop
          # after its in-flight controller finishes, preserving its evidence.
          python scripts/redmi_remove_autoupdate.py
          # The phone runs out of space when old deploy backups and screenshot folders pile up.
          # The concurrency group runs one workflow at a time, so no capture is active during this step.
          # Keep only the newest backup of the app memory, and only when that backup is non-empty
          # and its whole journal verifies as Kristall replays it: complete frames, unbroken digest chain.
          # Otherwise every backup is kept, so a damaged newest copy never removes the intact older ones.
          backups=/data/data/com.termux/files/home/logos-local-state/deploy-backups
          if [ -d "$backups" ]; then
            newest=$(ls -1t "$backups"/*.memory 2>/dev/null | head -n 1 || true)
            if [ -n "$newest" ] && [ -s "$newest" ] && python - "$newest" <<'PY'
          import hashlib
          import json
          import sys
          digest = "0" * 64
          with open(sys.argv[1], "rb") as journal:
              for frame in journal:
                  if not frame.endswith(b"\n"):
                      raise SystemExit("Newest memory backup has an incomplete tail; all backups are kept")
                  record = json.loads(frame)
                  encoded = json.dumps(record["payload"], sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
                  digest = hashlib.sha256(bytes.fromhex(digest) + encoded).hexdigest()
                  if record["digest"] != digest:
                      raise SystemExit("Newest memory backup breaks the commit chain; all backups are kept")
          PY
            then
              ls -1t "$backups"/*.memory 2>/dev/null | tail -n +2 | xargs -r rm -f
            fi
          fi
          bash scripts/redmi_app_server.sh deploy

  screenshots:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master' && inputs.action == 'screenshots'
    runs-on: redmi9
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          # Each job has its own UUID workspace. Remove disposable captures
          # across the runner work root before downloads or mkdtemp need space.
          cleanup_root="$HOME/github-python-runner/work"
          test "$(dirname "$GITHUB_WORKSPACE")" = "$cleanup_root"
          test ! -L "$HOME/github-python-runner"
          test ! -L "$cleanup_root"
          df -k "$cleanup_root"
          find "$cleanup_root" -mindepth 2 -maxdepth 2 -type d \( -name '.logos-screenshots-*' -o -name '.logos-screenshot-verification-*' -o -name '.logos-tools-check-*' -o -name '.logos-tools-tests-*' -o -name '.logos-candidate-tools-*' \) -print0 | while IFS= read -r -d '' leftover; do
            # Root capture children may leave root-owned files; retry as root, never fail the job on stale garbage.
            rm -rf -- "$leftover" 2>/dev/null || timeout 30 su -c "rm -rf -- '$leftover'" || echo "::warning::could not remove $leftover"
          done
          df -k "$cleanup_root"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/redmi_media_ram.sh" -o "$GITHUB_WORKSPACE/redmi_media_ram.sh"
          # Media goes only to a fixed-size RAM disk: never to flash, wiped on exit.
          media_ram=$(bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" mount)
          trap 'cd "$GITHUB_WORKSPACE"; bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" umount' EXIT
          capture_job_temp=$(mktemp -d "$media_ram/screenshots.XXXXXX")
          export RUNNER_TEMP="$capture_job_temp"
          export TMPDIR="$capture_job_temp"
          scripts_dir=$(mktemp -d "$RUNNER_TEMP/logos-screenshot-scripts.XXXXXX")
          for script in redmi_screenshot_capture.py publish_redmi_screenshots.py; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/$script" -o "$scripts_dir/$script"
          done
          capture_dir="$RUNNER_TEMP/logos-screenshots-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python "$scripts_dir/redmi_screenshot_capture.py" "$capture_dir"
          python "$scripts_dir/publish_redmi_screenshots.py" "$capture_dir"
          python - "$capture_dir/manifest.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          scenario = manifest.get("creation_scenario", {})
          matrix = manifest.get("matrix_scenario", {})
          artifacts = {entry.get("path") for entry in manifest.get("artifacts", [])}
          required_artifacts = {"15-conversation-create.mp4", "events.json"}
          # STALE_RUNTIME keeps the verdicts valid for the installed app; it only says they do not prove this commit.
          print(json.dumps({"deployment_acceptance": manifest.get("deployment_acceptance"),
                            "creation_scenario": scenario.get("verdict", "NOT_RUN"),
                            "failures": scenario.get("failures", []),
                            "matrix_scenario": matrix.get("verdict", "NOT_RUN"),
                            "matrix_failures": matrix.get("failures", []),
                            "video_and_events_present": required_artifacts <= artifacts}))
          if (scenario.get("verdict") != "PASS" or scenario.get("failures") != []
                  or matrix.get("verdict") != "PASS" or matrix.get("failures") != []
                  or not required_artifacts <= artifacts):
              raise SystemExit("Application UI checks failed; evidence was published first")
          PY

  tools_self_check:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master' && inputs.action == 'tools_self_check'
    runs-on: redmi9
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOGOS_TOOLS_SELF_CHECK: "1"
          CI: "true"
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          # Each job has its own UUID workspace. Remove disposable captures
          # across the runner work root before downloads or mkdtemp need space.
          cleanup_root="$HOME/github-python-runner/work"
          test "$(dirname "$GITHUB_WORKSPACE")" = "$cleanup_root"
          test ! -L "$HOME/github-python-runner"
          test ! -L "$cleanup_root"
          df -k "$cleanup_root"
          find "$cleanup_root" -mindepth 2 -maxdepth 2 -type d \( -name '.logos-screenshots-*' -o -name '.logos-screenshot-verification-*' -o -name '.logos-tools-check-*' -o -name '.logos-tools-tests-*' -o -name '.logos-candidate-tools-*' \) -print0 | while IFS= read -r -d '' leftover; do
            # Root capture children may leave root-owned files; retry as root, never fail the job on stale garbage.
            rm -rf -- "$leftover" 2>/dev/null || timeout 30 su -c "rm -rf -- '$leftover'" || echo "::warning::could not remove $leftover"
          done
          df -k "$cleanup_root"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/redmi_media_ram.sh" -o "$GITHUB_WORKSPACE/redmi_media_ram.sh"
          # Media goes only to a fixed-size RAM disk: never to flash, wiped on exit.
          media_ram=$(bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" mount)
          trap 'cd "$GITHUB_WORKSPACE"; bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" umount' EXIT
          check_temp=$(mktemp -d "$media_ram/tools-check.XXXXXX")
          export RUNNER_TEMP="$check_temp"
          export TMPDIR="$check_temp"
          mkdir -m 700 "$check_temp/scripts"
          for file in scripts/redmi_screenshot_capture.py scripts/publish_redmi_screenshots.py scripts/logos_tools_self_check.py; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$file" -o "$check_temp/$file"
          done
          cd "$check_temp"
          capture_dir="$check_temp/logos-screenshots-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/redmi_screenshot_capture.py "$capture_dir"
          python scripts/publish_redmi_screenshots.py "$capture_dir"
          python - "$capture_dir/manifest.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          scenario = manifest.get("creation_scenario", {})
          check = scenario.get("checkpoints", {}).get("tools_self_check", {})
          print(json.dumps({"deployment_acceptance": manifest.get("deployment_acceptance"), "tools_self_check": check,
                            "scenario_failures": scenario.get("failures", [])}, ensure_ascii=False))
          if check.get("status") != "PASS" or scenario.get("verdict") != "PASS":
              raise SystemExit("Tools or parameter availability not fully proven; evidence published first")
          PY

  verify_screenshots:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master' && inputs.action == 'verify_screenshots'
    runs-on: redmi9
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          # Each job has its own UUID workspace. Remove disposable captures
          # across the runner work root before downloads or mkdtemp need space.
          cleanup_root="$HOME/github-python-runner/work"
          test "$(dirname "$GITHUB_WORKSPACE")" = "$cleanup_root"
          test ! -L "$HOME/github-python-runner"
          test ! -L "$cleanup_root"
          df -k "$cleanup_root"
          find "$cleanup_root" -mindepth 2 -maxdepth 2 -type d \( -name '.logos-screenshots-*' -o -name '.logos-screenshot-verification-*' -o -name '.logos-tools-check-*' -o -name '.logos-tools-tests-*' -o -name '.logos-candidate-tools-*' \) -print0 | while IFS= read -r -d '' leftover; do
            # Root capture children may leave root-owned files; retry as root, never fail the job on stale garbage.
            rm -rf -- "$leftover" 2>/dev/null || timeout 30 su -c "rm -rf -- '$leftover'" || echo "::warning::could not remove $leftover"
          done
          df -k "$cleanup_root"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/redmi_media_ram.sh" -o "$GITHUB_WORKSPACE/redmi_media_ram.sh"
          # Media goes only to a fixed-size RAM disk: never to flash, wiped on exit.
          media_ram=$(bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" mount)
          trap 'cd "$GITHUB_WORKSPACE"; bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" umount' EXIT
          verification_job_temp=$(mktemp -d "$media_ram/verification.XXXXXX")
          export RUNNER_TEMP="$verification_job_temp"
          export TMPDIR="$verification_job_temp"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/publish_redmi_screenshots.py" -o "$verification_job_temp/publish_redmi_screenshots.py"
          python "$verification_job_temp/publish_redmi_screenshots.py" --verify-latest

  rootagent_native_check:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rootagent_native_check'
    runs-on: redmi9
    timeout-minutes: 8
    steps:
      - name: Native RootAgent controls and real input
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          # Each job has its own UUID workspace. Remove disposable captures
          # across the runner work root before downloads or mkdtemp need space.
          cleanup_root="$HOME/github-python-runner/work"
          test "$(dirname "$GITHUB_WORKSPACE")" = "$cleanup_root"
          test ! -L "$HOME/github-python-runner"
          test ! -L "$cleanup_root"
          df -k "$cleanup_root"
          find "$cleanup_root" -mindepth 2 -maxdepth 2 -type d \( -name '.logos-screenshots-*' -o -name '.logos-screenshot-verification-*' -o -name '.logos-tools-check-*' -o -name '.logos-tools-tests-*' -o -name '.logos-candidate-tools-*' \) -print0 | while IFS= read -r -d '' leftover; do
            # Root capture children may leave root-owned files; retry as root, never fail the job on stale garbage.
            rm -rf -- "$leftover" 2>/dev/null || timeout 30 su -c "rm -rf -- '$leftover'" || echo "::warning::could not remove $leftover"
          done
          df -k "$cleanup_root"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/redmi_media_ram.sh" -o "$GITHUB_WORKSPACE/redmi_media_ram.sh"
          # Media goes only to a fixed-size RAM disk: never to flash, wiped on exit.
          media_ram=$(bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" mount)
          trap 'cd "$GITHUB_WORKSPACE"; bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" umount' EXIT
          native_job_temp=$(mktemp -d "$media_ram/rootagent.XXXXXX")
          export RUNNER_TEMP="$native_job_temp"
          export TMPDIR="$native_job_temp"
          mkdir -m 700 "$RUNNER_TEMP/scripts" "$RUNNER_TEMP/evidence"
          for file in scripts/redmi_root_agent.py scripts/redmi_root_agent_e2e.py; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$file" -o "$RUNNER_TEMP/$file"
          done
          cd "$RUNNER_TEMP"
          python scripts/redmi_root_agent_e2e.py --helper scripts/redmi_root_agent.py --output "$RUNNER_TEMP/evidence"

  art_generate:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'art_generate'
    runs-on: redmi9
    timeout-minutes: 1
    steps:
      - name: Start one picture, or poll one operation, through the Redmi 9 app
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          # Each job has its own UUID workspace. Remove disposable captures
          # across the runner work root before downloads or mkdtemp need space.
          cleanup_root="$HOME/github-python-runner/work"
          test "$(dirname "$GITHUB_WORKSPACE")" = "$cleanup_root"
          test ! -L "$HOME/github-python-runner"
          test ! -L "$cleanup_root"
          df -k "$cleanup_root"
          find "$cleanup_root" -mindepth 2 -maxdepth 2 -type d \( -name '.logos-screenshots-*' -o -name '.logos-screenshot-verification-*' -o -name '.logos-tools-check-*' -o -name '.logos-tools-tests-*' -o -name '.logos-candidate-tools-*' \) -print0 | while IFS= read -r -d '' leftover; do
            # Root capture children may leave root-owned files; retry as root, never fail the job on stale garbage.
            rm -rf -- "$leftover" 2>/dev/null || timeout 30 su -c "rm -rf -- '$leftover'" || echo "::warning::could not remove $leftover"
          done
          df -k "$cleanup_root"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/redmi_media_ram.sh" -o "$GITHUB_WORKSPACE/redmi_media_ram.sh"
          # Media goes only to a fixed-size RAM disk: never to flash, wiped on exit.
          media_ram=$(bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" mount)
          trap 'cd "$GITHUB_WORKSPACE"; bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" umount' EXIT
          export MEDIA_DIR="$media_ram"
          # Only the small pending/report state stays on flash; the picture itself stays in RAM.
          export OUT_DIR="$HOME/logos-art-real"
          mkdir -p "$OUT_DIR"
          rm -f "$OUT_DIR"/art.jpg "$OUT_DIR"/art.png
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8080"
          OUT = os.environ["OUT_DIR"]
          MODEL = "alice-ai-art"
          PROMPT = "красный круг на белом фоне"
          report = {"steps": []}


          def call(method, path, body=None, timeout=10):
              data = None if body is None else json.dumps(body).encode("utf-8")
              request = urllib.request.Request(
                  BASE + path, data=data, method=method,
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return response.status, json.loads(response.read().decode("utf-8") or "{}")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode("utf-8", errors="replace")[:500]
              except Exception as error:
                  return 0, type(error).__name__


          def finish(code):
              with open(os.path.join(OUT, "report.json"), "w", encoding="utf-8") as handle:
                  json.dump(report, handle, ensure_ascii=False, indent=2)
              print(json.dumps(report, ensure_ascii=False)[:3000])
              sys.exit(code)


          # The picture in progress lives on the phone: the start run writes its ids, the next run polls them.
          # No expression or input reaches this job, because the runner stops such a job before its steps.
          pending_path = os.path.join(OUT, "pending.json")
          conv_id = None
          operation_id = None
          if os.path.exists(pending_path):
              with open(pending_path, encoding="utf-8") as handle:
                  saved = json.load(handle)
              conv_id = saved.get("conversation_id")
              operation_id = saved.get("operation_id")
          report["conversation_id"] = conv_id
          report["operation_id"] = operation_id

          if not operation_id:
              # Start only: the server holds the picture until it is polled, so a run never waits for it.
              if not conv_id:
                  status, conv = call("POST", "/api/conversations", {"model": MODEL}, 10)
                  conv_id = conv.get("id") if isinstance(conv, dict) else None
                  report["conversation_id"] = conv_id
                  report["steps"].append({"step": "conversation", "status": status, "created": bool(conv_id)})
                  if not conv_id:
                      report["result"] = "no conversation"
                      finish(1)
              status, started = call("POST", "/api/images/generate",
                                     {"conversation_id": conv_id, "message": PROMPT, "model": MODEL}, 25)
              report["steps"].append({"step": "generate", "status": status, "body": started})
              if status != 200 or not isinstance(started, dict) or not started.get("operation_id"):
                  report["result"] = "generation was not started"
                  finish(1)
              report["operation_id"] = started["operation_id"]
              with open(pending_path, "w", encoding="utf-8") as handle:
                  json.dump({"conversation_id": conv_id, "operation_id": started["operation_id"]}, handle)
              report["result"] = "started: run art_generate again to poll it"
              finish(2)

          # Poll one operation once; the server answers within about 25 seconds.
          path = "/api/images/operations/%s?conversation_id=%s" % (operation_id, conv_id)
          status, state = call("GET", path, None, 50)
          report["steps"].append({"step": "poll", "status": status,
                                  "state": state.get("status") if isinstance(state, dict) else state,
                                  "error": state.get("error") if isinstance(state, dict) else None})
          if isinstance(state, dict) and state.get("status") == "done":
              reply = str(state.get("reply", ""))
              match = re.search(r"data:image/(jpeg|png);base64,([A-Za-z0-9+/=]+)", reply)
              if not match:
                  report["result"] = "done without an image in the reply"
                  finish(1)
              raw = base64.b64decode(match.group(2), validate=True)
              extension = "jpg" if match.group(1) == "jpeg" else "png"
              with open(os.path.join(os.environ["MEDIA_DIR"], "art." + extension), "wb") as handle:
                  handle.write(raw)
              report["result"] = {"image_bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest(),
                                  "mime": "image/" + match.group(1)}
              os.remove(pending_path)
              finish(0)
          if isinstance(state, dict) and state.get("status") == "failed":
              report["result"] = {"failed": state.get("error")}
              os.remove(pending_path)
              finish(1)
          report["result"] = "pending: run art_generate again to poll it"
          finish(2)
          PY
          if [ -f "$MEDIA_DIR/art.jpg" ]; then
            echo "picture bytes: $(wc -c < "$MEDIA_DIR/art.jpg")"
          fi

  # Dispatched by the Logos tool rootagent_run. Logos drives the whole phone as a
  # user: status, probe, capture, move, click, tap, swipe, text, key. Runs only for develop.
  rootagent_command:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rootagent_command' && github.ref == 'refs/heads/develop'
    runs-on: redmi9
    timeout-minutes: 8
    # This phone runner cannot execute Node20 JS actions (actions/upload-artifact
    # fails at job setup), so the result and any PNG are published to the
    # rootagent-results branch through the GitHub API with pure Python, like every
    # other job here. contents: write is needed only for that results branch.
    permissions:
      contents: write
    steps:
      - name: Validate the RootAgent request before anything runs
        id: request
        shell: bash
        timeout-minutes: 1
        env:
          ROOTAGENT_COMMAND: ${{ inputs.rootagent_command }}
          ROOTAGENT_ARGS: ${{ inputs.rootagent_args }}
        run: |
          set -uo pipefail
          result="$RUNNER_TEMP/rootagent-result.json"
          out="$(python -I - <<'PY' 2>&1
          import json
          import os
          import re

          COMMANDS = (
              "status", "probe", "capture", "move", "click",
              "tap", "swipe", "text", "key",
          )
          STRICT = re.compile(r"[A-Za-z0-9_. -]*")
          PACKAGE = re.compile(r"[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+")
          DELTA = re.compile(r"-?(?:0|[1-9][0-9]{0,2})")
          COORD = re.compile(r"0|[1-9][0-9]{0,4}")
          KEYCODE = re.compile(r"KEYCODE_[A-Z0-9_]+|[0-9]{1,4}")
          command = os.environ.get("ROOTAGENT_COMMAND", "")
          raw = os.environ.get("ROOTAGENT_ARGS", "")
          if command not in COMMANDS:
              raise SystemExit("rootagent_command must be one of " + ", ".join(COMMANDS))
          request = {"command": command}
          # The whole validated request is written to a JSON file and handed to the
          # CLI with --request. No argument, least of all free text, is ever passed
          # through a shell command line or an environment variable.
          if command == "text":
              if not raw:
                  raise SystemExit("text requires a non-empty string")
              if len(raw) > 4096 or "\x00" in raw or "\n" in raw or "\r" in raw:
                  raise SystemExit("text must be at most 4096 characters on a single line")
              request["text"] = raw
          else:
              if STRICT.fullmatch(raw) is None:
                  raise SystemExit("rootagent_args may contain only letters, digits, underscore, dot, minus and spaces")
              tokens = raw.split(" ") if raw else []
              if command in ("status", "probe"):
                  if tokens:
                      raise SystemExit(f"{command} takes no arguments")
              elif command == "capture":
                  if len(tokens) > 1 or (tokens and PACKAGE.fullmatch(tokens[0]) is None):
                      raise SystemExit("capture takes an optional package name, such as com.example.app")
                  if tokens:
                      request["expected_package"] = tokens[0]
              elif command in ("move", "click"):
                  if len(tokens) not in (2, 3) or any(DELTA.fullmatch(t) is None for t in tokens[:2]):
                      raise SystemExit(f"{command} takes DX DY [PACKAGE]: two deltas and an optional package")
                  if len(tokens) == 3 and PACKAGE.fullmatch(tokens[2]) is None:
                      raise SystemExit("the third argument must be a package name")
                  dx, dy = int(tokens[0]), int(tokens[1])
                  if not (-500 <= dx <= 500 and -500 <= dy <= 500):
                      raise SystemExit("move and click deltas must be integers from -500 through 500")
                  request["dx"], request["dy"] = dx, dy
                  if len(tokens) == 3:
                      request["expected_package"] = tokens[2]
              elif command == "tap":
                  if len(tokens) != 2 or any(COORD.fullmatch(t) is None for t in tokens):
                      raise SystemExit("tap takes X Y: two screen coordinates")
                  request["x"], request["y"] = int(tokens[0]), int(tokens[1])
              elif command == "swipe":
                  if len(tokens) not in (4, 5) or any(COORD.fullmatch(t) is None for t in tokens):
                      raise SystemExit("swipe takes X Y X2 Y2 [DURATION_MS]")
                  request["x"], request["y"], request["x2"], request["y2"] = (int(t) for t in tokens[:4])
                  if len(tokens) == 5:
                      request["duration_ms"] = int(tokens[4])
              elif command == "key":
                  if len(tokens) != 1 or KEYCODE.fullmatch(tokens[0]) is None:
                      raise SystemExit("key takes one keycode, such as KEYCODE_HOME or 3")
                  request["keycode"] = tokens[0]
          path = os.path.join(os.environ["RUNNER_TEMP"], "rootagent-request.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(request, handle)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"command={command}\n")
          print(f"rootagent_command {command} accepted")
          PY
          )"
          status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            printf '{"ok":false,"stage":"validate","exit":%s,"detail":%s}\n' \
              "$status" "$(printf '%s' "$out" | python -I -c 'import json,sys; print(json.dumps(sys.stdin.read()[:2000]))')" > "$result"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Mount the RAM disk for a capture only
        id: media
        if: steps.request.outputs.ok == 'true' && steps.request.outputs.command == 'capture'
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          mkdir -p -m 700 "$RUNNER_TEMP/scripts"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/redmi_media_ram.sh" -o "$RUNNER_TEMP/scripts/redmi_media_ram.sh"
          # Media goes only to a fixed-size RAM disk: never to flash, wiped on unmount.
          media=$(bash "$RUNNER_TEMP/scripts/redmi_media_ram.sh" mount)
          echo "media=$media" >> "$GITHUB_OUTPUT"

      - name: Run one bounded RootAgent command on the Redmi 9
        id: run
        if: steps.request.outputs.ok == 'true'
        shell: bash
        timeout-minutes: 3
        run: |
          set -uo pipefail
          result="$RUNNER_TEMP/rootagent-result.json"
          model="$(/system/bin/getprop ro.product.model 2>&1)"
          if [ "$model" != 'Redmi 9' ]; then
            printf '{"ok":false,"stage":"model","detail":%s}\n' "$(printf '%s' "$model" | python -I -c 'import json,sys;print(json.dumps(sys.stdin.read()[:400]))')" > "$result"
            cat "$result"; exit 0
          fi
          mkdir -p -m 700 "$RUNNER_TEMP/scripts"
          if ! curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/redmi_root_agent.py" -o "$RUNNER_TEMP/scripts/redmi_root_agent.py" 2>"$RUNNER_TEMP/curl.err"; then
            printf '{"ok":false,"stage":"curl","detail":%s}\n' "$(cat "$RUNNER_TEMP/curl.err" | python -I -c 'import json,sys;print(json.dumps(sys.stdin.read()[:400]))')" > "$result"
            cat "$result"; exit 0
          fi
          # The validator wrote the whole request to this JSON file; the CLI reads it
          # with --request, so no argument passes through a shell line or environment.
          argv=(--request "$RUNNER_TEMP/rootagent-request.json")
          if [ "${{ steps.request.outputs.command }}" = "capture" ]; then
            argv+=(--output "${{ steps.media.outputs.media }}/rootagent-capture.png")
          fi
          out="$(python "$RUNNER_TEMP/scripts/redmi_root_agent.py" "${argv[@]}" 2>&1)"; status=$?
          if [ "$status" -eq 0 ]; then
            printf '%s\n' "$out" > "$result"
          else
            printf '{"ok":false,"stage":"cli","exit":%s,"detail":%s}\n' \
              "$status" "$(printf '%s' "$out" | python -I -c 'import json,sys;print(json.dumps(sys.stdin.read()[:2000]))')" > "$result"
          fi
          cat "$result"

      - name: Publish the RootAgent result through the GitHub API
        if: always()
        shell: bash
        timeout-minutes: 2
        env:
          # The token and these runner paths are not request payload; the request
          # itself still travels only in the --request JSON file.
          GH_TOKEN: ${{ github.token }}
          MEDIA: ${{ steps.media.outputs.media }}
          REQUEST_OK: ${{ steps.request.outputs.ok }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          IS_CAPTURE: ${{ steps.request.outputs.command == 'capture' && steps.media.outcome == 'success' }}
        run: |
          set -uo pipefail
          result="$RUNNER_TEMP/rootagent-result.json"
          if [ ! -s "$result" ]; then
            printf '{"ok":false,"stage":"job","request_ok":"%s","run_outcome":"%s"}\n' \
              "$REQUEST_OK" "$RUN_OUTCOME" > "$result"
          fi
          cat "$result"
          python -I - <<'PY'
          import base64, json, os, urllib.error, urllib.request

          api = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = "rootagent-results"
          run_id = os.environ["GITHUB_RUN_ID"]
          temp = os.environ["RUNNER_TEMP"]

          def call(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": "token " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "logos-rootagent"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.loads(response.read() or b"null")
              except urllib.error.HTTPError as error:
                  return error.code, None

          code, _ = call("GET", f"{api}/git/ref/heads/{branch}")
          if code == 404:
              _, ref = call("GET", f"{api}/git/ref/heads/develop")
              call("POST", f"{api}/git/refs",
                   {"ref": f"refs/heads/{branch}", "sha": ref["object"]["sha"]})

          def publish(path, raw, message):
              content = base64.b64encode(raw).decode("ascii")
              code, info = call("GET", f"{api}/contents/{path}?ref={branch}")
              body = {"message": message, "content": content, "branch": branch}
              if code == 200 and isinstance(info, dict) and info.get("sha"):
                  body["sha"] = info["sha"]
              status, _ = call("PUT", f"{api}/contents/{path}", body)
              print(f"published {path}: HTTP {status}")

          with open(os.path.join(temp, "rootagent-result.json"), "rb") as handle:
              publish(f"runs/{run_id}.json", handle.read(), f"rootagent result {run_id}")

          if os.environ.get("IS_CAPTURE") == "true":
              png = os.path.join(os.environ.get("MEDIA", ""), "rootagent-capture.png")
              if os.path.isfile(png):
                  with open(png, "rb") as handle:
                      publish(f"runs/{run_id}.png", handle.read(), f"rootagent capture {run_id}")
          PY

      - name: Unmount the RAM disk
        if: always() && steps.media.outcome != 'skipped'
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/scripts/redmi_media_ram.sh" umount
