name: PR court (one-shot)

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-court-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  judge:
    # Only the owner's explicitly requested initial rehearsal, not a paid PR monitor.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'maksimp6' &&
      github.event.pull_request.head.ref == 'feat/pr-court-yandex-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Negative controls and regression tests (no credentials)
        run: python -m unittest discover -s tests -p 'test_pr_court*.py' -v
      - name: Reject original uncited verdict without a model call
        run: |
          set -euo pipefail
          if python scripts/pr_court_evidence.py --replay tests/fixtures/pr_court_1422_response.json --output pr-court-output; then
            echo "Negative control unexpectedly passed" >&2
            exit 1
          fi
          python -c 'import json; from pathlib import Path; r=json.loads(Path("pr-court-output/replay.json").read_text()); assert r["status"] == "MODEL_OUTPUT_REJECTED"; assert r["paid_calls"] == 0'
          echo "Original uncited verdict rejected; no additional model calls." >> "$GITHUB_STEP_SUMMARY"
      - name: One bounded model judgment (no tools or writes)
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
        run: python -m scripts.pr_court
      - name: Preserve judgment or explicit blocker
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-court-${{ github.run_id }}-${{ github.event.pull_request.head.sha }}
          path: pr-court-output/
          if-no-files-found: error
          retention-days: 7
