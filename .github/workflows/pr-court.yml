name: PR court (one-shot)

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-court-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  judge:
    # Only the owner's explicit PR rehearsal, not a paid PR monitor.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'maksimp6' &&
      github.event.pull_request.head.ref == 'feat/pr-court-yandex-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Checkout exact PR head
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Yandex API contract validator
        id: yandex_contract_dependencies
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: python -m pip install -r contracts/yandex/requirements.txt
      - name: Negative controls and regression tests (no credentials)
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: python -m unittest discover -s tests -p 'test_pr_court*.py' -v
      - name: Reject original uncited verdict without a model call
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          set -euo pipefail
          if python scripts/pr_court_evidence.py --replay tests/fixtures/pr_court_1422_response.json --output pr-court-output; then
            echo "Negative control unexpectedly passed" >&2
            exit 1
          fi
          python -c 'import json; from pathlib import Path; r=json.loads(Path("pr-court-output/replay.json").read_text()); assert r["status"] == "MODEL_OUTPUT_REJECTED"; assert r["paid_calls"] == 0'
          echo "Offline negative control rejected the original uncited verdict." >> "$GITHUB_STEP_SUMMARY"
      - name: Decode actual live model response with corrected parser (offline)
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          from scripts.pr_court_evidence import validate_judgment
          r = json.loads(Path("tests/fixtures/pr_court_1422_corrected_response.json").read_text())
          result = validate_judgment(r["judgment"], "", [])
          assert result["status"] == "NO_CANDIDATES_NOT_APPROVAL"
          assert result["semantic_quality"] == "NOT_VERIFIED"
          assert not result["merge_approval"]
          result["source_run_id"] = r["run_id"]
          result["source_head"] = r["head"]
          result["response_id"] = r["response_id"]
          result["additional_paid_calls"] = 0
          Path("pr-court-output/live-response-replay.json").write_text(json.dumps(result, ensure_ascii=False, indent=2))
          print(json.dumps(result, ensure_ascii=False))
          PYTHON
      - name: One bounded model judgment (no tools or writes)
        id: policy_step_05
        continue-on-error: true
        # One correction transition only; later pushes and rerun attempts do not bill.
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') && (>-) }}
          github.event.action == 'synchronize' &&
          github.event.before == '8ef5a8b2b359c013bcf2dc9ed68058533acaadc5' &&
          github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
        run: python -m scripts.pr_court
      - name: Preserve judgment or explicit blocker
        id: policy_step_06
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-court-${{ github.run_id }}-${{ github.event.pull_request.head.sha }}
          path: pr-court-output/
          if-no-files-found: error
          retention-days: 7
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
