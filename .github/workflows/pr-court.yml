name: PR court (one-shot)

on:
  pull_request:
    types: [opened]
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-court-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  judge:
    # Only the owner's explicitly requested initial rehearsal, not a paid PR monitor.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'maksimp6' &&
      github.event.pull_request.head.ref == 'feat/pr-court-yandex-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Negative controls and regression tests (no credentials)
        run: python -m unittest discover -s tests -p test_pr_court.py -v
      - name: One bounded model judgment (no tools or writes)
        env:
          GH_TOKEN: ${{ github.token }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
        run: python scripts/pr_court.py
      - name: Preserve judgment or explicit blocker
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-court-${{ github.run_id }}-${{ github.event.pull_request.head.sha }}
          path: pr-court-output/
          if-no-files-found: error
          retention-days: 7
