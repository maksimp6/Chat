name: Frontend baseline probe

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public preview URL to probe
        required: true
        type: string
      runner_os:
        description: GitHub runner operating system
        required: false
        default: windows-latest
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
      download_kbps:
        description: Optional download throughput in KiB/s (for example 10 for the 10 KiB/s baseline)
        required: false
        default: ''
        type: string
      upload_kbps:
        description: Optional upload throughput in KiB/s
        required: false
        default: ''
        type: string
      latency_ms:
        description: Optional additional network latency in milliseconds
        required: false
        default: '0'
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: Playwright frontend baseline
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-frontend.txt
          python -m playwright install chromium
      - name: Run baseline probe
        shell: pwsh
        env:
          BASE_URL: ${{ inputs.base_url }}
          DOWNLOAD_KBPS: ${{ inputs.download_kbps }}
          UPLOAD_KBPS: ${{ inputs.upload_kbps }}
          LATENCY_MS: ${{ inputs.latency_ms }}
        run: |
          $args = @('--output', 'artifacts/frontend-baseline')
          if ($env:DOWNLOAD_KBPS) { $args += @('--download-kbps', $env:DOWNLOAD_KBPS) }
          if ($env:UPLOAD_KBPS) { $args += @('--upload-kbps', $env:UPLOAD_KBPS) }
          if ($env:LATENCY_MS -and $env:LATENCY_MS -ne '0') { $args += @('--latency-ms', $env:LATENCY_MS) }
          python tests/frontend_baseline.py @args
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-baseline-${{ github.run_id }}
          path: artifacts/frontend-baseline/
          if-no-files-found: warn
          retention-days: 14
