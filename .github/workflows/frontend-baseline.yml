name: Frontend baseline probe

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public preview URL to probe
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: Playwright frontend baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-frontend.txt
          python -m playwright install --with-deps chromium
      - name: Run baseline probe
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: python tests/frontend_baseline.py --output artifacts/frontend-baseline
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-baseline-${{ github.run_id }}
          path: artifacts/frontend-baseline/
          if-no-files-found: warn
          retention-days: 14
