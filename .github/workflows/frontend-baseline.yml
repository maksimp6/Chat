name: Frontend baseline probe

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public preview URL to probe
        required: true
        type: string
      runner_os:
        description: GitHub runner operating system
        required: false
        default: windows-latest
        type: choice
        options:
          - windows-latest
          - ubuntu-latest

permissions:
  contents: read

jobs:
  probe:
    name: Playwright frontend baseline
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-frontend.txt
          python -m playwright install chromium
      - name: Run baseline probe
        shell: pwsh
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: python tests/frontend_baseline.py --output artifacts/frontend-baseline
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-baseline-${{ github.run_id }}
          path: artifacts/frontend-baseline/
          if-no-files-found: warn
          retention-days: 14
