name: Yandex ART auth check

on:
  workflow_dispatch:

permissions: {}

jobs:
  art_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the IAM token is accepted (no generation, no charge)
        shell: bash
        env:
          YANDEX_IAM_TOKEN: ${{ secrets.YANDEX_IAM_TOKEN }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$YANDEX_IAM_TOKEN"
          test -n "$YANDEX_FOLDER_ID"
          # A made-up operation id: 404 or 400 means the token was accepted; 401 or 403 means it was not.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $YANDEX_IAM_TOKEN" \
            https://operation.api.cloud.yandex.net/operations/auth-probe-0000000000)
          echo "operation endpoint http=$code"
          case "$code" in
            400|404) echo "authorization accepted" ;;
            *) echo "authorization rejected or unexpected: $code"; exit 1 ;;
          esac
