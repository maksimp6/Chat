name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      ALICE_RELEASE_STORE_PASSWORD: ${{ secrets.ALICE_RELEASE_STORE_PASSWORD }}
      ALICE_RELEASE_KEY_ALIAS: ${{ secrets.ALICE_RELEASE_KEY_ALIAS }}
      ALICE_RELEASE_KEY_PASSWORD: ${{ secrets.ALICE_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Checkout
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Python
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Stage Python runtime
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        working-directory: android
        run: python scripts/stage_python.py

      - name: Set up Gradle
        id: policy_step_05
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.5.0"
          cache-disabled: true

      - name: Validate release tag
        id: policy_step_06
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "Release tag: $RELEASE_TAG"
          echo "Version: ${RELEASE_TAG#v}"

      - name: Validate release signing secrets
        id: policy_step_07
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ALICE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64" || { echo "::error::ALICE_RELEASE_KEYSTORE_BASE64 is not configured."; exit 1; }
          test -n "$ALICE_RELEASE_STORE_PASSWORD" || { echo "::error::ALICE_RELEASE_STORE_PASSWORD is not configured."; exit 1; }
          test -n "$ALICE_RELEASE_KEY_ALIAS" || { echo "::error::ALICE_RELEASE_KEY_ALIAS is not configured."; exit 1; }
          test -n "$ALICE_RELEASE_KEY_PASSWORD" || { echo "::error::ALICE_RELEASE_KEY_PASSWORD is not configured."; exit 1; }

      - name: Materialize release keystore
        id: policy_step_08
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          ALICE_RELEASE_KEYSTORE_BASE64: ${{ secrets.ALICE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # The runner context is not available in job-level env; export the path for later steps.
          ALICE_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/alice-release.jks"
          echo "ALICE_RELEASE_KEYSTORE_PATH=$ALICE_RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$ALICE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ALICE_RELEASE_KEYSTORE_PATH"
          chmod 600 "$ALICE_RELEASE_KEYSTORE_PATH"
          test -s "$ALICE_RELEASE_KEYSTORE_PATH"
          keytool -list \
            -keystore "$ALICE_RELEASE_KEYSTORE_PATH" \
            -storepass "$ALICE_RELEASE_STORE_PASSWORD" \
            -alias "$ALICE_RELEASE_KEY_ALIAS" >/dev/null

      - name: Run Android unit tests
        id: policy_step_09
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build signed release APK
        id: policy_step_10
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        working-directory: android
        run: |
          gradle --no-daemon \
            -PaliceBuildNumber=${{ github.run_number }} \
            -PaliceCommitHash=${{ github.sha }} \
            -PaliceVersionName=${GITHUB_REF_NAME#v} \
            :app:assembleRelease

      - name: Verify release APK
        id: policy_step_11
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          EXPECTED_APPLICATION_ID: com.alicepro.mobile
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"

          SIGNER_OUTPUT="$($APKSIGNER verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNER_OUTPUT"
          APK_CERT_SHA256="$(printf '%s\n' "$SIGNER_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          KEYSTORE_CERT_SHA256="$(keytool -list -v \
            -keystore "$ALICE_RELEASE_KEYSTORE_PATH" \
            -storepass "$ALICE_RELEASE_STORE_PASSWORD" \
            -alias "$ALICE_RELEASE_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          test -n "$APK_CERT_SHA256"
          test "$APK_CERT_SHA256" = "$KEYSTORE_CERT_SHA256"

          BADGING="$($AAPT dump badging "$APK" | head -1)"
          printf '%s\n' "$BADGING"
          [[ "$BADGING" == *"name='$EXPECTED_APPLICATION_ID'"* ]]
          [[ "$BADGING" == *"versionCode='$GITHUB_RUN_NUMBER'"* ]]
          [[ "$BADGING" == *"versionName='${GITHUB_REF_NAME#v}'"* ]]

          sha256sum "$APK" | tee "$APK.sha256"
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "version=${GITHUB_REF_NAME#v}"
            echo "commit=$GITHUB_SHA"
            echo "build_number=$GITHUB_RUN_NUMBER"
            echo "apk=$APK"
          } | tee android/release-metadata.txt

      - name: Publish GitHub Release
        id: policy_step_12
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Alice Pro $GITHUB_REF_NAME" \
            --generate-notes \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/apk/release/app-release.apk.sha256 \
            android/release-metadata.txt

      - name: Remove release keystore
        id: policy_step_13
        continue-on-error: true
        if: always()
        run: rm -f "$ALICE_RELEASE_KEYSTORE_PATH"
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
