name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      ALICE_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-signing.keystore
      ALICE_RELEASE_STORE_PASSWORD: ${{ secrets.ALICE_RELEASE_STORE_PASSWORD }}
      ALICE_RELEASE_KEY_ALIAS: ${{ secrets.ALICE_RELEASE_KEY_ALIAS }}
      ALICE_RELEASE_KEY_PASSWORD: ${{ secrets.ALICE_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Stage Python runtime
        working-directory: android
        run: python scripts/stage_python.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "Release tag: $RELEASE_TAG"
          echo "Version: ${RELEASE_TAG#v}"

      - name: Validate release signing secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ALICE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64" || { echo "::error::ALICE_RELEASE_KEYSTORE_BASE64 is not configured."; exit 1; }
          test -n "$ALICE_RELEASE_STORE_PASSWORD" || { echo "::error::ALICE_RELEASE_STORE_PASSWORD is not configured."; exit 1; }
          test -n "$ALICE_RELEASE_KEY_ALIAS" || { echo "::error::ALICE_RELEASE_KEY_ALIAS is not configured."; exit 1; }
          test -n "$ALICE_RELEASE_KEY_PASSWORD" || { echo "::error::ALICE_RELEASE_KEY_PASSWORD is not configured."; exit 1; }

      - name: Materialize release keystore
        env:
          ALICE_RELEASE_KEYSTORE_BASE64: ${{ secrets.ALICE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ALICE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ALICE_RELEASE_KEYSTORE_PATH"
          chmod 600 "$ALICE_RELEASE_KEYSTORE_PATH"
          test -s "$ALICE_RELEASE_KEYSTORE_PATH"
          keytool -list \
            -keystore "$ALICE_RELEASE_KEYSTORE_PATH" \
            -storepass "$ALICE_RELEASE_STORE_PASSWORD" \
            -alias "$ALICE_RELEASE_KEY_ALIAS" >/dev/null

      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build signed release APK
        working-directory: android
        run: |
          gradle --no-daemon \
            -PaliceBuildNumber=${{ github.run_number }} \
            -PaliceCommitHash=${{ github.sha }} \
            -PaliceVersionName=${GITHUB_REF_NAME#v} \
            :app:assembleRelease

      - name: Verify release APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "version=${GITHUB_REF_NAME#v}"
            echo "commit=$GITHUB_SHA"
            echo "build_number=$GITHUB_RUN_NUMBER"
            echo "apk=$APK"
          } | tee android/release-metadata.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Alice Pro $GITHUB_REF_NAME" \
            --generate-notes \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/apk/release/app-release.apk.sha256 \
            android/release-metadata.txt