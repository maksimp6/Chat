name: Redmi 9 browser probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: redmi9
    timeout-minutes: 5
    steps:
      - name: logos
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          probe_dir=$(python -c 'from pathlib import Path; import tempfile; print(Path(tempfile.mkdtemp(prefix=".logos-probe-", dir=".")).resolve())')
          for name in redmi_browser_probe.py redmi_screenshot_capture.py; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/$name" -o "$probe_dir/$name"
          done
          RUNNER_TEMP="$probe_dir" python "$probe_dir/redmi_browser_probe.py"
