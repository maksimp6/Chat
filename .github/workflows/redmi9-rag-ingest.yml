name: redmi9-rag-ingest

# Appends new git commits and new GitHub data (issues, pull requests, comments, Actions runs)
# to the knowledge store through the app's own rag_sync unit (POST /api/rag/sync). The sync
# runs inside the app in the background; this job starts it and follows its state.

on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Remove every stored repository pack first and load the whole history again"
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: redmi9-rag-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: redmi9
    timeout-minutes: 360
    steps:
      - name: Remove the stored repository packs
        if: ${{ inputs.reset }}
        timeout-minutes: 15
        run: |
          set -eu
          curl -fsS --noproxy 127.0.0.1 --max-time 840 -X POST http://127.0.0.1:8080/api/rag/reset
      - name: Start the sync in the app
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          body = json.dumps({"token": os.environ["GH_TOKEN"]}).encode()
          request = urllib.request.Request(
              "http://127.0.0.1:8080/api/rag/sync", data=body, method="POST",
              headers={"Content-Type": "application/json"},
          )
          try:
              with opener.open(request, timeout=60) as response:
                  print(response.read().decode())
          except urllib.error.HTTPError as error:
              print(error.read().decode())
              if error.code != 409:
                  raise
          PY
      - name: Follow the sync
        timeout-minutes: 15
        run: |
          set -eu
          python3 - <<'PY'
          import json, sys, time, urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          deadline = time.time() + 14 * 60
          while True:
              with opener.open("http://127.0.0.1:8080/api/rag/status", timeout=60) as response:
                  status = json.loads(response.read().decode())
              state = status.get("state", {})
              print(json.dumps({"stage": state.get("stage"), "totals": state.get("totals"),
                                "error": state.get("error"), "files": status.get("files")}), flush=True)
              if not state.get("running"):
                  sys.exit(1 if state.get("stage") == "failed" else 0)
              if time.time() > deadline:
                  print("the sync goes on in the app; run this workflow again to follow it")
                  sys.exit(0)
              time.sleep(30)
          PY
