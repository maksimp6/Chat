name: Cloud.ru check (read-only)

on:
  workflow_dispatch:
    inputs:
      check:
        description: What to check. Read-only; no secret value is ever read or printed
        type: choice
        options: [all, auth, containers, registries, secrets]
        default: all
      secret_id:
        description: Secret Management secret ID for the secrets check (metadata of versions only)
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: alice-cloudru-check
  cancel-in-progress: false

jobs:
  check:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Cloud.ru
        env:
          CHECK: ${{ inputs.check }}
          CHECK_SECRET_ID: ${{ inputs.secret_id }}
          CLOUDRU_PROJECT_ID: ${{ vars.CLOUDRU_PROJECT_ID }}
          CLOUDRU_IAM_KEY_ID: ${{ secrets.CLOUDRU_IAM_KEY_ID }}
          CLOUDRU_IAM_KEY_SECRET: ${{ secrets.CLOUDRU_IAM_KEY_SECRET }}
          # Optional viewer-scoped pair for the secrets check (see cloud/cloudru/secret_management.py).
          CLOUDRU_SECRET_MANAGEMENT_KEY_ID: ${{ secrets.CLOUDRU_SECRET_MANAGEMENT_KEY_ID }}
          CLOUDRU_SECRET_MANAGEMENT_KEY_SECRET: ${{ secrets.CLOUDRU_SECRET_MANAGEMENT_KEY_SECRET }}
        run: python scripts/cloudru_check.py "$CHECK"
