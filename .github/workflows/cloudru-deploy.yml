name: Cloud.ru Container Apps deployment

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: master
        type: string
      action:
        description: What to do
        required: true
        default: deploy
        type: choice
        options:
          - preflight
          - deploy
          - status
          - inventory
          - estimate

concurrency:
  group: alice-cloudru
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cloudru:
    name: Cloud.ru ${{ inputs.action }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDRU_PROJECT_ID: ${{ vars.CLOUDRU_PROJECT_ID }}
      CLOUDRU_REGISTRY_NAME: ${{ vars.CLOUDRU_REGISTRY_NAME || 'alice-pro' }}
      CLOUDRU_REPOSITORY_NAME: ${{ vars.CLOUDRU_REPOSITORY_NAME || 'alice-pro' }}
      CLOUDRU_CONTAINER_NAME: ${{ vars.CLOUDRU_CONTAINER_NAME || 'alice-pro' }}
      CLOUDRU_CONTAINER_CPU: ${{ vars.CLOUDRU_CONTAINER_CPU || '0.5' }}
      CLOUDRU_MIN_INSTANCES: ${{ vars.CLOUDRU_MIN_INSTANCES || '0' }}
      CLOUDRU_MAX_INSTANCES: ${{ vars.CLOUDRU_MAX_INSTANCES || '1' }}
    steps:
      - name: Check out ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Require a commit on master
        run: |
          # Only reviewed code that has landed on master may run, before anything is
          # installed or any secret is in scope.
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - name: Validate configuration
        if: inputs.action != 'estimate'
        env:
          CLOUDRU_IAM_KEY_ID: ${{ secrets.CLOUDRU_IAM_KEY_ID }}
          CLOUDRU_IAM_KEY_SECRET: ${{ secrets.CLOUDRU_IAM_KEY_SECRET }}
          ALICE_SHORT_TOKEN: ${{ secrets.ALICE_SHORT_TOKEN }}
          ALICE_DATABASE_URL: ${{ secrets.ALICE_DATABASE_URL }}
          ALICE_GITHUB_CLIENT_ID: ${{ secrets.ALICE_GITHUB_CLIENT_ID }}
          ALICE_GITHUB_CLIENT_SECRET: ${{ secrets.ALICE_GITHUB_CLIENT_SECRET }}
          ACTION: ${{ inputs.action }}
        run: |
          required=(CLOUDRU_IAM_KEY_ID CLOUDRU_IAM_KEY_SECRET CLOUDRU_PROJECT_ID)
          if [ "$ACTION" = deploy ] || [ "$ACTION" = preflight ]; then
            required+=(ALICE_SHORT_TOKEN ALICE_DATABASE_URL ALICE_GITHUB_CLIENT_ID ALICE_GITHUB_CLIENT_SECRET)
          fi
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing deployment configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          if [ "$ACTION" = deploy ] || [ "$ACTION" = preflight ]; then
            case "$ALICE_DATABASE_URL" in
              postgres://*|postgresql://*) ;;
              *) echo '::error::ALICE_DATABASE_URL must select durable PostgreSQL'; exit 1 ;;
            esac
          fi
          echo 'Configuration validated; no secret values displayed.'
      - name: Set up Python
        if: inputs.action != 'preflight'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        if: inputs.action != 'preflight'
        run: pip install -r requirements.txt -r requirements-postgres.txt
      - name: Deploy
        if: inputs.action == 'deploy'
        env:
          CLOUDRU_IAM_KEY_ID: ${{ secrets.CLOUDRU_IAM_KEY_ID }}
          CLOUDRU_IAM_KEY_SECRET: ${{ secrets.CLOUDRU_IAM_KEY_SECRET }}
          ALICE_REQUIRE_SHORT_TOKEN: "1"
          ALICE_SHORT_TOKEN: ${{ secrets.ALICE_SHORT_TOKEN }}
          ALICE_PROVIDER_CREDENTIAL_KEY: ${{ secrets.ALICE_PROVIDER_CREDENTIAL_KEY }}
          ALICE_DATABASE_URL: ${{ secrets.ALICE_DATABASE_URL }}
          ALICE_GITHUB_CLIENT_ID: ${{ secrets.ALICE_GITHUB_CLIENT_ID }}
          ALICE_GITHUB_CLIENT_SECRET: ${{ secrets.ALICE_GITHUB_CLIENT_SECRET }}
          ALICE_GITHUB_ALLOWED_IDS: ${{ vars.ALICE_GITHUB_ALLOWED_IDS || '293531601' }}
        run: |
          # Pass only the app variables that are configured, by name; values never hit the log.
          env_args=(--env ALICE_REQUIRE_SHORT_TOKEN --env ALICE_SHORT_TOKEN --env ALICE_DATABASE_URL)
          env_args+=(--env ALICE_GITHUB_CLIENT_ID --env ALICE_GITHUB_CLIENT_SECRET --env ALICE_GITHUB_ALLOWED_IDS)
          for name in ALICE_PROVIDER_CREDENTIAL_KEY; do
            if [ -n "${!name}" ]; then env_args+=(--env "$name"); else unset "$name"; fi
          done
          set -o pipefail
          python scripts/cloudru_deploy.py deploy --tag "$(git rev-parse HEAD)" "${env_args[@]}" | tee deploy.json
          {
            echo '### Cloud.ru deploy'
            echo '```json'
            cat deploy.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Status
        if: inputs.action == 'status'
        env:
          CLOUDRU_IAM_KEY_ID: ${{ secrets.CLOUDRU_IAM_KEY_ID }}
          CLOUDRU_IAM_KEY_SECRET: ${{ secrets.CLOUDRU_IAM_KEY_SECRET }}
        run: python scripts/cloudru_deploy.py status
      - name: Estimate
        if: inputs.action == 'estimate'
        run: python scripts/cloudru_deploy.py estimate
      - name: Inventory
        if: inputs.action == 'inventory'
        env:
          CLOUDRU_IAM_KEY_ID: ${{ secrets.CLOUDRU_IAM_KEY_ID }}
          CLOUDRU_IAM_KEY_SECRET: ${{ secrets.CLOUDRU_IAM_KEY_SECRET }}
        run: timeout 30s python scripts/cloudru_deploy.py inventory
