name: Cloud.ru Workflow Studio deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      action:
        description: Cloud.ru Services operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - status
          - preflight
      ref:
        description: Cloud.ru source branch (production is locked to master)
        required: true
        default: master
        type: choice
        options:
          - master

concurrency:
  group: alice-cloudru
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cloudru:
    name: Cloud.ru Services
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDRU_PROJECT_ID: ${{ vars.CLOUDRU_PROJECT_ID }}
      CLOUDRU_WORKFLOW_API_URL: ${{ vars.CLOUDRU_WORKFLOW_API_URL || 'https://pipeline.cloud.ru/public-api/v1' }}
      CLOUDRU_WORKFLOW_APP_ID: ${{ vars.CLOUDRU_WORKFLOW_APP_ID }}
      CLOUDRU_WORKFLOW_API_KEY: ${{ secrets.CLOUDRU_WORKFLOW_API_KEY }}
      ACTION: ${{ github.event_name == 'push' && 'deploy' || inputs.action }}
      DEPLOY_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
    steps:
      - name: Validate configuration
        id: configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in CLOUDRU_PROJECT_ID CLOUDRU_WORKFLOW_APP_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "$ACTION" != preflight ] && [ -z "${CLOUDRU_WORKFLOW_API_KEY:-}" ]; then
            missing+=(CLOUDRU_WORKFLOW_API_KEY)
          fi

          if [ "$DEPLOY_REF" != master ]; then
            echo '::error::Cloud.ru production source is locked to master.'
            exit 1
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "${GITHUB_EVENT_NAME}" = push ]; then
              printf '::warning::Cloud.ru Workflow Studio is not configured; skipped deployment. Missing: %s\n' "${missing[*]}"
              echo 'configured=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '::error::Missing Cloud.ru Workflow Studio configuration: %s\n' "${missing[*]}"
            exit 1
          fi

          echo 'configured=true' >> "$GITHUB_OUTPUT"
          echo 'Cloud.ru configuration validated; no secret values displayed.'

      - name: Call Cloud.ru Services
        if: steps.configuration.outputs.configured == 'true' && env.ACTION != 'preflight'
        shell: bash
        run: |
          set -euo pipefail

          base_url="${CLOUDRU_WORKFLOW_API_URL%/}/project/${CLOUDRU_PROJECT_ID}/application/${CLOUDRU_WORKFLOW_APP_ID}"
          curl_args=(
            --fail-with-body
            --silent
            --show-error
            --request
          )

          case "$ACTION" in
            deploy)
              curl_args+=(POST "$base_url/deployment")
              curl_args+=(--header 'Content-Type: application/json' --data '{}')
              ;;
            status)
              curl_args+=(GET "$base_url")
              ;;
            *)
              echo "::error::Unsupported Cloud.ru operation: $ACTION"
              exit 1
              ;;
          esac

          curl_args+=(
            --header "X-API-KEY: ${CLOUDRU_WORKFLOW_API_KEY}"
            --header 'Accept: application/json'
          )
          "${curl_args[@]}" | tee cloudru-services.json

          {
            echo '### Cloud.ru Workflow Studio'
            echo "Operation: $ACTION"
            echo "Source: public GitHub repository, branch $DEPLOY_REF"
            echo '```json'
            cat cloudru-services.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
