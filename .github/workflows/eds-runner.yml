name: EDS runner check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify EDS installation and credentials
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 2
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Checkout trusted runner code
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified EDS CLI
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          timeout 30s python scripts/install_eds.py --bin-dir "$RUNNER_TEMP/eds-bin"
          echo "$RUNNER_TEMP/eds-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/eds-bin/eds" version

      - name: Check Repo access without publishing API output
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          EDS_API_KEY: ${{ secrets.EDS_API_KEY }}
          EDS_PROJECT_ID: ${{ secrets.EDS_PROJECT_ID || vars.CLOUDRU_PROJECT_ID }}
          EDS_REPO_API_URL: https://devtools.api.cloud.ru/repo/api/v1
        run: |
          if [[ -z "$EDS_API_KEY" || -z "$EDS_PROJECT_ID" ]]; then
            echo 'Missing EDS_API_KEY or EDS_PROJECT_ID in production secrets.'
            exit 1
          fi
          if timeout 30s eds repo list --limit 1 --offset 0 --json >/dev/null 2>&1; then
            echo 'EDS Repo access verified.'
          else
            echo 'EDS Repo access failed or exceeded 30 seconds; check credentials and network.'
            exit 1
          fi
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
