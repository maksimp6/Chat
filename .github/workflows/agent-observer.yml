name: Agent observer

# Watches the agent office (Claude, Codex, Copilot, Logos) every hour: builds a
# thread per issue and pull request and flags stuck work. The digest replaces
# the body of the open issue labelled "agent-observer" (created on first run)
# and is shown in the run summary. It reads GitHub and edits only that issue;
# it never comments, mentions agents, pushes, or merges.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-observer
  cancel-in-progress: true

jobs:
  observe:
    name: Build agent threads and digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Observe the agent office
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m agent_office.observer --repo "$GITHUB_REPOSITORY" --publish --json-out agent-observer.json > /dev/null
      - name: Save threads as JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-observer
          path: agent-observer.json
          if-no-files-found: ignore
          retention-days: 7
