name: Format

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format:
    name: Auto-format repository
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.sha != null &&
      github.event.pull_request.head.label != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - name: Stop on formatter commit
        id: guard
        run: |
          message="$(git log -1 --pretty=%s)"
          if [ "$message" = "style: auto-format repository" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        if: steps.guard.outputs.skip != 'true'
        run: python -m pip install --upgrade ruff
      - name: Format sources
        if: steps.guard.outputs.skip != 'true'
        run: bash scripts/format.sh write
      - name: Build formatting artifact
        if: steps.guard.outputs.skip != 'true'
        id: artifact
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --name-only -z > formatted-files.zlist
          tar --null -T formatted-files.zlist -czf formatted-files.tar.gz
          git diff --binary > formatted.patch
      - name: Upload formatting artifact
        if: steps.artifact.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: formatted-sources-${{ github.event.pull_request.head.sha }}
          path: |
            formatted-files.tar.gz
            formatted.patch
          if-no-files-found: error
