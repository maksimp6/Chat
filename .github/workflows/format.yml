name: Format

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    name: Auto-format repository
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Check whether formatter already produced this HEAD
        id: guard
        run: |
          message="$(git log -1 --pretty=%s)"
          if [ "$message" = "style: auto-format repository" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Format sources
        if: steps.guard.outputs.skip != 'true'
        run: bash scripts/format.sh write
      - name: Commit formatting changes
        if: steps.guard.outputs.skip != 'true'
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-format repository"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
