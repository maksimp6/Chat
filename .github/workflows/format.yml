name: Format

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto-format repository
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.sha != null &&
      github.event.pull_request.head.label != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - name: Stop on formatter commit
        id: guard
        run: |
          message="$(git log -1 --pretty=%s)"
          if [ "$message" = "style: auto-format repository" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install Ruff
        if: steps.guard.outputs.skip != 'true'
        run: python -m pip install --upgrade ruff
      - name: Format sources
        if: steps.guard.outputs.skip != 'true'
        run: bash scripts/format.sh write
      - name: Build formatting artifact
        if: steps.guard.outputs.skip != 'true'
        id: artifact
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --name-only -z > formatted-files.zlist
          tar --null -T formatted-files.zlist -czf formatted-files.tar.gz
          git diff --binary > formatted.patch
      - name: Upload formatting artifact
        if: steps.artifact.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formatted-sources-${{ github.event.pull_request.head.sha }}
          path: |
            formatted-files.tar.gz
            formatted.patch
          if-no-files-found: error
