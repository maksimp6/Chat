name: Codex bootstrap smoke

on:
  push:
    branches: [master]
    paths:
      - "scripts/codex_setup.sh"
      - "scripts/codex_maintenance.sh"
      - "scripts/install_cloud_cli.sh"
      - ".github/workflows/codex-bootstrap-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-bootstrap:
    name: Codex-like bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up Node 22.22.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"

      - name: Set up Ruby 3.4.4
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4.4"

      - name: Set up Go 1.25.1
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.1"

      - name: Set up Bun 1.2.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.14"

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: "8.5"
          coverage: none

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Swift 6.2
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Set up Rust 1.95.0
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Set up GitHub CLI 2.96.0
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl --fail --location --retry 3 \
            "https://github.com/cli/cli/releases/download/v2.96.0/gh_2.96.0_linux_amd64.tar.gz" \
            -o "$tmp/gh.tar.gz"
          tar -xzf "$tmp/gh.tar.gz" -C "$tmp"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$tmp/gh_2.96.0_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codex runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python --version | grep -q '3.14'
          node --version | grep -q '^v22\.22\.2$'
          ruby --version | grep -q 'ruby 3.4.4'
          rustc --version | grep -q '^rustc 1\.95\.0 '
          go version | grep -q 'go1.25.1'
          bun --version | grep -q '^1\.2\.14$'
          php --version | head -1 | grep -q 'PHP 8.5'
          java -version 2>&1 | head -1 | grep -q '"25'
          swift --version | grep -q 'Swift version 6.2'
          gh --version | head -1 | grep -q 'gh version 2.96.0'

      - name: Match Codex checkout state
        shell: bash
        run: |
          set -euo pipefail
          git remote remove origin
          ! git remote get-url origin

      - name: Run Codex setup exactly as configured
        shell: bash
        run: bash scripts/codex_setup.sh

      - name: Run Codex maintenance exactly as configured
        shell: bash
        run: bash scripts/codex_maintenance.sh
