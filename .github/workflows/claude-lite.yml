name: Claude Lite

# Claude is a task executor. Copilot handles automatic PR review.
# Claude Lite runs only on explicit "@claude-lite" task mentions in issue/PR conversation comments
# or issue descriptions/titles.
# Only repository members with write access can trigger it (OWNER/MEMBER/
# COLLABORATOR); claude-code-action additionally verifies write permission.
#
# Required repository secret (Settings -> Secrets and variables -> Actions),
# set exactly one of:
#   CLAUDE_CODE_OAUTH_TOKEN  - from `claude setup-token` (Claude subscription)
#   ANTHROPIC_API_KEY        - Anthropic API key
# The Claude GitHub App must be installed on this repository:
#   https://github.com/apps/claude

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions: {}

jobs:
  claude:
    name: Respond to @claude-lite
    concurrency:
      group: claude-lite-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    environment: production
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude-lite') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude-lite') || contains(github.event.issue.title, '@claude-lite')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push branches with Claude's changes
      pull-requests: write # comment on and open pull requests
      issues: write # reply in issue threads
      id-token: write # OIDC exchange for the Claude GitHub App token
      actions: read # read CI results on pull requests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Guard keyed dispatch idempotency
        id: dispatch_guard
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REPO: ${{ github.repository }}
          DISPATCH_ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
          DISPATCH_COMMENT_ID: ${{ github.event.comment.id || 0 }}
          DISPATCH_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || github.event.issue.author_association || '' }}
          DISPATCH_BODY: ${{ github.event.comment.body || github.event.issue.body || github.event.issue.title || '' }}
        run: python scripts/claude_dispatch_guard.py

      - name: Record skipped keyed dispatch
        if: steps.dispatch_guard.outputs.should_run != 'true'
        env:
          SKIP_REASON: ${{ steps.dispatch_guard.outputs.reason }}
          DISPATCH_KEY: ${{ steps.dispatch_guard.outputs.dispatch_key }}
        run: |
          printf 'Claude dispatch skipped: %s\n' "$SKIP_REASON" >> "$GITHUB_STEP_SUMMARY"
          printf 'Dispatch key: %s\n' "$DISPATCH_KEY" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude Code
        if: steps.dispatch_guard.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude-lite"
          track_progress: true
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 45
            --allowedTools "Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(pytest:*),Bash(python:*),Bash(bash scripts/format.sh:*)"
