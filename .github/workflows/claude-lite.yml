name: Claude Lite

# Claude is a task executor. Copilot handles automatic PR review.
# Claude Lite runs only on explicit "@claude-lite" task mentions in issue/PR conversation comments
# or issue descriptions/titles.
# Only repository members with write access can trigger it (OWNER/MEMBER/
# COLLABORATOR); claude-code-action additionally verifies write permission.
#
# Required repository secret (Settings -> Secrets and variables -> Actions),
# set exactly one of:
#   CLAUDE_CODE_OAUTH_TOKEN  - from `claude setup-token` (Claude subscription)
#   ANTHROPIC_API_KEY        - Anthropic API key
# The Claude GitHub App must be installed on this repository:
#   https://github.com/apps/claude

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions: {}

jobs:
  claude:
    name: Respond to @claude-lite
    concurrency:
      group: claude-lite-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    environment: production
    if: |
      !contains(github.event.issue.labels.*.name, 'claude-session') &&
      !contains(github.event.comment.body, '@claude-lite session') &&
      !contains(github.event.issue.body, '@claude-lite session') &&
      !contains(github.event.issue.title, '@claude-lite session') &&
      ((github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude-lite') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude-lite') || contains(github.event.issue.title, '@claude-lite')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push branches with Claude's changes
      pull-requests: write # comment on and open pull requests
      issues: write # reply in issue threads
      id-token: write # OIDC exchange for the Claude GitHub App token
      actions: read # read CI results on pull requests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dialogue routing dependencies
        run: python -m pip install 'cryptography==50.0.1' 'requests==2.34.2'

      - name: Recheck live dialogue routing before the legacy worker
        id: routing
        if: github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/claude_session_ci.py check --metadata "$RUNNER_TEMP/claude-session/metadata.json"

      - name: Install verified EDS CLI
        if: steps.routing.outputs.eligible != 'true'
        run: |
          timeout 30s python scripts/install_eds.py --bin-dir "$RUNNER_TEMP/eds-bin"
          echo "$RUNNER_TEMP/eds-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/eds-bin/eds" version

      - name: Run Claude Code
        if: steps.routing.outputs.eligible != 'true'
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude-lite"
          track_progress: true
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 45
            --allowedTools "Edit,Write,WebFetch,WebSearch,Bash(git status:*),Bash(git diff:*),Bash(pytest:*),Bash(python:*),Bash(bash scripts/format.sh:*)"

  dialogue:
    name: Resume private Claude dialogue
    if: |
      github.event_name == 'issue_comment' &&
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    concurrency:
      group: claude-lite-session-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout trusted runner control code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checkpoint transport dependencies
        run: python -m pip install 'cryptography==50.0.1' 'requests==2.34.2'

      - name: Check dialogue routing without a model call
        id: routing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/claude_session_ci.py check --metadata "$RUNNER_TEMP/claude-session/metadata.json"

      - name: Install pinned native Claude CLI
        if: steps.routing.outputs.eligible == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/claude-cli"
          cp .github/claude-cli/package.json .github/claude-cli/package-lock.json "$RUNNER_TEMP/claude-cli/"
          npm ci --prefix "$RUNNER_TEMP/claude-cli" --ignore-scripts --no-audit --no-fund
          node "$RUNNER_TEMP/claude-cli/node_modules/@anthropic-ai/claude-code/install.cjs"
          echo "$RUNNER_TEMP/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Restore native session and process authorized dialogue
        if: steps.routing.outputs.eligible == 'true'
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/claude_session_ci.py prepare --metadata "$RUNNER_TEMP/claude-session/metadata.json"

      - name: Upload only authenticated ciphertext
        if: steps.prepare.outputs.ready == 'true'
        id: checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ steps.prepare.outputs.checkpoint_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Commit checkpoint before publishing dialogue answer
        if: steps.prepare.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKPOINT_ARTIFACT_ID: ${{ steps.checkpoint.outputs.artifact-id }}
        run: python scripts/claude_session_ci.py finalize --metadata "$RUNNER_TEMP/claude-session/metadata.json" --artifact-id "$CHECKPOINT_ARTIFACT_ID"
