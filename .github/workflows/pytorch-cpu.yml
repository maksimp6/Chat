name: PyTorch CPU integration

on:
  push:
    branches: [master]
    paths:
      - pytorch_adapter.py
      - requirements-pytorch-cpu.txt
      - tests/pytorch_cpu_integration.py
  pull_request:
    paths:
      - pytorch_adapter.py
      - requirements-pytorch-cpu.txt
      - tests/pytorch_cpu_integration.py

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytorch-cpu:
    name: Real CPU tensor smoke (Python 3.14)
    runs-on: ubuntu-latest
    env:
      YANDEX_API_KEY: ci-test-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-pytorch-cpu.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install CPU-only PyTorch (pinned)
        run: |
          pip install -r requirements-pytorch-cpu.txt
          echo "--- torch install ---"
          pip show torch

      - name: Verify CPU-only wheel (no CUDA)
        run: |
          python - <<'EOF'
          import torch, sys
          assert torch.version.cuda is None, f"Expected CPU-only wheel; got cuda={torch.version.cuda}"
          print(f"torch {torch.__version__} verified CPU-only on Python {sys.version}")
          EOF

      - name: Run real CPU integration test (explicit, no skip)
        run: python -m pytest -q tests/pytorch_cpu_integration.py
