name: Alice A1 mini PLA cube slicer

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/alice-a1mini-pla-cube.yml"
      - "scripts/alice_a1mini_pla_cube_slice.py"
      - "scripts/alice_a1mini_bagclip_slice.py"
      - "scripts/alice_a1mini_preview.py"
      - "tests/test_a1mini_preview.py"
      - "tests/test_a1mini_slicer_validation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alice-a1mini-pla-cube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slice-pla-cube:
    name: A1 mini Generic PLA verified G-code
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate A1 mini slicer and preview contracts offline
        run: python3 -m unittest discover -s tests -p "test_a1mini_*.py" -v

      - name: Install Bambu Studio native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            libgstreamer-gl1.0-0 libegl1
          python3 -V

      - name: Download and verify official Bambu Studio CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/bambulab/BambuStudio/releases/download/v02.08.02.61/BambuStudio_ubuntu22.04-v02.08.02.61-20260820225108.AppImage' \
            --output BambuStudio.AppImage
          printf '%s  %s\n' \
            '69426a59682574591590f51c913d3889baa19252d1c8e9fcae2497eb0ed6bf92' \
            'BambuStudio.AppImage' | sha256sum --check
          chmod +x BambuStudio.AppImage
          ./BambuStudio.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/bin/bambu-studio
          LD_LIBRARY_PATH="$PWD/squashfs-root/bin" \
            ldd squashfs-root/bin/bambu-studio | tee /tmp/alice_bambu_dependencies.txt
          if grep -q 'not found' /tmp/alice_bambu_dependencies.txt; then
            echo 'Bambu Studio dependencies are missing' >&2
            exit 1
          fi

      - name: Generate real sliced Generic PLA 3MF
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/alice_a1mini_pla_cube_slice.py
          python3 scripts/alice_a1mini_pla_cube_slice.py \
            --slicer-root "$GITHUB_WORKSPACE/squashfs-root" \
            --output-dir "$GITHUB_WORKSPACE/out"
          test -s out/Alice_Cube_20mm_Generic_PLA_A1mini.gcode.3mf
          sha256sum out/Alice_Cube_20mm_Generic_PLA_A1mini.gcode.3mf
          cat out/audit.json

      - name: Upload ready-to-stage sliced job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alice-a1mini-pla-cube-ready
          path: |
            out/Alice_Cube_20mm_Generic_PLA_A1mini.gcode.3mf
            out/audit.json
            out/preview.png
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: Fetch hash-pinned source-only bag clip from reviewed PR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-bag
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/maksimp6/Chat/f6b75493921b8e9b68e207216abca22e8df6340d/3d-models/bag-clip/bag_clip_plate.3mf' \
            --output out-bag/bagclip_source.3mf
          printf '%s  %s\n' \
            '6c3005537a4b5bdd25bad2e4d9c29f9c858869b02884cf6c52fe907269a267d1' \
            'out-bag/bagclip_source.3mf' | sha256sum --check

      - name: Slice reviewed bag clip as PLA dimensional prototype
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/alice_a1mini_bagclip_slice.py
          python3 scripts/alice_a1mini_bagclip_slice.py \
            --source-3mf "$GITHUB_WORKSPACE/out-bag/bagclip_source.3mf" \
            --slicer-root "$GITHUB_WORKSPACE/squashfs-root" \
            --output-dir "$GITHUB_WORKSPACE/out-bag"
          test -s out-bag/Alice_BagClip_PR1113_A1mini_PLA_PROTOTYPE.gcode.3mf
          sha256sum out-bag/Alice_BagClip_PR1113_A1mini_PLA_PROTOTYPE.gcode.3mf
          cat out-bag/bagclip_audit.json

      - name: Upload single verified bag clip sliced job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alice-a1mini-bagclip-pla-prototype-ready
          path: |
            out-bag/Alice_BagClip_PR1113_A1mini_PLA_PROTOTYPE.gcode.3mf
            out-bag/bagclip_audit.json
            out-bag/preview.png
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
