name: Build Alice CI image

on:
  push:
    branches: [master]
    paths:
      - deploy/ci/Dockerfile
      - requirements.txt
      - requirements-dev.txt
      - package.json
      - scripts/ci_environment_hash.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: alice-ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build reusable CI environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute content tag
        id: tag
        run: echo "value=$(python scripts/ci_environment_hash.py)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Build and publish immutable CI image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: deploy/ci/Dockerfile
          push: true
          tags: ghcr.io/maksimp6/chat/alice-ci:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=alice-ci-image
          cache-to: type=gha,mode=max,scope=alice-ci-image

      - name: Publish image reference
        run: |
          echo "alice-ci image: ghcr.io/maksimp6/chat/alice-ci:${{ steps.tag.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
