name: Build Alice CI image

on:
  push:
    branches: [master]
    paths:
      - deploy/ci/Dockerfile
      - requirements.txt
      - requirements-dev.txt
      - package.json
      - scripts/ci_environment_hash.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: alice-ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build reusable CI environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute content tag
        id: tag
        run: echo "value=$(python scripts/ci_environment_hash.py)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520815ddf1882f8eb1b7b2dcf1d6e # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42a23c18d0c1e7c8cbb93c8a2c87b2 # v3.11.1

      - name: Build and publish immutable CI image
        uses: docker/build-push-action@10e90e3645ea8e3c7f7f64f6b8f9b594a4e2c25c # v6.18.0
        with:
          context: .
          file: deploy/ci/Dockerfile
          push: true
          tags: ghcr.io/maksimp6/chat/alice-ci:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=alice-ci-image
          cache-to: type=gha,mode=max,scope=alice-ci-image

      - name: Publish image reference
        env:
          CI_IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          echo "alice-ci image: ghcr.io/maksimp6/chat/alice-ci:$CI_IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
