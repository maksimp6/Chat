jobs:
  candidate_tools:
    if: github.ref == 'refs/heads/fix/tools-execution-evidence'
    runs-on: redmi9
    timeout-minutes: 15
    steps:
      - name: Candidate status regression and real browser tool evidence
        shell: bash
        timeout-minutes: 15
        env:
          CI: 'true'
          LOGOS_REPLAY_RUN: ''
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/redmi_media_ram.sh" -o "$GITHUB_WORKSPACE/redmi_media_ram.sh"
          # Media goes only to a fixed-size RAM disk: never to flash, wiped on exit.
          media_ram=$(bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" mount)
          trap 'cd "$GITHUB_WORKSPACE"; bash "$GITHUB_WORKSPACE/redmi_media_ram.sh" umount' EXIT
          candidate_temp=$(mktemp -d "$media_ram/candidate-tools.XXXXXX")
          export RUNNER_TEMP="$candidate_temp"
          export TMPDIR="$candidate_temp"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/redmi_candidate_tools_check.py" \
            -o "$candidate_temp/redmi_candidate_tools_check.py"
          python "$candidate_temp/redmi_candidate_tools_check.py"
