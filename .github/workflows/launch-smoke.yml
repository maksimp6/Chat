name: Local launch smoke

on:
  pull_request:
  workflow_dispatch:
    inputs:
      live_provider:
        description: "Run the real Yandex provider/chat/trace smoke on protected master"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: launch-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline startup and restart smoke
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/ci-out/launch-smoke
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Checkout
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          started=$SECONDS
          pip install -r requirements.txt
          echo "- Runtime dependency install: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run deterministic offline launch smoke
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          out="$(realpath -m "$EVIDENCE_DIR/launch-smoke.json")"
          case "$out" in *..*) echo "::error::path traversal refused: $out"; exit 1;; esac
          case "$out" in "$RUNNER_TEMP"/ci-out/*) ;; *) echo "::error::output outside ci-out: $out"; exit 1;; esac
          python scripts/local_launch_smoke.py --offline | tee "$out"
      - name: Workspace must stay clean
        id: policy_step_06
        continue-on-error: true
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::workflow left files in the checkout:"; git status --porcelain; exit 1
          fi
      - name: Upload smoke evidence
        id: policy_step_05
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-launch-smoke-${{ github.run_number }}
          path: ${{ env.EVIDENCE_DIR }}/launch-smoke.json
          if-no-files-found: warn
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

  live-provider:
    name: Live Yandex chat and persisted trace smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_provider }}
    runs-on: ubuntu-latest
    # 1 минута задана вручную: замера прогона нет
    timeout-minutes: 1
    environment: production
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/ci-out/launch-smoke
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Enforce native Logos court hold
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          printf '%s\n' 'Native Logos live testing is held by https://github.com/maksimp6/Chat/issues/1413#issuecomment-6366889282; offline smoke remains available.'
          exit 1
      - name: Checkout protected master
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        id: policy_step_06
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          started=$SECONDS
          pip install -r requirements.txt
          echo "- Runtime dependency install: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run full protected-master launch smoke
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          ALICE_LAUNCH_SMOKE_YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          ALICE_LAUNCH_SMOKE_YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          out="$(realpath -m "$EVIDENCE_DIR/launch-smoke.json")"
          case "$out" in *..*) echo "::error::path traversal refused: $out"; exit 1;; esac
          case "$out" in "$RUNNER_TEMP"/ci-out/*) ;; *) echo "::error::output outside ci-out: $out"; exit 1;; esac
          python scripts/local_launch_smoke.py --require-master | tee "$out"
      - name: Workspace must stay clean
        id: policy_step_07
        continue-on-error: true
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::workflow left files in the checkout:"; git status --porcelain; exit 1
          fi
      - name: Upload smoke evidence
        id: policy_step_05
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-launch-smoke-${{ github.run_number }}
          path: ${{ env.EVIDENCE_DIR }}/launch-smoke.json
          if-no-files-found: warn
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
