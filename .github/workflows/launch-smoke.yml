name: Local launch smoke

on:
  pull_request:
    paths:
      - "scripts/local_launch_smoke.py"
      - "tests/test_local_launch_smoke.py"
      - "docs/setup/launch-smoke.md"
      - ".github/workflows/launch-smoke.yml"
  workflow_dispatch:
    inputs:
      live_provider:
        description: "Run the real Yandex provider/chat/trace smoke on protected master"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: launch-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline startup and restart smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run deterministic offline launch smoke
        run: |
          set -euo pipefail
          python scripts/local_launch_smoke.py --offline | tee launch-smoke.json
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-launch-smoke-${{ github.run_number }}
          path: launch-smoke.json
          if-no-files-found: warn

  live-provider:
    name: Live Yandex chat and persisted trace smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_provider }}
    runs-on: ubuntu-latest
    environment: production
    env:
      ALICE_LAUNCH_SMOKE_YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      ALICE_LAUNCH_SMOKE_YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
    steps:
      - name: Checkout protected master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full protected-master launch smoke
        run: |
          set -euo pipefail
          python scripts/local_launch_smoke.py --require-master | tee launch-smoke.json
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-launch-smoke-${{ github.run_number }}
          path: launch-smoke.json
          if-no-files-found: warn
