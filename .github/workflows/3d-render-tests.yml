name: 3D render contract

on:
  pull_request:
    paths:
      - printing3d/models/**
      - scripts/render_3d_preview.py
      - scripts/publish_3d_previews.py
      - scripts/validation/render_preview_contract.py
      - .github/workflows/3d-pr-previews.yml
      - .github/workflows/3d-render-tests.yml
  push:
    branches: [master]
    paths:
      - scripts/render_3d_preview.py
      - scripts/publish_3d_previews.py
      - scripts/validation/render_preview_contract.py

permissions:
  contents: read

jobs:
  contract:
    name: Render real geometry and verify safe PR publication
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install pinned preview testing dependencies
        run: python -m pip install --disable-pip-version-check --no-input Pillow==12.3.0 pytest==9.1.1 ruff==0.16.9
      - name: Check format and static issues
        run: |
          python -m ruff format --check scripts/render_3d_preview.py scripts/publish_3d_previews.py scripts/validation/render_preview_contract.py
          python -m ruff check scripts/render_3d_preview.py scripts/publish_3d_previews.py scripts/validation/render_preview_contract.py
      - name: Run independent renderer/issuer regressions
        run: python -m pytest -q -p no:cacheprovider scripts/validation/render_preview_contract.py
