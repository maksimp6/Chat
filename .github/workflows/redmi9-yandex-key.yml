name: Redmi 9 issue model key

on:
  workflow_dispatch:
  push:
    branches: [feat/redmi-yandex-key-issuance]
    paths:
      - scripts/redmi_issue_yandex_key.py
      - scripts/redmi_issue_yandex_key.sh
      - .github/workflows/redmi9-yandex-key.yml

permissions: {}

jobs:
  issue:
    runs-on: redmi9
    timeout-minutes: 3
    steps:
      - name: logos
        shell: bash
        env:
          YANDEX_IAM_TOKEN: ${{ secrets.YANDEX_IAM_TOKEN }}
          YANDEX_SERVICE_ACCOUNT_ID: ${{ secrets.YANDEX_SERVICE_ACCOUNT_ID }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          LOGOS_PROVIDER_CREDENTIALS_TOKEN: ${{ secrets.LOGOS_PROVIDER_CREDENTIALS_TOKEN }}
        run: |
          mkdir -p scripts
          for name in redmi_issue_yandex_key.py redmi_issue_yandex_key.sh; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/$name" -o "scripts/$name"
          done
          bash scripts/redmi_issue_yandex_key.sh
