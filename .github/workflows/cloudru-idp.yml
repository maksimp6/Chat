name: Cloud.ru Alice OAuth IdP

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy or inspect the central OAuth identity provider on its Container Apps origin
        type: choice
        options: [preflight, deploy, status, stop]
        default: preflight
      lane:
        description: production (reviewed master only, GitHub sign-in) or test (any branch, separate container, passphrase sign-in)
        type: choice
        options: [production, test]
        default: production
      public_url:
        description: Issuer origin on the owner's domain (https://oauth.example); empty uses the container's own origin
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: alice-cloudru-idp-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  idp:
    if: github.ref == 'refs/heads/master' || inputs.lane == 'test'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require reviewed master commit
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') && (inputs.lane != 'test') }}
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        with:
          python-version-file: .python-version
      - name: Install dependencies
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: pip install -r requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: policy_step_05
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') && (inputs.action == 'deploy') }}
        with:
          node-version: "22.22.2"
      - name: Test the identity provider before building it
        id: policy_step_06
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') && (inputs.action == 'deploy') }}
        run: npm test --prefix deploy/oauth-idp
      - name: Operate identity provider
        id: policy_step_07
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          ACTION: ${{ inputs.action }}
          SOURCE_SHA: ${{ github.sha }}
          IDP_LANE: ${{ inputs.lane }}
          IDP_PUBLIC_URL: ${{ inputs.public_url || (inputs.lane == 'production' && vars.IDP_PUBLIC_URL) || '' }}
          CLOUDRU_PROJECT_ID: ${{ vars.CLOUDRU_PROJECT_ID }}
          CLOUDRU_IAM_KEY_ID: ${{ secrets.CLOUDRU_IAM_KEY_ID }}
          CLOUDRU_IAM_KEY_SECRET: ${{ secrets.CLOUDRU_IAM_KEY_SECRET }}
          # The lanes never share signing keys.
          IDP_SECRET: ${{ inputs.lane == 'production' && secrets.IDP_SECRET || secrets.IDP_TEST_SECRET }}
          # Each lane receives only its own sign-in credentials.
          IDP_GITHUB_CLIENT_ID: ${{ inputs.lane == 'production' && secrets.IDP_GITHUB_CLIENT_ID || '' }}
          IDP_GITHUB_CLIENT_SECRET: ${{ inputs.lane == 'production' && secrets.IDP_GITHUB_CLIENT_SECRET || '' }}
          IDP_OWNER_PASSPHRASE: ${{ inputs.lane == 'test' && secrets.IDP_TEST_PASSPHRASE || '' }}
          ALICE_GITHUB_ALLOWED_IDS: ${{ vars.ALICE_GITHUB_ALLOWED_IDS || '293531601' }}
        run: python scripts/cloudru_idp.py "$ACTION" --sha "$SOURCE_SHA"
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
