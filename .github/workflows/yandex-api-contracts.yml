name: Yandex API contracts

on:
  pull_request:
    branches: [develop]
    paths:
      - api/**
      - contracts/yandex/**
      - yandex_client_modules/**
      - workspace/files.py
      - provider_accounts/model_discovery.py
      - agent_memory/extractor.py
      - chat/voice_routes.py
      - scripts/**
      - tests/test_yandex*.py
      - tests/test_model_discovery.py
      - tests/test_semantic*.py
      - tests/test_q14*.py
      - tests/test_pr_court*.py
      - tests/test_voice_routes.py
      - tests/test_native_memory_services.py
      - requirements*.txt
      - .github/workflows/yandex-api-contracts.yml

permissions:
  contents: read

concurrency:
  group: yandex-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Yandex request contracts (offline pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - name: Checkout exact PR head
        id: checkout
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python
        id: python
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            contracts/yandex/requirements.txt
      - name: Install runtime and focused test dependencies
        id: dependencies
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: python -m pip install -r requirements.txt -c requirements-dev.txt pytest PyYAML
      - name: Validate outbound contracts and consumers without provider credentials
        id: contracts
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          git rev-parse HEAD
          python -m pytest -q tests/test_yandex*.py tests/test_model_discovery.py \
            tests/test_semantic_pipeline.py tests/test_semantic_vector_store.py \
            tests/test_semantic_task_search.py tests/test_q14*.py tests/test_pr_court*.py \
            tests/test_voice_routes.py tests/test_native_memory_services.py \
            tests/test_api_contracts.py tests/test_provider_quotas.py
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
