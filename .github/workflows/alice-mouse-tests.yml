name: Alice Mouse isolated tests

on:
  pull_request:
    paths:
      - 'tests/alice_mouse/**'
      - '.github/workflows/alice-mouse-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alice-mouse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build harmless C fixture
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O2 \
            tests/alice_mouse/alice_mouse_test_fixture.c \
            -o tests/alice_mouse/alice_mouse_test_fixture
      - name: Verify isolated suite and wall clock
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s%N)
          python tests/alice_mouse/parallel_runner.py
          end=$(date +%s%N)
          python -c 'import sys; n=int(sys.argv[1])-int(sys.argv[2]); print(f"Full command wall: {n/1e9:.3f}s")' "$end" "$start"
