name: Apply Supabase migrations

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply production migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: latest

      - name: Validate migration directory
        shell: bash
        run: test -d supabase/migrations && test -n "$(find supabase/migrations -type f -name '*.sql' -print -quit)"

      - name: Validate Supabase CLI credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_?*) ;;
            *)
              echo "::error::SUPABASE_ACCESS_TOKEN must be a Supabase CLI personal access token (sbp_ format)."
              exit 1
              ;;
          esac

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'nawtxxvlodnyzwpwsmdl' }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --yes

      - name: Verify migration state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list
