name: Apply Supabase migrations

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply production migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate migration directory
        shell: bash
        run: test -d supabase/migrations && test -n "$(find supabase/migrations -type f -name '*.sql' -print -quit)"

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'nawtxxvlodnyzwpwsmdl' }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Supabase Management API token is unavailable; configure the SUPABASE_MANAGEMENT_TOKEN GitHub secret."; exit 1; }
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Repair stale remote migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          # The remote project contains a dashboard-created migration that is
          # not present in this repository. Mark only that stale entry as
          # reverted so the repository migrations can be applied normally.
          supabase migration repair --status reverted 20260917171258

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: supabase db push --yes

      - name: Verify migration state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: supabase migration list
