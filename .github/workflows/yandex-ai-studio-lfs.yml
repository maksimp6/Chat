name: Publish admitted Russian AI Studio LFS snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yandex-ai-studio-lfs-snapshot
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'maksimp6/Chat' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/docs/yandex-documentation-links')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        with:
          persist-credentials: false
          lfs: false
      - name: Restore exact upstream source bytes recorded in manifest
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --connect-timeout 15 --max-time 300 \
            --output "$RUNNER_TEMP/source.tar.gz" \
            https://codeload.github.com/yandex-cloud/docs/tar.gz/fddbac0226d030d57d089b730f92abd02e583df2
          python - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path('docs/mirrors/yandex-ai-studio')
          manifest = json.loads((root / 'manifest.json').read_text())
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source.tar.gz'
          digest = hashlib.file_digest(source.open('rb'), 'sha256').hexdigest()
          assert digest == manifest['source_download_sha256'], 'Upstream archive digest mismatch'
          prefix = 'docs-' + manifest['source_revision'] + '/'
          expected = {prefix + e['source_path']: e for e in manifest['files']}
          found = set()
          with tarfile.open(source, 'r|gz') as archive:
              for member in archive:
                  if member.name not in expected:
                      continue
                  entry = expected[member.name]
                  destination = pathlib.PurePosixPath(entry['path'])
                  assert not destination.is_absolute() and '..' not in destination.parts
                  assert destination.parts[0] == 'source' and member.isfile()
                  assert 0 <= member.size == entry['bytes'] <= 16 * 1024 * 1024
                  assert member.name not in found, 'Duplicate upstream member'
                  data = archive.extractfile(member).read()
                  assert hashlib.sha256(data).hexdigest() == entry['sha256'], entry['path']
                  (root / destination).parent.mkdir(parents=True, exist_ok=True)
                  (root / destination).write_bytes(data)
                  found.add(member.name)
          assert found == expected.keys(), 'Missing upstream files'
          assert not any(e['source_path'].startswith('en/') for e in manifest['files'])
          print(f"SOURCE_BYTES_VERIFIED files={len(found)} bytes={manifest['total_bytes']}")
          PY
      - name: Upload LFS objects and independently download them
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git lfs install --local
          git add docs/mirrors/yandex-ai-studio/source
          git diff --cached --exit-code
          git lfs fsck
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth_header"
          python - <<'PY' > "$RUNNER_TEMP/admitted-lfs-oids"
          import json, pathlib
          manifest = json.loads(pathlib.Path('docs/mirrors/yandex-ai-studio/manifest.json').read_text())
          print('\n'.join(entry['sha256'] for entry in manifest['files']))
          PY
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            lfs push --object-id origin --stdin < "$RUNNER_TEMP/admitted-lfs-oids"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            -c lfs.storage="$RUNNER_TEMP/independent-lfs" \
            lfs fetch --include="docs/mirrors/yandex-ai-studio/source/**" --exclude="" origin "$GITHUB_SHA"
          python - <<'PY'
          import hashlib, json, os, pathlib
          manifest = json.loads(pathlib.Path('docs/mirrors/yandex-ai-studio/manifest.json').read_text())
          cache = pathlib.Path(os.environ['RUNNER_TEMP']) / 'independent-lfs' / 'objects'
          for entry in manifest['files']:
              oid = entry['sha256']
              data = (cache / oid[:2] / oid[2:4] / oid).read_bytes()
              assert len(data) == entry['bytes'], entry['path']
              assert hashlib.sha256(data).hexdigest() == oid, entry['path']
          message = f"LFS_REMOTE_DOWNLOAD_VERIFIED files={len(manifest['files'])} bytes={manifest['total_bytes']} head={os.environ['GITHUB_SHA']}"
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(message + '\n')
          PY
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
