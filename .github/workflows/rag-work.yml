name: RAG work
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "index | query | logos | logos-result | logos-response | logos-tools"
        required: true
        default: "query"
      query:
        description: "query, Logos question, run ID (logos-result), or response UUID (logos-response); unused for logos-tools"
        required: false
        default: ""
      publish_issue:
        description: "issue number for the report"
        required: false
        default: ""
      case_issue:
        description: "Canonical issue whose complete discussion forms the initial context"
        required: false
        default: "1413"
      case_pr:
        description: "PR whose full discussion and reviews form the initial context"
        required: false
        default: "1435"
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: rag-work-${{ inputs.mode || 'query' }}
  cancel-in-progress: false

jobs:
  rag:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode != 'logos' && inputs.mode != 'logos-result' && inputs.mode != 'logos-response' && inputs.mode != 'logos-tools') || github.event.label.name == 'rag-query'
    name: RAG index or query
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run RAG pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAG_MODE: ${{ inputs.mode || 'query' }}
          RAG_QUERY: ${{ inputs.query }}
          RAG_PUBLISH_ISSUE: ${{ inputs.publish_issue || github.event.issue.number }}
        run: |
          set -eu
          if [ "$RAG_MODE" = "index" ]; then
            python scripts/rag_pipeline.py --mode index
          else
            if [ -n "$RAG_QUERY" ]; then
              printf '%s\n' "$RAG_QUERY" > /tmp/rag_query.txt
            else
              # label event: the issue body holds the question
              python -c "import json,os,urllib.request; r=urllib.request.Request('https://api.github.com/repos/maksimp6/Chat/issues/'+os.environ['RAG_PUBLISH_ISSUE'], headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'User-Agent':'rag-runner'}); open('/tmp/rag_query.txt','w').write(json.load(urllib.request.urlopen(r)).get('body') or '')"
              # keep only the part after the separator line, if present
              if grep -q '^---$' /tmp/rag_query.txt; then
                sed -n '/^---$/,$p' /tmp/rag_query.txt | tail -n +2 > /tmp/rag_query2.txt
                mv /tmp/rag_query2.txt /tmp/rag_query.txt
              fi
            fi
            python scripts/rag_pipeline.py --mode query --publish-issue "$RAG_PUBLISH_ISSUE" --query-file /tmp/rag_query.txt
          fi

  logos:
    # Court decision #1413 D0: a new generation needs LOGOS_GENERATION_ALLOWED=true;
    # reading a saved response and the offline tool audit stay available.
    if: github.event_name == 'workflow_dispatch' && ((inputs.mode == 'logos' && vars.LOGOS_GENERATION_ALLOWED == 'true') || inputs.mode == 'logos-response' || inputs.mode == 'logos-tools')
    name: Run Logos or inspect runtime tools and saved responses
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      discussions: read
    steps:
      - name: Save question
        if: inputs.mode != 'logos-tools'
        env:
          LOGOS_QUESTION: ${{ inputs.query }}
        run: |
          set -euo pipefail
          test -n "$LOGOS_QUESTION" || { echo '::error::A question is required.'; exit 1; }
          printf '%s' "$LOGOS_QUESTION" > "$RUNNER_TEMP/logos-question.txt"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce native Logos court hold
        if: inputs.mode == 'logos'
        run: python -m agent_runtime.logos_launch_hold

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Capture complete initial context
        if: inputs.mode == 'logos'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOGOS_CASE_ISSUE: ${{ inputs.case_issue || '1413' }}
          LOGOS_CASE_PR: ${{ inputs.case_pr || '1435' }}
        run: |
          python -m scripts.logos_context \
            --repo-root "$GITHUB_WORKSPACE" \
            --issue "$LOGOS_CASE_ISSUE" --pr "$LOGOS_CASE_PR" --reference-case \
            --owner-context-file docs/agents/logos-native-quality.md \
            --out "$RUNNER_TEMP/logos-context.json"

      - name: Attach complete case to existing project knowledge
        if: inputs.mode == 'logos'
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
        run: |
          python -m scripts.logos_knowledge \
            --context-file "$RUNNER_TEMP/logos-context.json" \
            --cache-owner "$GITHUB_REPOSITORY_OWNER" \
            --cache-access-scope "repository:$GITHUB_REPOSITORY" \
            --out "$RUNNER_TEMP/logos-knowledge.json"

      - name: Audit native Logos tools
        if: inputs.mode == 'logos-tools'
        run: |
          set -euo pipefail
          python -m scripts.logos_tool_probe --external | tee "$RUNNER_TEMP/logos-answer.json"

      - name: Run Logos dialogue or read a saved provider response
        if: inputs.mode != 'logos-tools'
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          LOGOS_MODE: ${{ inputs.mode }}
          LOGOS_GENERATION_ALLOWED: ${{ vars.LOGOS_GENERATION_ALLOWED }}
        run: |
          set -euo pipefail
          ALICE_PROVIDER_CREDENTIAL_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export ALICE_PROVIDER_CREDENTIAL_KEY
          export ALICE_MEMORY_PATH="$RUNNER_TEMP/logos-dialogue.memory"
          case "$LOGOS_MODE" in
            logos)
              python -m scripts.logos_dialogue \
                --question-file "$RUNNER_TEMP/logos-question.txt" \
                --context-file "$RUNNER_TEMP/logos-context.json" \
                --knowledge-file "$RUNNER_TEMP/logos-knowledge.json" \
                --out "$RUNNER_TEMP/logos-answer.json"
              ;;
            logos-response)
              python -m scripts.logos_dialogue \
                --response-id "$(cat "$RUNNER_TEMP/logos-question.txt")" \
                --out "$RUNNER_TEMP/logos-answer.json"
              ;;
            *) echo '::error::Unsupported Logos mode.'; exit 1 ;;
          esac

      - name: Capture native Logos changes for review
        if: always() && inputs.mode == 'logos'
        env:
          LOGOS_BASE_SHA: ${{ github.sha }}
        run: |
          python -I - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          allowed = (
              "tool_providers/registry.py", "tool_providers/universal_tool_platform.py",
              "tool_providers/filesystem.py", "yandex_client_modules/mcp_mixin.py",
              "tests/test_tool_registry.py", "tests/test_universal_tool_platform.py",
              "tests/test_logos_tool_probe.py", "scripts/logos_tool_probe.py",
              "tests/test_logos_tool_repairs.py",
              "scripts/logos_dialogue.py", "scripts/logos_quality.py",
              "scripts/logos_context.py", "scripts/logos_knowledge.py",
              "agent_runtime/responses_tool_loop.py", "chat/mcp_routes.py",
              "yandex_client_modules/request_builder.py", "yandex_client_modules/request_mixin.py",
              "tests/test_logos_dialogue.py", "tests/test_logos_quality.py",
              "tests/test_logos_context.py", "tests/test_logos_knowledge.py",
              "tests/test_logos_continuation_quality.py", "core/config.py",
              "scripts/logos_project_tools.py", "tests/test_logos_project_tools.py",
              "invocation/manager.py", "tests/test_invocation_large_values.py",
          )
          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True).stdout
          base = os.environ["LOGOS_BASE_SHA"]
          new_test = Path("tests/test_logos_tool_repairs.py")
          if new_test.is_file() or new_test.is_symlink():
              git("add", "--intent-to-add", "--", str(new_test))
          changed = git("diff", "--no-ext-diff", "--no-textconv", "--no-renames", "--name-only", "-z", base, "--")
          untracked = git("ls-files", "--others", "--exclude-standard", "-z")
          patch = git("diff", "--no-ext-diff", "--no-textconv", "--no-renames", base, "--", *allowed).decode("utf-8", errors="replace")
          result = {
              "base_sha": base,
              "head_sha": git("rev-parse", "HEAD").decode().strip(),
              "changed_paths": sorted({name.decode("utf-8", errors="replace") for name in (changed + untracked).split(b"\0") if name}),
              "patch": patch,
              "patch_sha256": hashlib.sha256(patch.encode("utf-8")).hexdigest(),
          }
          encoded = json.dumps(result, ensure_ascii=False)
          (Path(os.environ["RUNNER_TEMP"]) / "logos-changes.json").write_text(encoded, encoding="utf-8")
          print("LOGOS_CHANGES=" + encoded)
          PY

      - name: Save native Logos changes for review
        if: always() && inputs.mode == 'logos'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logos-changes-${{ github.run_id }}
          path: ${{ runner.temp }}/logos-changes.json
          if-no-files-found: warn
          retention-days: 7

      - name: Save dialogue result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logos-answer-${{ github.run_id }}
          path: ${{ runner.temp }}/logos-answer.json
          if-no-files-found: warn
          retention-days: 7

  logos-result:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'logos-result'
    name: Read a saved Logos answer
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Read existing result without calling the model
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOGOS_SOURCE_RUN: ${{ inputs.query }}
        run: |
          set -euo pipefail
          [[ "$LOGOS_SOURCE_RUN" =~ ^[1-9][0-9]*$ ]] || { echo '::error::A numeric run ID is required.'; exit 1; }
          gh run download "$LOGOS_SOURCE_RUN" \
            --name "logos-answer-$LOGOS_SOURCE_RUN" --dir "$RUNNER_TEMP/logos-result"
          python - "$RUNNER_TEMP/logos-result/logos-answer.json" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("LOGOS_RESULT=" + json.dumps(result, ensure_ascii=False))
          PY
