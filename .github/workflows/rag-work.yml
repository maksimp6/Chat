name: RAG work
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "index | query"
        required: true
        default: "query"
      query:
        description: "query text (for query mode)"
        required: false
        default: ""
      publish_issue:
        description: "issue number to publish report to"
        required: false
        default: ""
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  rag:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'rag-query'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run RAG pipeline
        env:
          QUERY: ${{ inputs.query }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            ISSUE_NUM="${{ github.event.issue.number }}"
            printf '%s' '${{ github.event.issue.body }}' > /tmp/issue_body.txt
            python scripts/rag_pipeline.py --mode query --publish-issue "$ISSUE_NUM" --query-file /tmp/issue_body.txt
          else
            MODE="${{ inputs.mode }}"
            if [ "$MODE" = "index" ]; then
              python scripts/rag_pipeline.py --mode index
            else
              python scripts/rag_pipeline.py --mode query \
                --publish-issue "${{ inputs.publish_issue }}" \
                --query "$QUERY"
            fi
          fi
