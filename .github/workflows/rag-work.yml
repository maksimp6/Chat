name: RAG work
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "index | query | logos | logos-result | logos-response"
        required: true
        default: "query"
      query:
        description: "query, Logos question, run ID (logos-result), or response UUID (logos-response)"
        required: false
        default: ""
      publish_issue:
        description: "issue number for the report"
        required: false
        default: ""
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: rag-work-${{ inputs.mode || 'query' }}
  cancel-in-progress: false

jobs:
  rag:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode != 'logos' && inputs.mode != 'logos-result' && inputs.mode != 'logos-response') || github.event.label.name == 'rag-query'
    name: RAG index or query
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run RAG pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAG_MODE: ${{ inputs.mode || 'query' }}
          RAG_QUERY: ${{ inputs.query }}
          RAG_PUBLISH_ISSUE: ${{ inputs.publish_issue || github.event.issue.number }}
        run: |
          set -eu
          if [ "$RAG_MODE" = "index" ]; then
            python scripts/rag_pipeline.py --mode index
          else
            if [ -n "$RAG_QUERY" ]; then
              printf '%s\n' "$RAG_QUERY" > /tmp/rag_query.txt
            else
              # label event: the issue body holds the question
              python -c "import json,os,urllib.request; r=urllib.request.Request('https://api.github.com/repos/maksimp6/Chat/issues/'+os.environ['RAG_PUBLISH_ISSUE'], headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'User-Agent':'rag-runner'}); open('/tmp/rag_query.txt','w').write(json.load(urllib.request.urlopen(r)).get('body') or '')"
              # keep only the part after the separator line, if present
              if grep -q '^---$' /tmp/rag_query.txt; then
                sed -n '/^---$/,$p' /tmp/rag_query.txt | tail -n +2 > /tmp/rag_query2.txt
                mv /tmp/rag_query2.txt /tmp/rag_query.txt
              fi
            fi
            python scripts/rag_pipeline.py --mode query --publish-issue "$RAG_PUBLISH_ISSUE" --query-file /tmp/rag_query.txt
          fi

  logos:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'logos' || inputs.mode == 'logos-response')
    name: Run Logos or inspect a saved provider response
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Save question
        env:
          LOGOS_QUESTION: ${{ inputs.query }}
        run: |
          set -euo pipefail
          test -n "$LOGOS_QUESTION" || { echo '::error::A question is required.'; exit 1; }
          printf '%s' "$LOGOS_QUESTION" > "$RUNNER_TEMP/logos-question.txt"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Logos dialogue or read a saved provider response
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
          LOGOS_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ALICE_PROVIDER_CREDENTIAL_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export ALICE_PROVIDER_CREDENTIAL_KEY
          export ALICE_MEMORY_PATH="$RUNNER_TEMP/logos-dialogue.memory"
          case "$LOGOS_MODE" in
            logos)
              python -m scripts.logos_dialogue \
                --question-file "$RUNNER_TEMP/logos-question.txt" \
                --out "$RUNNER_TEMP/logos-answer.json"
              ;;
            logos-response)
              python -m scripts.logos_dialogue \
                --response-id "$(cat "$RUNNER_TEMP/logos-question.txt")" \
                --out "$RUNNER_TEMP/logos-answer.json"
              ;;
            *) echo '::error::Unsupported Logos mode.'; exit 1 ;;
          esac

      - name: Save dialogue result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logos-answer-${{ github.run_id }}
          path: ${{ runner.temp }}/logos-answer.json
          if-no-files-found: warn
          retention-days: 7

  logos-result:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'logos-result'
    name: Read a saved Logos answer
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Read existing result without calling the model
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOGOS_SOURCE_RUN: ${{ inputs.query }}
        run: |
          set -euo pipefail
          [[ "$LOGOS_SOURCE_RUN" =~ ^[1-9][0-9]*$ ]] || { echo '::error::A numeric run ID is required.'; exit 1; }
          gh run download "$LOGOS_SOURCE_RUN" \
            --name "logos-answer-$LOGOS_SOURCE_RUN" --dir "$RUNNER_TEMP/logos-result"
          python - "$RUNNER_TEMP/logos-result/logos-answer.json" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("LOGOS_RESULT=" + json.dumps(result, ensure_ascii=False))
          PY
