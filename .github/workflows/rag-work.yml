name: RAG work
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "index | query"
        required: true
        default: "query"
      query:
        description: "query text (query mode)"
        required: false
        default: ""
      publish_issue:
        description: "issue number for the report"
        required: false
        default: ""
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: rag-work
  cancel-in-progress: true

jobs:
  rag:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'rag-query'
    name: RAG index or query
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run RAG pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAG_MODE: ${{ inputs.mode || 'query' }}
          RAG_QUERY: ${{ inputs.query }}
          RAG_PUBLISH_ISSUE: ${{ inputs.publish_issue || github.event.issue.number }}
        run: |
          set -eu
          if [ "$RAG_MODE" = "index" ]; then
            python scripts/rag_pipeline.py --mode index
          else
            if [ -n "$RAG_QUERY" ]; then
              printf '%s\n' "$RAG_QUERY" > /tmp/rag_query.txt
            else
              # label event: the issue body holds the question
              python - <<'PYEOF'
              import json, os, urllib.request
              req = urllib.request.Request(
                  "https://api.github.com/repos/maksimp6/Chat/issues/" + os.environ["RAG_PUBLISH_ISSUE"],
                  headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "User-Agent": "rag-runner"},
              )
              body = json.load(urllib.request.urlopen(req)).get("body") or ""
              open("/tmp/rag_query.txt", "w").write(body)
              PYEOF
            fi
            python scripts/rag_pipeline.py --mode query --publish-issue "$RAG_PUBLISH_ISSUE" --query-file /tmp/rag_query.txt
          fi
