name: logos

on:
  workflow_dispatch:
    inputs:
      query:
        description: Question for Logos
        required: true
        type: string
      case_issue:
        description: Canonical case
        default: "1413"
        required: true
        type: string
      case_pr:
        description: Reference PR
        default: "1435"
        required: true
        type: string

permissions: {}

concurrency:
  group: logos-once
  cancel-in-progress: false

jobs:
  logos:
    name: logos
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      discussions: read
    steps:
      - name: logos
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOGOS_QUESTION: ${{ inputs.query }}
          LOGOS_CASE_ISSUE: ${{ inputs.case_issue }}
          LOGOS_CASE_PR: ${{ inputs.case_pr }}
          LOGOS_GENERATION_ALLOWED: ${{ vars.LOGOS_GENERATION_ALLOWED }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_PROJECT_ID: ${{ secrets.YANDEX_PROJECT_ID }}
        run: |
          set -euo pipefail
          export JOB_STARTED_NS="$(python3 -c 'import time; print(time.monotonic_ns())')"
          finish() {
            export LOGOS_EXECUTION_EXIT="$?"
            trap - EXIT
            set +e
            python3 -I - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          started = int(os.environ["JOB_STARTED_NS"])
          elapsed = time.monotonic_ns() - started
          if started < 0 or elapsed < 0:
              raise ValueError("Invalid job clock")
          execution_exit = int(os.environ["LOGOS_EXECUTION_EXIT"])
          failed = bool(execution_exit)
          override = elapsed > 30_000_000_000 and failed
          result = "PASS" if not failed or override else "FAIL"
          report = (
              f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
              f"overridden={str(override).lower()}; original failures={'logos' if failed else 'none'}; "
              f"execution_exit={execution_exit}. Policy PASS does not mean VERIFIED."
          )
          print(report)
          if override:
              print("::warning::" + report)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(report + "\n")
          raise SystemExit(int(failed and not override))
          PY
            exit "$?"
          }
          trap finish EXIT
          test "$GITHUB_REPOSITORY" = "maksimp6/Chat"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c credential.helper= fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/logos_once.py
