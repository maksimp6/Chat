name: Yorik A1 mini slice and Redmi 9 handoff

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/yorik-redmi9.yml"
      - "3d-models/yorik/**"
      - "scripts/yorik_*.py"
      - "tests/test_yorik_runner.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yorik-slice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slice:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned existing slicer contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maksimp6/Chat
          ref: 02c4389e88ca6fbcc522c9564c0051a81676c804
          path: slicer-base
          persist-credentials: false
      - name: Test bounded Android worker
        run: python3 -m unittest discover -s tests -p test_yorik_runner.py -v
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            openscad libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0 libegl1
      - name: Verify pinned official Bambu Studio
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/bambulab/BambuStudio/releases/download/v02.08.02.61/BambuStudio_ubuntu22.04-v02.08.02.61-20260820225108.AppImage' \
            --output BambuStudio.AppImage
          printf '%s  %s\n' '69426a59682574591590f51c913d3889baa19252d1c8e9fcae2497eb0ed6bf92' \
            'BambuStudio.AppImage' | sha256sum --check
          chmod +x BambuStudio.AppImage
          ./BambuStudio.AppImage --appimage-extract >/dev/null
      - name: Build and slice Yorik
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: ${{ github.workspace }}/slicer-base/scripts
        run: |
          set -euo pipefail
          mkdir -p out
          openscad --hardwarnings --export-format binstl -o out/yorik.stl 3d-models/yorik/yorik.scad
          python3 scripts/yorik_slice.py --slicer-root "$GITHUB_WORKSPACE/squashfs-root" \
            --mesh "$GITHUB_WORKSPACE/out/yorik.stl" --output-dir "$GITHUB_WORKSPACE/out"
          cp scripts/yorik_runner.py out/yorik_runner.py
      - name: Publish exact-head bounded handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yorik-a1mini-redmi9
          path: |
            out/Yorik_A1mini_PLA.gcode.3mf
            out/audit.json
            out/preview.png
            out/yorik_runner.py
          if-no-files-found: error
          retention-days: 7
