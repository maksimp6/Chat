name: Yorik A1 mini slice and Redmi 9 handoff

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/yorik-redmi9.yml"
      - "3d-models/yorik/**"
      - "scripts/yorik_*.py"
      - "tests/test_yorik_runner.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yorik-slice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slice:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Start job reporting clock
        id: job_policy_clock
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import time
          print(f"started_ns={time.monotonic_ns()}")
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: policy_step_01
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned existing slicer contracts
        id: policy_step_02
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maksimp6/Chat
          ref: 02c4389e88ca6fbcc522c9564c0051a81676c804
          path: slicer-base
          persist-credentials: false
      - name: Test bounded Android worker
        id: policy_step_03
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: python3 -m unittest discover -s tests -p test_yorik_runner.py -v
      - name: Install native build dependencies
        id: policy_step_04
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            openscad libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0 libegl1
      - name: Verify pinned official Bambu Studio
        id: policy_step_05
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/bambulab/BambuStudio/releases/download/v02.08.02.61/BambuStudio_ubuntu22.04-v02.08.02.61-20260820225108.AppImage' \
            --output BambuStudio.AppImage
          printf '%s  %s\n' '69426a59682574591590f51c913d3889baa19252d1c8e9fcae2497eb0ed6bf92' \
            'BambuStudio.AppImage' | sha256sum --check
          chmod +x BambuStudio.AppImage
          ./BambuStudio.AppImage --appimage-extract >/dev/null
      - name: Build and slice Yorik
        id: policy_step_06
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: ${{ github.workspace }}/slicer-base/scripts
        run: |
          set -euo pipefail
          mkdir -p out
          openscad --hardwarnings --export-format binstl -o out/yorik.stl 3d-models/yorik/yorik.scad
          python3 scripts/yorik_slice.py --slicer-root "$GITHUB_WORKSPACE/squashfs-root" \
            --mesh "$GITHUB_WORKSPACE/out/yorik.stl" --output-dir "$GITHUB_WORKSPACE/out"
          cp scripts/yorik_runner.py out/yorik_runner.py
      - name: Publish exact-head bounded handoff
        id: policy_step_07
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yorik-a1mini-redmi9
          path: |
            out/Yorik_A1mini_PLA.gcode.3mf
            out/audit.json
            out/preview.png
            out/yorik_runner.py
          if-no-files-found: error
          retention-days: 7
      - name: Preserve source geometry for repository model packaging
        id: policy_step_08
        continue-on-error: true
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yorik-source-stl
          path: out/yorik.stl
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed slicing diagnostics
        id: policy_step_09
        continue-on-error: true
        if: ${{ !cancelled() && !contains(steps.*.outcome, 'failure') && !contains(steps.*.outcome, 'cancelled') && (failure()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yorik-slice-diagnostics
          path: |
            out/result.json
            out/a1mini_process.json
          if-no-files-found: warn
          retention-days: 7
      - name: Apply owner job result policy (over 30s passes)
        id: job_policy_result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB_STARTED_NS: ${{ steps.job_policy_clock.outputs.started_ns }}
          JOB_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          """Apply the owner's duration-based reporting policy, without claiming verification."""

          import json
          import os
          import time
          from pathlib import Path


          def main() -> int:
              started = int(os.environ["JOB_STARTED_NS"])
              elapsed = time.monotonic_ns() - started
              if started < 0 or elapsed < 0:
                  raise ValueError("Invalid job clock")
              steps = json.loads(os.environ["JOB_STEP_RESULTS"])
              failed = [name for name, step in steps.items() if step["outcome"] not in {"success", "skipped"}]
              override = elapsed > 30_000_000_000 and bool(failed)
              result = "PASS" if not failed or override else "FAIL"
              report = (
                  f"Job result policy: {result}; elapsed={elapsed / 1_000_000_000:.3f}s; "
                  f"overridden={str(override).lower()}; original failures={','.join(failed) or 'none'}. "
                  "Policy PASS does not mean VERIFIED."
              )
              print(report)
              if override:
                  print("::warning::" + report)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write(report + "\n")
              return int(bool(failed) and not override)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
