name: Preview deployment after master push

on:
  push:
    branches: [master]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-preview:
    name: Dispatch preview deployment
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch preview workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run preview-deploy.yml --repo "$GITHUB_REPOSITORY" --ref master -f ref=master
