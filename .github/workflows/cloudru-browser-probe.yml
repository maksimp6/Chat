name: Cloud.ru browser compatibility probe
on:
  workflow_dispatch:
    inputs:
      action:
        description: Run browser probe or check name availability without creating resources
        type: choice
        default: probe
        options:
          - probe
          - name_preflight
      check_name:
        description: Previous rdc probe name to inspect (name_preflight only)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: alice-cloudru-browser-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require reviewed master commit
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build and run isolated browser probe
        env:
          CLOUDRU_PROJECT_ID: ${{ vars.CLOUDRU_PROJECT_ID }}
          CLOUDRU_IAM_KEY_ID: ${{ secrets.CLOUDRU_IAM_KEY_ID }}
          CLOUDRU_IAM_KEY_SECRET: ${{ secrets.CLOUDRU_IAM_KEY_SECRET }}
          SOURCE_SHA: ${{ github.sha }}
          PROBE_ACTION: ${{ inputs.action || 'probe' }}
          CHECK_NAME: ${{ inputs.check_name || '' }}
        run: python scripts/cloudru_browser_probe.py --sha "$SOURCE_SHA" --action "$PROBE_ACTION" --check-name "$CHECK_NAME"
