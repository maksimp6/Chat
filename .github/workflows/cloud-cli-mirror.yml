name: Publish Cloud.ru CLI mirror

on:
  push:
    branches:
      - chore/clean-codex-toolchain
    paths:
      - scripts/cache_cloud_cli.sh
      - scripts/install_cloud_cli.sh
      - scripts/cloud_cli_checksums.txt
      - .github/workflows/cloud-cli-mirror.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cloud-cli-mirror
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified Cloud.ru CLI mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refresh official cache
        env:
          CLOUD_CLI_CACHE_DIR: ${{ runner.temp }}/cloud-cli
        run: bash scripts/cache_cloud_cli.sh --force

      - name: Verify recorded checksums
        env:
          CLOUD_CLI_CACHE_DIR: ${{ runner.temp }}/cloud-cli
        run: |
          set -euo pipefail
          cp scripts/cloud_cli_checksums.txt "$CLOUD_CLI_CACHE_DIR/EXPECTED"
          grep -v '^#' "$CLOUD_CLI_CACHE_DIR/EXPECTED" > "$CLOUD_CLI_CACHE_DIR/EXPECTED.clean"
          (
            cd "$CLOUD_CLI_CACHE_DIR"
            sha256sum --check EXPECTED.clean
          )

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: cloud-cli-mirror-2026-09-27
          CLOUD_CLI_CACHE_DIR: ${{ runner.temp }}/cloud-cli
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$CLOUD_CLI_CACHE_DIR/cloud-cli-linux-amd64.tar.gz" \
              "$CLOUD_CLI_CACHE_DIR/cloud-cli-linux-arm64.tar.gz" \
              "$CLOUD_CLI_CACHE_DIR/SHA256SUMS" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Cloud.ru CLI mirror 2026-09-27" \
              --notes "Verified mirror used by Alice Pro/Codex setup. Official downloads are fetched only by scripts/cache_cloud_cli.sh." \
              "$CLOUD_CLI_CACHE_DIR/cloud-cli-linux-amd64.tar.gz" \
              "$CLOUD_CLI_CACHE_DIR/cloud-cli-linux-arm64.tar.gz" \
              "$CLOUD_CLI_CACHE_DIR/SHA256SUMS"
          fi

      - name: Verify mirrored assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: cloud-cli-mirror-2026-09-27
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets


      - name: Report mirror publication to pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: cloud-cli-mirror-2026-09-27
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" --body "Cloud.ru CLI mirror published: \`$TAG\` with amd64, arm64, and SHA256SUMS assets."
          fi
