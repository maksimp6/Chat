name: Redmi 9 Alice AI ART generation

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: redmi9-app-server
  cancel-in-progress: false

jobs:
  art_generate:
    runs-on: redmi9
    timeout-minutes: 20
    steps:
      - name: Generate one picture through the Redmi 9 app
        shell: bash
        env:
          OUT_DIR: ${{ runner.temp }}/art-real
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          mkdir -p "$OUT_DIR"
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8080"
          OUT = os.environ["OUT_DIR"]
          MODEL = "alice-ai-art"
          PROMPT = "красный круг на белом фоне"
          report = {"steps": []}


          def call(method, path, body=None, timeout=60):
              data = None if body is None else json.dumps(body).encode("utf-8")
              request = urllib.request.Request(
                  BASE + path, data=data, method=method,
                  headers={"Content-Type": "application/json"},
                  )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return response.status, json.loads(response.read().decode("utf-8") or "{}")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode("utf-8", errors="replace")[:500]


          def finish(code):
              with open(os.path.join(OUT, "report.json"), "w", encoding="utf-8") as handle:
                  json.dump(report, handle, ensure_ascii=False, indent=2)
              print(json.dumps(report, ensure_ascii=False)[:2000])
              sys.exit(code)


          status, conv = call("POST", "/api/conversations", {"model": MODEL}, 30)
          conv_id = conv.get("id") if isinstance(conv, dict) else None
          report["steps"].append({"step": "conversation", "status": status, "created": bool(conv_id)})
          if not conv_id:
              finish(1)

          status, started = call("POST", "/api/images/generate",
                                 {"conversation_id": conv_id, "message": PROMPT, "model": MODEL}, 60)
          report["steps"].append({"step": "generate", "status": status,
                                  "body": started if isinstance(started, str) else {k: v for k, v in started.items() if k != "operation_id"}})
          if status != 200 or not isinstance(started, dict) or not started.get("operation_id"):
              finish(1)
          operation_id = started["operation_id"]

          path = "/api/images/operations/%s?conversation_id=%s" % (operation_id, conv_id)
          for attempt in range(40):
              status, state = call("GET", path, None, 60)
              if not isinstance(state, dict):
                  report["steps"].append({"step": "poll", "attempt": attempt, "status": status, "body": state})
                  finish(1)
              report["steps"].append({"step": "poll", "attempt": attempt, "status": status, "state": state.get("status"),
                                      "error": state.get("error")})
              if state.get("status") == "done":
                  reply = str(state.get("reply", ""))
                  match = re.search(r"data:image/(jpeg|png);base64,([A-Za-z0-9+/=]+)", reply)
                  if not match:
                      report["result"] = "done without an image in the reply"
                      finish(1)
                  raw = base64.b64decode(match.group(2), validate=True)
                  extension = "jpg" if match.group(1) == "jpeg" else "png"
                  with open(os.path.join(OUT, "art." + extension), "wb") as handle:
                      handle.write(raw)
                  report["result"] = {"image_bytes": len(raw),
                                      "sha256": hashlib.sha256(raw).hexdigest(),
                                      "mime": "image/" + match.group(1)}
                  finish(0)
              if state.get("status") == "failed":
                  report["result"] = {"failed": state.get("error")}
                  finish(1)
          report["result"] = "timed out"
          finish(1)
          PY

      - name: Keep the picture and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redmi9-art-real
          path: ${{ runner.temp }}/art-real
          if-no-files-found: warn
