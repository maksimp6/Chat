name: Redmi 9 Alice AI ART generation

on:
  workflow_dispatch:
    inputs:
      conversation_id:
        description: Existing conversation to poll; leave empty to start a new one
        required: false
        default: ""
        type: string
      operation_id:
        description: Operation to poll; leave empty to start a new generation
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: redmi9-app-server
  cancel-in-progress: false

jobs:
  art_generate:
    runs-on: redmi9
    timeout-minutes: 1
    steps:
      - name: Start or poll one picture through the Redmi 9 app
        shell: bash
        timeout-minutes: 1
        env:
          OUT_DIR: ${{ runner.temp }}/art-real
          INPUT_CONVERSATION_ID: ${{ inputs.conversation_id }}
          INPUT_OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          mkdir -p "$OUT_DIR"
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8080"
          OUT = os.environ["OUT_DIR"]
          MODEL = "alice-ai-art"
          PROMPT = "красный круг на белом фоне"
          POLLS = 2
          report = {"steps": []}


          def call(method, path, body=None, timeout=25):
              data = None if body is None else json.dumps(body).encode("utf-8")
              request = urllib.request.Request(
                  BASE + path, data=data, method=method,
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return response.status, json.loads(response.read().decode("utf-8") or "{}")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode("utf-8", errors="replace")[:500]


          def finish(code):
              with open(os.path.join(OUT, "report.json"), "w", encoding="utf-8") as handle:
                  json.dump(report, handle, ensure_ascii=False, indent=2)
              print(json.dumps(report, ensure_ascii=False)[:3000])
              sys.exit(code)


          conv_id = os.environ.get("INPUT_CONVERSATION_ID") or None
          operation_id = os.environ.get("INPUT_OPERATION_ID") or None
          report["conversation_id"] = conv_id
          report["operation_id"] = operation_id

          if not operation_id:
              if not conv_id:
                  status, conv = call("POST", "/api/conversations", {"model": MODEL}, 15)
                  conv_id = conv.get("id") if isinstance(conv, dict) else None
                  report["conversation_id"] = conv_id
                  report["steps"].append({"step": "conversation", "status": status, "created": bool(conv_id)})
                  if not conv_id:
                      finish(1)
              status, started = call("POST", "/api/images/generate",
                                     {"conversation_id": conv_id, "message": PROMPT, "model": MODEL}, 25)
              report["steps"].append({"step": "generate", "status": status, "body": started})
              if status != 200 or not isinstance(started, dict) or not started.get("operation_id"):
                  finish(1)
              operation_id = started["operation_id"]
              report["operation_id"] = operation_id

          path = "/api/images/operations/%s?conversation_id=%s" % (operation_id, conv_id)
          for attempt in range(POLLS):
              status, state = call("GET", path, None, 25)
              if not isinstance(state, dict):
                  report["steps"].append({"step": "poll", "attempt": attempt, "status": status, "body": state})
                  finish(1)
              report["steps"].append({"step": "poll", "attempt": attempt, "status": status,
                                      "state": state.get("status"), "error": state.get("error")})
              if state.get("status") == "done":
                  reply = str(state.get("reply", ""))
                  match = re.search(r"data:image/(jpeg|png);base64,([A-Za-z0-9+/=]+)", reply)
                  if not match:
                      report["result"] = "done without an image in the reply"
                      finish(1)
                  raw = base64.b64decode(match.group(2), validate=True)
                  extension = "jpg" if match.group(1) == "jpeg" else "png"
                  with open(os.path.join(OUT, "art." + extension), "wb") as handle:
                      handle.write(raw)
                  report["result"] = {"image_bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest(),
                                      "mime": "image/" + match.group(1)}
                  finish(0)
              if state.get("status") == "failed":
                  report["result"] = {"failed": state.get("error")}
                  finish(1)
          report["result"] = "pending: poll again with operation_id"
          finish(0)
          PY
          if [ -f "$OUT_DIR/art.jpg" ]; then
            echo "picture bytes: $(wc -c < "$OUT_DIR/art.jpg")"
          fi
