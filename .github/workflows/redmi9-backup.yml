name: Redmi 9 - archive Git and all LFS

on:
  push:
  workflow_dispatch:

permissions: {}

# Each archive reads every repository ref; retain only the newest pending trigger.
concurrency:
  group: redmi9-repository-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: redmi9
    timeout-minutes: 15
    steps:
      - name: Native Termux shell - preserve repository and full LFS history
        shell: bash
        timeout-minutes: 15
        run: |
          test "$(/system/bin/getprop ro.product.model)" = 'Redmi 9'
          test "$(uname -m)" = aarch64
          test "$BASH" = /data/data/com.termux/files/usr/bin/bash
          curl --fail --silent --show-error --proto '=https' \
            "https://raw.githubusercontent.com/maksimp6/Chat/$GITHUB_SHA/scripts/redmi_repository_backup.sh" \
            -o "$GITHUB_WORKSPACE/backup.sh"
          bash "$GITHUB_WORKSPACE/backup.sh"
