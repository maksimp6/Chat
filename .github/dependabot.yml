# Dependency update policy: docs/development/dependency-updates.md
#
# Version updates: minor and patch releases of one ecosystem arrive as one
# grouped PR per directory; every major release gets its own PR.
# Security updates are not grouped here and ignore the cooldown and the
# open-pull-requests-limit, so they stay separate and visible.
# Version updates target `develop` (the integration branch); `master` is the
# owner's personal branch and receives no automated PRs.
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, github_actions]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
